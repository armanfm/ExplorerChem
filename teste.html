}
function clientBalanceDateFromUnix(value){

function clientBalanceIsStructuralDivergence(manifest,auditState){
  return Array.isArray(manifest?.massPairs)&&
    manifest.massPairs.length===0&&
    manifest.status==="DIVERGENTE"&&
    auditState==="DIVERGENT";
}
function clientBalanceValidatePairs(manifest,auditState){
  if(!Array.isArray(manifest.massPairs)){
    throw new Error("Mass-pair collection is missing or invalid.");
  }

  const documentMass=
    String(manifest?.schema||"").trim().endsWith("/PrivateDocumentMass/v2");

  /*
   * A structural divergence is intentionally produced without a mass pair.
   * It is accepted only when the private manifest declares DIVERGENTE and the
   * evidence itself is already DIVERGENT on-chain. Result commitments and the
   * blockchain result status are still independently checked immediately after.
   */
  if(clientBalanceIsStructuralDivergence(manifest,auditState)) return;

  const statuses=[];
  for(const pair of manifest.massPairs){
    const attested=
      pair.leftMassMg!==null&&pair.leftMassMg!==undefined&&
      pair.rightMassMg!==null&&pair.rightMassMg!==undefined;
    const expected=
      documentMass&&pair.relationType==="DOCUMENT_MASS_BALANCE"
        ? "NAO_ATESTADO"
        : attested
          ? (BigInt(pair.leftMassMg)===BigInt(pair.rightMassMg)?"CONFORME":"DIVERGENTE")
          : "NAO_ATESTADO";
    const delta=attested
      ? (BigInt(pair.leftMassMg)-BigInt(pair.rightMassMg)).toString()
      : null;
    if(pair.status!==expected||((pair.deltaMg??null)!==delta)){
      throw new Error("Pairwise mass values are not reproducible.");
    }
    statuses.push(expected);
  }
  const overall=documentMass
    ? "NAO_ATESTADO"
    : statuses.includes("DIVERGENTE")
      ? "DIVERGENTE"
      : (statuses.length&&statuses.every(x=>x==="CONFORME")?"CONFORME":"NAO_ATESTADO");
  if(manifest.status!==overall){
    throw new Error("Overall mass verdict is not reproducible.");
  }
}

async function clientBalanceReadMuf(path,proof,evidence,evidenceActorId){
  await clientBalanceEnsureSession();
  const signed=await supabaseClient.storage.from(EVIDENCE_BUCKET).createSignedUrl(path,900);
  if(signed.error) throw signed.error;
  const response=await fetch(signed.data.signedUrl,{cache:'no-store'});
  if(!response.ok) throw new Error('MUF JSON: HTTP '+response.status);
  const bytes=new Uint8Array(await response.arrayBuffer());
  if(!clientBalanceSameHex(ethers.keccak256(bytes),proof.committedHash)) throw new Error('MUF JSON hash differs from the on-chain commitment.');
  const doc=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
  const r=doc.result;
  if(doc.schema!=='ExploreChem/PrivateMUFResult/v1'||!r||r.schema!=='ExploreChem/MUFResult/v1'||doc.calculationVersion!==1||r.calculationVersion!==1) throw new Error('Unsupported MUF result schema.');
  if(!clientBalanceSameHex(r.actorId,evidenceActorId)||!clientBalanceSameHex(r.evidenceId,evidence.evidenceId)||!clientBalanceSameHex(r.expectedEvidenceHash,evidence.evidenceHash)) throw new Error('MUF result ownership/commitment mismatch.');
  if(r.status!==clientProofStatus(proof.status)||Number(r.statusCode)!==Number(proof.status)) throw new Error('MUF verdict differs from the on-chain proof.');
  if(!clientBalanceSameHex(clientBalanceHashStable(doc.methodology),proof.methodologyHash)) throw new Error('MUF methodology hash mismatch.');
  const inputHash=clientBalanceHashStable({domain:'ExploreChem/MUFInputCommitment/v1',evidenceId:evidence.evidenceId,expectedEvidenceHash:evidence.evidenceHash,indexedEvidenceHash:r.indexedEvidenceHash,downloadedDocumentHash:r.downloadedDocumentHash,calculationInputs:r.calculation});
  if(!clientBalanceSameHex(inputHash,proof.inputCommitmentHash)) throw new Error('MUF input commitment mismatch.');
  const c=r.calculation;
  if(c&&c.signedMufMg!=null){
    const input=BigInt(c.referenceInputMassMg),output=BigInt(c.accountedOutputMassMg),delta=input-output,absolute=delta<0n?-delta:delta;
    if(delta!==BigInt(c.signedMufMg)||absolute!==BigInt(c.absoluteMufMg)) throw new Error('MUF arithmetic mismatch.');
    if(input>0n&&BigInt(c.absoluteMufPercentScaled6)!==(absolute*100000000n+input/2n)/input) throw new Error('MUF percentage mismatch.');
  }
  return doc;
}

function clientConsolidationCalculate(rows){
  const groups=new Map(),elements=new Map();
  let massCount=0,elementCount=0,yieldCount=0;
  for(const row of rows){
    const c=row.jsonVerified?row.muf?.calculation:null;
    const e=row.elementalVerified?row.elementalResult?.calculation:null;
    const valid=v=>typeof v==='string'&&/^\d+$/.test(v);
    if(c&&valid(c.referenceInputMassMg)&&valid(c.accountedOutputMassMg)){
      massCount++;
      const type=c.actorType||'UNKNOWN';
      const g=groups.get(type)||{type,input:0n,output:0n,count:0};
      g.input+=BigInt(c.referenceInputMassMg);g.output+=BigInt(c.accountedOutputMassMg);g.count++;
      groups.set(type,g);
    }
    if(e&&valid(e.availableElementMassMg)&&valid(e.accountedElementMassMg)){
      elementCount++;
      // Never combine different elements or stages into one apparent stock balance.
      const key=(c?.actorType||'UNKNOWN')+' / '+e.element;
      const g=elements.get(key)||{key,input:0n,output:0n,count:0,process:0n,product:0n,elementProcess:0n,elementProduct:0n,yieldCount:0};
      g.input+=BigInt(e.availableElementMassMg);g.output+=BigInt(e.accountedElementMassMg);g.count++;
      const streams=e.streams||[];
      if(c&&c.actorType!=='CARRIER'&&clientBalanceSameHex(row.resultId,row.elementalResult.mufProofId)&&streams.length&&streams.every(x=>valid(x.dryMassMg)&&valid(x.containedElementMassMg))){
        const available=streams.filter(x=>x.side==='AVAILABLE');
        const accounted=streams.filter(x=>x.side==='ACCOUNTED');
        const products=accounted.filter(x=>x.streamType==='PRODUCT');
        const closing=accounted.filter(x=>x.streamType==='CLOSING_INVENTORY');
        const sum=(a,k)=>a.reduce((n,x)=>n+BigInt(x[k]),0n);
        const dryIn=sum(available,'dryMassMg'),dryOut=sum(accounted,'dryMassMg');
        const process=dryIn-sum(closing,'dryMassMg');
        const elementProcess=BigInt(e.availableElementMassMg)-sum(closing,'containedElementMassMg');
        if(products.length&&available.length&&available.every(x=>['INPUT','OPENING_INVENTORY'].includes(x.streamType))&&valid(c.referenceInputMassMg)&&valid(c.accountedOutputMassMg)&&dryIn===BigInt(c.referenceInputMassMg)&&dryOut===BigInt(c.accountedOutputMassMg)&&process>0n&&elementProcess>0n){
          g.process+=process;g.product+=sum(products,'dryMassMg');g.elementProcess+=elementProcess;g.elementProduct+=sum(products,'containedElementMassMg');g.yieldCount++;yieldCount++;
        }
      }
      elements.set(key,g);
    }
  }
  return {count:rows.length,massCount,elementCount,yieldCount,groups:[...groups.values()],elements:[...elements.values()]};
}

function clientConsolidationTimeline(rows,key,metric,cumulative){
  const elementMetric=['elementInput','elementOutput','elementDifference','recovery','yield','productRecovery'].includes(metric);
  const ordered=rows.map(row=>{
    const c=row.jsonVerified?row.muf?.calculation:null;
    const e=row.elementalVerified?row.elementalResult?.calculation:null;
    const group=elementMetric?(c?.actorType||'UNKNOWN')+' / '+(e?.element||'UNKNOWN'):c?.actorType||'UNKNOWN';
    return {row,group,unknownElement:elementMetric&&!e&&key.startsWith((c?.actorType||'UNKNOWN')+' / '),time:elementMetric?row.elementalCreatedAt||row.createdAt||row.evidenceCreatedAt:row.createdAt||row.evidenceCreatedAt};
  }).filter(x=>(x.group===key||x.unknownElement)&&Number.isFinite(Number(x.time))&&Number(x.time)>0).sort((a,b)=>Number(a.time)-Number(b.time)||a.row.evidenceId.localeCompare(b.row.evidenceId));

    if(metric==='yield')return Number(g.product*100000000n/g.process)/1e6;
    if(metric==='productRecovery')return Number(g.elementProduct*100000000n/g.elementProcess)/1e6;
    if(metric==='recovery'||metric==='ratio')return g.input>0n?Number(g.output*100000000n/g.input)/1e6:null;
    if(metric==='input'||metric==='elementInput')return Number(g.input)/1e6;
    if(metric==='output'||metric==='elementOutput')return Number(g.output)/1e6;
    return Number(g.input-g.output)/1e6;
  };
  for(const x of ordered){
    const row=x.row,st=row.workflowState||row.state;
    const ok=Number(st?.mufStatus)===2&&Number(st?.elementalStatus)===2;
    all.push(row);if(ok)approved.push(row);
    const own=value([row]);
    const point=(v,items)=>({time:Number(x.time),value:v,id:row.evidenceId,lot:row.manifest?.lotReference||'Sem lote',count:items.length,status:clientProofStatus(st?.mufStatus)+' / '+clientProofStatus(st?.elementalStatus)});
    total.push(point(own===null?null:value(cumulative?all:[row]),cumulative?all:[row]));
    compliant.push(point(ok&&own!==null?value(cumulative?approved:[row]):null,cumulative?approved:ok?[row]:[]));
  }
  return {total,compliant,missing:rows.length-ordered.filter(x=>value([x.row])!==null).length};
}

async function productChainReadDocument(row){
  try{
    const meta=row.evidenceStorage;
    if(!meta?.storage_bucket||!meta.storage_path)throw new Error('Documento de origem sem caminho disponível');
    const signed=await supabaseClient.storage.from(meta.storage_bucket).createSignedUrl(meta.storage_path,900);
    if(signed.error)throw signed.error;
    const response=await fetch(signed.data.signedUrl,{cache:'no-store'});
    if(!response.ok)throw new Error('Documento de origem indisponível nesta sessão');
    const bytes=new Uint8Array(await response.arrayBuffer());
    const algorithm=String(meta.hash_algorithm||'').toUpperCase().replace(/-/g,'');
    let hash;
    if(algorithm==='SHA256')hash='0x'+Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
    else if(algorithm==='KECCAK256')hash=ethers.keccak256(bytes);
    else throw new Error('Algoritmo do documento não reconhecido');
    if(!clientBalanceSameHex(hash,row.evidenceHash))throw new Error('Hash do documento de origem divergente');
    row.chainDocument=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
  }catch(e){row.chainError=e.message||String(e);}
}
function productChainModel(rows,address){

      if(p===n)throw new Error('Referência circular');
      if(Number(ref.chainId)!==11155111||!clientBalanceSameHex(ref.contractAddress,address))throw new Error('Origem em outro contrato ou rede');
      if(!p.row.jsonVerified||!n.row.jsonVerified)throw new Error('Cálculo MUF indisponível');
      if(!clientBalanceSameHex(ref.mufProofId,p.row.resultId)||!clientBalanceSameHex(ref.mufHash,p.row.resultHash))throw new Error('Referência aponta para outra revisão MUF');
      if(ref.elementalProofId&&(!p.row.elementalVerified||!clientBalanceSameHex(ref.elementalProofId,p.row.elementalProofId)||!clientBalanceSameHex(ref.elementalHash,p.row.elementalHash)))throw new Error('Referência ELEMENTAL não conferida');
      const stream=p.row.elementalVerified?p.row.elementalResult?.calculation?.streams?.find(s=>s.streamId===ref.sourceStreamId&&s.side==='ACCOUNTED'):null;
      if(!stream)throw new Error('Fluxo de origem sem valores verificados');
      const allocation=mg(ref.allocatedDryMassKg);
      if(allocation<=0n||allocation>BigInt(stream.dryMassMg))throw new Error('Alocação excede o fluxo de origem');
      if(allocation!==BigInt(n.row.muf.calculation?.inputMassMg))throw new Error('Alocação não corresponde à entrada do processo');
      n.parent=p;n.allocation=allocation;n.sourceStream=ref.sourceStreamId;

  const allocations=new Map();for(const n of nodes){if(n.parent){const key=n.parent.id+'|'+n.sourceStream;const group=allocations.get(key)||[];group.push(n);allocations.set(key,group);}}

  for(const [n,reason] of invalid){n.parent=null;n.issue=reason;}
  for(const n of nodes)if(n.parent)n.parent.children.push(n);
  return {nodes,roots:nodes.filter(n=>!n.parent),links:nodes.filter(n=>n.parent).length};
}

function clientElementalValidate(doc,proof,selected){
  const r=doc.result;

  if(!clientBalanceSameHex(r.evidenceId,selected.evidenceId)||!clientBalanceSameHex(r.actorId,selected.evidenceActor.actor_id)||!clientBalanceSameHex(r.expectedEvidenceHash,selected.evidenceHash))throw new Error('ELEMENTAL evidence identity mismatch.');
  if(r.status!==clientProofStatus(proof.status)||Number(r.statusCode)!==Number(proof.status))throw new Error('ELEMENTAL status mismatch.');
  if(!clientBalanceSameHex(clientBalanceHashStable(doc.methodology),proof.methodologyHash))throw new Error('ELEMENTAL methodology mismatch.');
  const input=clientBalanceHashStable({domain:'ExploreChem/ElementalInputCommitment/v1',evidenceId:selected.evidenceId,expectedEvidenceHash:selected.evidenceHash,indexedEvidenceHash:r.indexedEvidenceHash,downloadedDocumentHash:r.downloadedDocumentHash,mufProofId:r.mufProofId,expectedMufHash:r.expectedMufHash,downloadedMufResultHash:r.downloadedMufResultHash,calculationInputs:r.calculation});
  if(!clientBalanceSameHex(input,proof.inputCommitmentHash))throw new Error('ELEMENTAL input commitment mismatch.');

  if(c){
    const a=BigInt(c.availableElementMassMg),b=BigInt(c.accountedElementMassMg),delta=a-b,abs=delta<0n?-delta:delta;
    if(a<=0n||b<0n||delta!==BigInt(c.signedElementalDifferenceMg)||abs!==BigInt(c.absoluteElementalDifferenceMg))throw new Error('ELEMENTAL mass arithmetic mismatch.');
    if(BigInt(c.absoluteElementalDifferencePercentScaled6)!==(abs*100000000n+a/2n)/a||BigInt(c.elementalRecoveryPercentScaled6)!==(b*100000000n+a/2n)/a)throw new Error('ELEMENTAL percentage mismatch.');
    if(!Array.isArray(c.streams)||!c.streams.length)throw new Error('ELEMENTAL streams missing.');
    for(const side of ['AVAILABLE','ACCOUNTED']){
      const sum=c.streams.filter(s=>s.side===side).reduce((n,s)=>n+BigInt(s.containedElementMassMg),0n);
      if(sum!==(side==='AVAILABLE'?a:b))throw new Error('ELEMENTAL stream totals mismatch.');
    }
  }
  return r;
}

    return "Selected actor → counterparty";
  }
  if(clientBalanceSameHex(pair.toActorId,actorId)){
    return "Counterparty → selected actor";
  }
  return "MUF · inputs − accounted outputs";
}
function clientBalanceRenderDashboard(){

    selected.manifest,

    result=>result.isLatest&&result.jsonVerified&&Array.isArray(result.manifest?.massPairs)
  );

    const n=BigInt(pair.deltaMg);

  },0n);

function clientBalanceRenderHistoryChart(){
  let panel=document.getElementById("clientMassHistoryChart");
  if(!panel){
    const history=document.getElementById("clientHistoryRows");
    if(!history) return;
    panel=document.createElement("section");
    panel.id="clientMassHistoryChart";
    panel.style.cssText="margin:24px 0;padding:20px;border:1px solid #24534f;border-radius:16px;overflow:auto";
    history.closest("table").parentElement.before(panel);
  }
  const points=[];
  const seen=new Set();
  for(const result of [...CLIENT_BALANCE_RESULTS].sort((a,b)=>a.createdAt-b.createdAt)){
    for(const pair of result.manifest.massPairs||[]){
      if(pair.leftMassMg==null||pair.rightMassMg==null) continue;
      const left=Number(pair.leftMassMg),right=Number(pair.rightMassMg);
      if(!Number.isFinite(left)||!Number.isFinite(right)||left<=0) continue;
      const key=result.resultId;
      if(seen.has(key)) continue;
      seen.add(key);
      points.push({result,pair,value:100*(left-right)/left});
    }
  }
  panel.innerHTML='<h3>Mass difference history</h3><p>One point per MUF revision, ordered by proof date. Tolerance is evaluated by its own workflow; this chart shows the measured difference only. Hover for details; click a point to open its result.</p>';
  if(!points.length){panel.insertAdjacentHTML("beforeend","<p>No comparable mass pairs with a positive outgoing mass.</p>");return;}
  const width=900,height=280,pad=50;
  const extent=Math.max(3,...points.map(p=>Math.abs(p.value)*1.15));
  const x=i=>pad+(width-2*pad)*(points.length===1?.5:i/(points.length-1));
  const y=v=>height/2-v*(height/2-pad)/extent;
  let svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="Historical MUF percentage differences" style="width:100%;min-width:560px">';

  for(const v of [-extent,0,extent]) svg+='<line x1="50" x2="850" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#63938a" stroke-dasharray="4 4"/><text x="2" y="'+(y(v)+4)+'" fill="#bbd9d3" font-size="12">'+v.toFixed(1)+'%</text>';
  points.forEach((p,i)=>{
    const title=clientBalanceDateFromUnix(p.result.createdAt)+' | '+p.result.manifest.lotReference+' | '+p.value.toFixed(4)+'% | '+clientBalanceKgFromMg(p.pair.leftMassMg)+' → '+clientBalanceKgFromMg(p.pair.rightMassMg)+' | Audit: '+p.result.auditState;
    svg+='<circle data-history-point="'+i+'" tabindex="0" role="button" aria-label="'+escaparHtml(title)+'" cx="'+x(i)+'" cy="'+y(p.value)+'" r="6" fill="'+(p.pair.status==='CONFORME'?'#37d8be':'#ff907b')+'" style="cursor:pointer"><title>'+escaparHtml(title)+'</title></circle>';
  });
  svg+='<text x="50" y="275" fill="#bbd9d3" font-size="12">'+escaparHtml(clientBalanceDateFromUnix(points[0].result.createdAt))+'</text><text x="850" y="275" text-anchor="end" fill="#bbd9d3" font-size="12">'+escaparHtml(clientBalanceDateFromUnix(points[points.length-1].result.createdAt))+'</text></svg>';
  panel.insertAdjacentHTML("beforeend",svg);
  panel.querySelectorAll("[data-history-point]").forEach(node=>{
    const open=()=>{document.getElementById("clientLiveResultSelect").value=points[Number(node.dataset.historyPoint)].result.resultId;clientBalanceRenderDashboard();};
    node.onclick=open;
    node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
  });
}
function clientBalanceRenderChart(pairs,structuralDivergence=false){
  if(CLIENT_BALANCE_CHART){
    CLIENT_BALANCE_CHART.destroy();
    CLIENT_BALANCE_CHART=null;
  }
  const canvas=$("#clientMassChart");
  if(!canvas||typeof Chart==="undefined") return;

  const chartBox=canvas.parentElement;
  chartBox?.querySelector(".client-live-chart-empty")?.remove();
  if(!pairs.length){
    canvas.style.display="none";
    const empty=document.createElement("div");
    empty.className="client-live-empty client-live-chart-empty";
    empty.textContent=structuralDivergence
      ? "Structural divergence confirmed. There is no valid origin-to-destination mass pair to chart."
      : "No attested mass values are available for this result.";
    chartBox?.appendChild(empty);
    return;
  }
  canvas.style.display="block";

  const labels=pairs.map((pair,index)=>pair.lotReference||"Handoff "+(index+1));
  CLIENT_BALANCE_CHART=new Chart(canvas,{
    type:"bar",
    data:{
      labels,
      datasets:[
        {
          label:"Reference inputs (kg)",
          data:pairs.map(pair=>pair.leftMassMg===null?null:Number(pair.leftMassMg)/1e6),
          backgroundColor:"#0ea7a0",
          borderRadius:7
        },
        {
          label:"Accounted outputs (kg)",
          data:pairs.map(pair=>pair.rightMassMg===null?null:Number(pair.rightMassMg)/1e6),
          backgroundColor:"#8bcfc7",
          borderRadius:7
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{
          position:"bottom",
          labels:{color:"#A9BFBC",boxWidth:12,boxHeight:12}
        }
      },
      scales:{
        x:{
          grid:{display:false},
          ticks:{color:"#789792"}
        },
        y:{
          beginAtZero:true,
          grid:{color:"rgba(67,146,139,.13)"},
          ticks:{color:"#789792",callback:value=>value+" kg"}
        }
      }
    }
  });
}

function productFilterRows(rows){
 const from=document.getElementById('productFrom')?.value,to=document.getElementById('productTo')?.value;
 const lo=from?new Date(from+'T00:00:00').getTime()/1000:-Infinity;
 const hi=to?new Date(to+'T23:59:59').getTime()/1000:Infinity;
 return rows.filter(r=>{if(!from&&!to)return true;const stamp=Number(r.createdAt);return Number.isFinite(stamp)&&stamp>0&&stamp>=lo&&stamp<=hi;});
}

const PRODUCT_EXPLORER='https://sepolia.etherscan.io';
const PRODUCT_PROOF_EVENTS=[
 'event EvidenceSubmitted(bytes32 indexed evidenceId,bytes32 indexed actorId,address indexed submittedBy,bytes32 evidenceHash,uint64 createdAt)',
 'event ProofAnchored(bytes32 indexed proofId,bytes32 indexed evidenceId,uint8 indexed proofType,bytes32 committedHash,uint8 status,uint32 revision,bytes32 previousProofId,bytes32 inputCommitmentHash,bytes32 methodologyHash,bytes32 workflowId,uint64 createdAt)'
];
const PRODUCT_TX_CACHE=new Map();
function productExplorerAnchor(text,tx,address){
 const a=document.createElement('a');a.textContent=text;a.target='_blank';a.rel='noopener noreferrer';
 if(tx&&/^0x[0-9a-f]{64}$/i.test(tx))a.href=PRODUCT_EXPLORER+'/tx/'+tx+'#eventlog';
 else if(address&&/^0x[0-9a-f]{40}$/i.test(address))a.href=PRODUCT_EXPLORER+'/address/'+address;
 else return document.createTextNode(text);
 a.title=tx?'Abrir transação de registro no Etherscan':'Abrir contrato no Etherscan';return a;
}
async function productFindProofTransaction(provider,address,kind,record,active){
 const id=String(kind==='EvidenceSubmitted'?record.evidenceId:record.proofId);
 const key=address.toLowerCase()+':'+kind+':'+id.toLowerCase();if(PRODUCT_TX_CACHE.has(key))return PRODUCT_TX_CACHE.get(key);
 const iface=new ethers.Interface(PRODUCT_PROOF_EVENTS),stamp=Number(record.createdAt);
 if(!Number.isSafeInteger(stamp)||stamp<=0)throw Error('Data de registro indisponível.');
 const head=await provider.getBlockNumber();let low=0,high=head;
 // Localiza o bloco pelo timestamp on-chain, sem varrer intervalos extensos.
 while(low<high){if(!active())throw Error('Seleção alterada.');const mid=Math.floor((low+high)/2);const block=await provider.getBlock(mid);if(!block)throw Error('Bloco indisponível no RPC.');if(Number(block.timestamp)<stamp)low=mid+1;else high=mid;}
 if(!active())throw Error('Seleção alterada.');
 const logs=await provider.getLogs({address,topics:[iface.getEvent(kind).topicHash,id],fromBlock:Math.max(0,low-1),toBlock:Math.min(head,low+1)});
 for(const log of logs){if(log.removed)continue;const parsed=iface.parseLog(log),a=parsed?.args;if(!a||!clientBalanceSameHex(a.evidenceId,record.evidenceId))continue;
 const hash=kind==='EvidenceSubmitted'?a.evidenceHash:a.committedHash;
 const expected=kind==='EvidenceSubmitted'?record.evidenceHash:record.committedHash;
 if(!clientBalanceSameHex(hash,expected)||Number(a.createdAt)!==stamp)continue;
 if(kind==='ProofAnchored'&&(!clientBalanceSameHex(a.proofId,record.proofId)||Number(a.proofType)!==Number(record.proofType)))continue;
 if(!/^0x[0-9a-f]{64}$/i.test(log.transactionHash))continue;
 PRODUCT_TX_CACHE.set(key,log.transactionHash);return log.transactionHash;}
 throw Error('Transação de registro não localizada.');
}
async function clientCurrentProofState(contract,evidenceId){
 const runner=contract.runner,provider=runner.provider||runner;
 const raw=await provider.call({to:await contract.getAddress(),data:contract.interface.encodeFunctionData('getCurrentProofState',[evidenceId])});
 const fields={128:'bytes32 mufHash,bytes32 elementalHash,uint8 mufStatus,uint8 elementalStatus',192:'bytes32 mufHash,bytes32 elementalHash,bytes32 auditHash,uint8 mufStatus,uint8 elementalStatus,uint8 auditStatus',384:'bytes32 mufHash,bytes32 toleranceHash,bytes32 elementalHash,bytes32 yieldHash,bytes32 multiStreamHash,bytes32 auditHash,uint8 mufStatus,uint8 toleranceStatus,uint8 elementalStatus,uint8 yieldStatus,uint8 multiStreamStatus,uint8 auditStatus'}[(raw.length-2)/2];
 if(!fields)throw Error('Formato de estado de provas não reconhecido.');
 return ethers.AbiCoder.defaultAbiCoder().decode(['tuple('+fields+')'],raw)[0];

async function validateContractSet(provider,proofAddress,actorAddress,lotsAddress){
 if(Number((await provider.getNetwork()).chainId)!==11155111)throw Error('Selecione a rede Sepolia.');
 const addresses=[proofAddress,actorAddress,lotsAddress].map(v=>checkedAddress(String(v).trim()));
 const codes=await Promise.all(addresses.map(a=>provider.getCode(a)));
 if(codes.some(c=>c==='0x'))throw Error('Um dos endereços não contém contrato na Sepolia.');
 const registry=new ethers.Contract(addresses[0],['function actorRegistry() view returns(address)','function lotsContract() view returns(address)'],provider);
 const lots=new ethers.Contract(addresses[2],['function registry() view returns(address)'],provider);
 const [linkedActor,linkedLots,linkedRegistry]=await Promise.all([registry.actorRegistry(),registry.lotsContract(),lots.registry()]);
 if(!igualHex(linkedActor,addresses[1]))throw Error('O ActorRegistry informado não corresponde ao vínculo do ProofRegistry.');
 if(!igualHex(linkedRegistry,addresses[0]))throw Error('O Lots informado pertence a outro ProofRegistry.');
 if(linkedLots!==ethers.ZeroAddress&&!igualHex(linkedLots,addresses[2]))throw Error('O ProofRegistry já está vinculado a outro Lots.');
 return {addresses,linked:linkedLots!==ethers.ZeroAddress};
}
async function saveContractSet(){
 const status=document.getElementById('contractSetStatus'),button=document.getElementById('saveContractSet');
 button.disabled=true;status.textContent='Conferindo os contratos na Sepolia…';
 try{
  const provider=await clientBalanceProvider();
  const result=await validateContractSet(provider,document.getElementById('proofRegistryAddress').value,document.getElementById('actorRegistryConfig').value,document.getElementById('newLotsAddress').value);
  salvarEnderecoContrato(result.addresses[0]);
  localStorage.setItem('explorechem_actor_registry_address',result.addresses[1]);
  localStorage.setItem(EXPLORECHEM_LOTS_KEY,result.addresses[2]);
  const other=document.getElementById('contractAddressConfig');if(other)other.value=result.addresses[0];
  ADMIN_CONTEXT={checked:false,isAdmin:false,isOwner:false,owner:''};
  ATOR_ATIVO=null;persistirAtorAtivo();
  status.textContent=result.linked?'Endereços salvos e vínculos confirmados na blockchain.':'Endereços salvos. Falta clicar em Vincular ao Registry para concluir o vínculo com Lots.';
 }catch(e){status.textContent=e.shortMessage||e.message||String(e);}finally{button.disabled=false;}
}

function bindRegistryOperations(){
 const run=async(fn)=>{try{await fn();}catch(e){toast(e.shortMessage||e.message);}};
 document.getElementById('saveContractSet').onclick=saveContractSet;
 document.getElementById('saveNewLots').onclick=()=>run(async()=>{const c=await newLotsContext(false,document.getElementById('newLotsAddress').value.trim());localStorage.setItem(EXPLORECHEM_LOTS_KEY,await c.lots.getAddress());document.getElementById('registryLinkStatus').textContent=c.linked===ethers.ZeroAddress?'Contrato validado; falta vincular pelo owner.':'Contratos vinculados e validados.';});
 document.getElementById('linkNewLots').onclick=()=>run(async()=>{const c=await newLotsContext(true,document.getElementById('newLotsAddress').value.trim());if(c.linked!==ethers.ZeroAddress)throw Error('O Registry já está vinculado.');if(!igualHex(await c.registry.owner(),c.account))throw Error('Somente o owner pode vincular.');if(!confirm('Confirmar vínculo permanente com este contrato de lotes?'))return;await(await c.registry.configureLots(await c.lots.getAddress())).wait();localStorage.setItem(EXPLORECHEM_LOTS_KEY,await c.lots.getAddress());document.getElementById('registryLinkStatus').textContent='Vínculo confirmado na blockchain.';});
 for(const [id,status] of [['suspendActor',3],['activateActor',2]])document.getElementById(id).onclick=()=>run(async()=>{const c=await adminContractContext();const actor=checkedHash(document.getElementById('statusActor').value.trim()),reason=documentCommit(document.getElementById('statusReason').value);await(await c.contract.setActorStatus(actor,status,reason)).wait();toast(status===3?'Ator suspenso; saldos preservados.':'Ator reativado.');});
}
function tokenizationPane(){return `<div class="panel pad"><h2>Movimentações do balanço</h2><p>O relatório ELEMENTAL, após MUF COMPLIANT e verificações contratuais, registra o saldo na empresa responsável pela evidência.</p><button class="btn" id="tokensConnect">Conectar carteira</button><button class="btn ghost" id="tokensRefresh">Atualizar saldos</button><p id="tokensStatus" role="status"></p><div id="tokensEvidence"></div><div id="tokensWorkspace" hidden><div id="tokensInventory"></div><button class="btn ghost" id="tokensPrev">Anterior</button><button class="btn ghost" id="tokensNext">Próxima</button><hr><label>Lote de origem</label><input id="tokensLot" inputmode="numeric"><label>Quantidade inteira na unidade do lote</label><input id="tokensQty" inputmode="numeric"><p class="sm">A unidade depende do compromisso do lote. Esta tela não presume kg ou mg.</p><label>Empresa destinatária</label><select id="tokensRecipient"></select><label>Referência documental do pedido / divisão / encerramento</label><textarea id="tokensDocument"></textarea><button class="btn" id="tokensCreateOrder">Criar pedido</button><button class="btn ghost" id="tokensTransfer">Transferir diretamente</button><hr><h3>Pedidos</h3><label>ID do pedido</label><input id="tokensOrderId"><button class="btn ghost" id="tokensReadOrder">Consultar pedido</button><label>Bloco inicial para buscar pedidos da empresa</label><input id="tokensFromBlock" inputmode="numeric"><button class="btn ghost" id="tokensFindOrders">Buscar até 2.000 blocos</button><div id="tokensOrders"></div><div id="tokensOrderDetails"></div><div id="tokensOrderActions"></div><p class="sm">Aceitar o pedido é diferente de confirmar recebimento. O bloqueio dos tokens inicia o prazo de 24 horas. Após o prazo, é necessária uma transação para concluir. Cancelamento e recusa são permitidos antes da conclusão.</p><hr><h3>Divisão e encerramento</h3><label>Quantidades dos lotes-filhos, separadas por vírgula</label><input id="tokensSplit"><button class="btn ghost" id="tokensSplitGo">Dividir lote</button><label>Destinação para encerramento</label><input id="tokensDestination"><button class="btn ghost" id="tokensClose">Encerrar quantidade</button><hr><h3>Autorizar transformação</h3><p>Selecione o JSON da ação exata preparada para o workflow. As entradas e saídas são exibidas antes da autorização.</p><input type="file" id="tokensActionFile" accept=".json,application/json"><pre id="tokensActionPreview" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><button class="btn" id="tokensAuthorize" disabled>Autorizar esta transformação</button></div></div>`;}
async function productTokenizationRender(){
 const host=document.getElementById('productTokenization');if(!host)return;host.tokenCleanup?.();host.innerHTML=tokenizationPane();
 const el=id=>host.querySelector('#'+id),live=()=>host.isConnected;
 let ctx=null,page=0,busy=false,action=null;
 const msg=s=>{if(live())el('tokensStatus').textContent=s;};
 const run=async fn=>{if(busy)return;busy=true;const buttons=[...host.querySelectorAll('button')];const states=buttons.map(b=>b.disabled);buttons.forEach(b=>b.disabled=true);try{await fn();}catch(e){msg(e.shortMessage||e.message||String(e));}finally{busy=false;buttons.forEach((b,i)=>b.disabled=states[i]);el('tokensAuthorize').disabled=!action;}};
 const requireContext=()=>{if(!ctx||!ctx.authorized)throw Error('Conecte a carteira.');if(ctx.actorId!==document.getElementById('clientLiveActorSelect').value)throw Error('Empresa alterada. Conecte novamente.');return ctx;};
 const integer=v=>{if(!/^[0-9]+$/.test(v.trim())||BigInt(v.trim())===0n)throw Error('Use uma quantidade inteira positiva.');return BigInt(v.trim());};
 const lotId=()=>integer(el('tokensLot').value),qty=()=>integer(el('tokensQty').value),doc=()=>documentCommit(el('tokensDocument').value),op=()=>ethers.hexlify(ethers.randomBytes(32));
 async function transact(call){msg('Aguardando confirmação na carteira…');const tx=await call();msg('Transação enviada: '+tx.hash);const receipt=await tx.wait();if(!receipt||Number(receipt.status)!==1)throw Error('Transação não confirmada com sucesso.');msg('Confirmado: '+tx.hash);return receipt;}
 async function refresh(){await actorStockRefresh();}
 async function readOrder(){const c=requireContext(),id=checkedHash(el('tokensOrderId').value.trim()),o=await c.lots.getOrder(id),status=Number(o.status);const labels=['INEXISTENTE','AGUARDANDO ACEITE','ACEITO','TOKENS BLOQUEADOS','RECEBIDO','CONCLUÍDO POR PRAZO','CANCELADO','RECUSADO'];el('tokensOrderDetails').textContent=`${labels[status]} · origem ${o.sender} · destino ${o.recipient} · quantidade ${o.quantity} · lote ${o.sourceLotId} · lote do pedido ${o.parcelLotId}`+(o.deadline>0n?' · prazo '+new Date(Number(o.deadline)*1000).toLocaleString():'');const actions=[];const sender=igualHex(c.actorId,o.sender),recipient=igualHex(c.actorId,o.recipient);if(status===1&&recipient)actions.push(['acceptOrder','Aceitar pedido']);if(status===2&&sender)actions.push(['lockOrder','Enviar tokens para o pedido']);if(status===3&&recipient)actions.push(['confirmReceipt','Confirmar recebimento']);const block=await c.provider.getBlock('latest');if(status===3&&Number(o.deadline)<=block.timestamp)actions.push(['finalizeOrder','Concluir após prazo']);if([1,2,3].includes(status)){if(sender)actions.push(['cancelOrder','Cancelar pedido']);if(recipient)actions.push(['rejectOrder','Recusar']);}el('tokensOrderActions').replaceChildren();for(const [method,label]of actions){const b=document.createElement('button');b.className='btn ghost';b.textContent=label;b.onclick=()=>run(async()=>{await transact(()=>c.lots[method](id));await readOrder();await refresh();});el('tokensOrderActions').append(b);}}
 el('tokensConnect').onclick=()=>run(async()=>{ctx=await newLotsContext(true);ctx.actorId=checkedHash(document.getElementById('clientLiveActorSelect').value);if(!await ctx.registry.actorActive(ctx.actorId)||!await ctx.registry.authorizedWallets(ctx.actorId,ctx.account))throw Error('Carteira não autorizada nesta empresa ativa.');ctx.authorized=true;if(ctx.linked===ethers.ZeroAddress)throw Error('O owner ainda precisa vincular Lots ao Registry na administração.');el('tokensWorkspace').hidden=false;el('tokensRecipient').innerHTML=CLIENT_BALANCE_ACTORS.filter(a=>!igualHex(a.actor_id,ctx.actorId)).map(a=>'<option value="'+escaparHtml(a.actor_id)+'">'+escaparHtml(a.display_name)+'</option>').join('');el('tokensFromBlock').value=String(Math.max(0,(await ctx.provider.getBlockNumber())-1999));await refresh();msg('Carteira autorizada na empresa selecionada. Saldos separados por empresa e lote.');});
 el('tokensRefresh').onclick=()=>run(refresh);el('tokensPrev').onclick=()=>run(async()=>{page=Math.max(0,page-1);await refresh();});el('tokensNext').onclick=()=>run(async()=>{if((page+1)*20<Number(await requireContext().lots.lotCount()))page++;await refresh();});
 el('tokensCreateOrder').onclick=()=>run(async()=>{const c=requireContext(),request=op(),recipient=checkedHash(el('tokensRecipient').value.trim()),id=await c.lots.orderIdFor(c.actorId,request);await transact(()=>c.lots.createOrder(c.actorId,request,recipient,lotId(),qty(),doc()));el('tokensOrderId').value=id;await readOrder();});
 el('tokensTransfer').onclick=()=>run(async()=>{const c=requireContext();if(!confirm('Transferência direta, sem os dois aceites do pedido. Continuar?'))return;await transact(()=>c.lots.transferActorBalance(c.actorId,checkedHash(el('tokensRecipient').value.trim()),lotId(),qty()));await refresh();});
 el('tokensReadOrder').onclick=()=>run(readOrder);
 el('tokensFindOrders').onclick=()=>run(async()=>{const c=requireContext(),from=Number(el('tokensFromBlock').value);if(!Number.isSafeInteger(from)||from<0)throw Error('Bloco inicial inválido.');const to=Math.min(await c.provider.getBlockNumber(),from+1999);if(from>to)throw Error('Bloco inicial ainda não existe.');const sets=await Promise.all([c.lots.queryFilter(c.lots.filters.OrderCreated(null,c.actorId,null),from,to),c.lots.queryFilter(c.lots.filters.OrderCreated(null,null,c.actorId),from,to)]);const ids=[...new Set(sets.flat().map(e=>e.args.orderId))];el('tokensOrders').replaceChildren();for(const id of ids){const b=document.createElement('button');b.className='btn ghost';b.textContent=id;b.style.overflowWrap='anywhere';b.onclick=()=>run(async()=>{el('tokensOrderId').value=id;await readOrder();});el('tokensOrders').append(b);}msg(`${ids.length} pedidos entre blocos ${from} e ${to}. Ajuste o bloco inicial para consultar períodos anteriores.`);});
 el('tokensSplitGo').onclick=()=>run(async()=>{const c=requireContext(),values=el('tokensSplit').value.split(',').map(integer);await transact(()=>c.lots.splitLot(c.actorId,op(),lotId(),values,doc()));await refresh();});
 el('tokensClose').onclick=()=>run(async()=>{const c=requireContext(),destination=documentCommit(el('tokensDestination').value);if(!confirm('Encerrar esta quantidade por queima? O histórico será preservado.'))return;await transact(()=>c.lots.closeBalance(op(),c.actorId,lotId(),qty(),destination,doc()));await refresh();});
 el('tokensActionFile').onchange=()=>run(async()=>{action=null;el('tokensActionPreview').textContent='';const f=el('tokensActionFile').files[0];if(!f)return;const parsed=JSON.parse(await f.text());const a=parsed.action||parsed.tokenAction;if(!a||Number(a.kind)!==2)throw Error('O arquivo deve conter evidenceId e action de transformação (kind 2).');checkedHash(parsed.evidenceId);checkedHash(a.operationId);checkedHash(a.mufProofId);if(!Array.isArray(a.inputs)||!Array.isArray(a.outputs)||!a.inputs.length||!a.outputs.length||a.inputs.length>32||a.outputs.length>32)throw Error('Entradas/saídas inválidas.');for(const x of a.inputs){integer(String(x.lotId));integer(String(x.quantity));}for(const x of a.outputs){checkedHash(x.streamId);checkedHash(x.basisHash);checkedHash(x.metadataHash);integer(String(x.quantity));}const input=EXPLORECHEM_LOTS_ABI.find(x=>x.name==='processTokenAction').inputs[2];const hash=ethers.keccak256(ethers.AbiCoder.defaultAbiCoder().encode([ethers.ParamType.from(input)],[a]));action={evidenceId:parsed.evidenceId,hash};el('tokensActionPreview').textContent=JSON.stringify(parsed,null,2)+'\nHash da ação: '+hash;});
 el('tokensAuthorize').onclick=()=>run(async()=>{const c=requireContext();if(action&&!igualHex(await c.registry.evidenceActor(action.evidenceId),c.actorId))throw Error('A transformação pertence a outra empresa.');if(!action)throw Error('Selecione a ação.');await transact(()=>c.lots.authorizeTransformation(action.evidenceId,action.hash));});
 el('tokensPrev').hidden=true;el('tokensNext').hidden=true;const wallet=getWalletProvider(),invalidate=()=>{ctx=null;action=null;el('tokensWorkspace').hidden=true;msg('Carteira ou rede alterada. Conecte novamente.');};wallet?.on?.('accountsChanged',invalidate);wallet?.on?.('chainChanged',invalidate);host.tokenCleanup=()=>{wallet?.removeListener?.('accountsChanged',invalidate);wallet?.removeListener?.('chainChanged',invalidate);};
}

async function productProofRender(){
 const host=document.getElementById('productProofContent');if(!host)return;
 const selected=clientBalanceSelectedResult(),token={};host.proofToken=token;host.replaceChildren();
 if(!selected){host.textContent='Selecione um resultado disponível para consultar as provas.';return;}
 const request=CLIENT_BALANCE_REQUEST,address=EXPLORERCHEM_CONTRACT_ADDRESS;
 const active=()=>host.isConnected&&host.proofToken===token&&request===CLIENT_BALANCE_REQUEST&&address===EXPLORERCHEM_CONTRACT_ADDRESS&&clientBalanceSelectedResult()?.resultId===selected.resultId;
 const contractLine=document.createElement('p');contractLine.append('Contrato · ',productExplorerAnchor(address,null,address));host.append(contractLine);
 const boxes={};
 for(const [key,title,selector] of [['evidence','Evidência original',null],['muf','Prova MUF','#clientLatestHash'],['elemental','Prova ELEMENTAL','#clientElementalPanel']]){
  const box=document.createElement('section');box.className='product-proof-card';const h=document.createElement('h3');h.textContent=title;box.append(h);
  let dl;
  if(key==='evidence'){dl=document.createElement('dl');dl.className='kv';for(const [label,value] of [['evidenceId',selected.evidenceId],['evidenceHash',selected.evidenceHash]]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;dl.append(dt,dd);}}
  else {const source=key==='muf'?document.querySelector(selector)?.closest('dl'):[...document.querySelectorAll('#clientElementalPanel > details')].find(d=>d.querySelector('summary')?.textContent.startsWith('Prova '))?.querySelector('dl');dl=source?.cloneNode(true);}
  if(dl){dl.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));box.append(dl);}
  const status=document.createElement('p');status.className='product-proof-status';status.textContent='Localizando transação de registro…';box.append(status);host.append(box);boxes[key]={box,dl,status};
 }
 const downloads=document.createElement('div');downloads.className='client-live-proof-actions';
 for(const [id,label] of [['clientProofButton','Abrir / salvar PDF'],['clientJsonButton','Baixar JSON MUF'],['clientElementalDownload','Baixar JSON ELEMENTAL']]){const source=document.getElementById(id);if(!source||source.disabled)continue;const button=document.createElement('button');button.className='btn ghost';button.textContent=label;button.onclick=()=>{if(active())document.getElementById(id)?.click();};downloads.append(button);}host.append(downloads);
 function linkBox(key,record,tx){const {box,dl,status}=boxes[key];if(dl)for(const dt of dl.querySelectorAll('dt')){const dd=dt.nextElementSibling;if(!dd)continue;const label=dt.textContent.trim();const value=dd.textContent.trim();if(key!=='evidence'&&label==='evidenceHash')continue;if(key!=='evidence'&&label==='evidenceId')continue;if(/^(mufHash|elementalHash|proofId|ELEMENTAL proofId|inputCommitmentHash|methodologyHash|evidenceHash|evidenceId)$/.test(label)&&/^0x[0-9a-f]{64}$/i.test(value))dd.replaceChildren(productExplorerAnchor(value,tx));if(label==='Contract')dd.replaceChildren(productExplorerAnchor(value,null,address));}
 status.replaceChildren('Transação · ',productExplorerAnchor(tx,tx));}
 try{const provider=await clientBalanceProvider();const contract=new ethers.Contract(address,CLIENT_BALANCE_ABI,provider);
  const tasks=[['evidence',async()=>contract.getEvidence(selected.evidenceId),'EvidenceSubmitted'],['muf',async()=>contract.getProof(selected.resultId),'ProofAnchored'],['elemental',async()=>{const id=String(await contract.latestProofId(selected.evidenceId,3));if(CLIENT_BALANCE_ZERO.test(id))throw Error('Ainda não há prova ELEMENTAL registrada.');return contract.getProof(id);},'ProofAnchored']];
  // Sequencial para não disparar várias buscas de blocos simultaneamente.
  for(const [key,read,kind] of tasks){if(!active())return;try{const record=await read();if(!active())return;const tx=await productFindProofTransaction(provider,address,kind,record,active);if(!active())return;linkBox(key,record,tx);
   if(key==='evidence')for(const other of ['muf','elemental'])for(const dt of boxes[other].dl?.querySelectorAll('dt')||[]){if(['evidenceHash','evidenceId'].includes(dt.textContent.trim())){const dd=dt.nextElementSibling;dd.replaceChildren(productExplorerAnchor(dd.textContent,tx));}}
  }catch(e){if(active())boxes[key].status.textContent='Link indisponível: '+(e.shortMessage||e.message||String(e));}}
 }catch(e){if(active())for(const b of Object.values(boxes))b.status.textContent='Não foi possível consultar as transações: '+(e.message||String(e));}
}

function productDashboardBind(){
 const root=document.querySelector('.product-dashboard');if(!root||root.dataset.tabsBound)return;root.dataset.tabsBound='1';
 const element=document.getElementById('clientElementalPanel');if(element)document.getElementById('productElement').append(element);
 const panels={overview:'productOverview',mass:'clientLiveDashboard',element:'productElement',production:'productProduction',proof:'productProof',tokenization:'productTokenization'};
 const tabs=[...root.querySelectorAll('[data-product-tab]')];
 function activate(key){root.dataset.activeTab=key;for(const [name,id] of Object.entries(panels)){const panel=document.getElementById(id);if(panel)panel.hidden=name!==key;}tabs.forEach(t=>{const active=t.dataset.productTab===key;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;});if(key==='proof')productProofRender();if(key==='tokenization')productTokenizationRender();if(key==='mass')requestAnimationFrame(()=>{if(typeof Chart!=='undefined')Chart.getChart?.('clientMassChart')?.resize();});}
 tabs.forEach((tab,i)=>{tab.onclick=()=>activate(tab.dataset.productTab);tab.onkeydown=e=>{let next;if(e.key==='ArrowRight')next=(i+1)%tabs.length;else if(e.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;else return;e.preventDefault();tabs[next].focus();activate(tabs[next].dataset.productTab);};});
 const from=document.getElementById('productFrom'),to=document.getElementById('productTo');
 const filter=()=>{const invalid=from.value&&to.value&&from.value>to.value;to.setCustomValidity(invalid?'A data final deve ser posterior à inicial.':'');if(invalid){to.reportValidity();return;}root.productRedraw?.();};from.onchange=filter;to.onchange=filter;
 document.getElementById('productResetDates').onclick=()=>{from.value='';to.value='';filter();};
 activate(root.classList.contains('client-tokens-page')?'tokenization':'overview');
}

function clientBalanceBindUi(){
  productDashboardBind();
  clientBalancePrefillActorsFromMainApp();
  const actor=$("#clientLiveActorSelect");
  if(actor&&!actor.dataset.bound){
    actor.dataset.bound="1";
    actor.addEventListener("change",()=>{
      CLIENT_BALANCE_RESULTS=[];
      const resultSelect=$("#clientLiveResultSelect");
      if(resultSelect){
        resultSelect.innerHTML='<option>Loading results…</option>';
        resultSelect.disabled=true;
      }
      clientBalanceLoadSelectedActor().catch(error=>
        clientBalanceShowMessage(
          "Could not load this actor",
          error?.message||String(error),
          true
        )
      );
    });
  }

  const result=$("#clientLiveResultSelect");
  if(result&&!result.dataset.bound){
    result.dataset.bound="1";
    result.addEventListener("change",()=>{
      const actorId=$("#clientLiveActorSelect")?.value||"";
      try{
        localStorage.setItem(
          "explorechem_client_muf_result_"+EXPLORERCHEM_CONTRACT_ADDRESS.toLowerCase()+"_"+actorId.toLowerCase(),
          result.value
        );
      }catch(_){}
      clientBalanceRenderDashboard();
    });
  }

  const refresh=$("#clientLiveRefresh");
  if(refresh&&!refresh.dataset.bound){
    refresh.dataset.bound="1";
    refresh.addEventListener("click",()=>clientBalanceRefreshAll());
  }

  const proof=$("#clientProofButton");
  if(proof&&!proof.dataset.bound){
    proof.dataset.bound="1";
    proof.addEventListener("click",clientBalanceOpenProof);
  }
}

T.lab = () => {

  const reprovadas = 0;
  const pendentes = 0;
  const taxaConformidade = totalAmostras ? Math.round((aprovadas/totalAmostras)*100)+"%" : "—";

  return `

  <div class="headrow"><div class="grow"><h1>Dashboard de Análises</h1>

    <div class="banner-stat"><b>${aprovadas}/${totalAmostras}</b><span>laudos aprovados<br>no período</span></div>
  </div>

  <h2 style="margin-top:24px">Laudos recentes</h2>
  <div class="panel scrollx">
    <table>
      <thead><tr><th>ID do laudo</th><th>Cliente</th><th>Amostra</th><th>Status</th><th>Data</th><th class="num">Detalhes</th></tr></thead>
      <tbody>
        ${laudosRecentes.length ? laudosRecentes.map(l => `
          <tr>
            <td class="mono" style="font-size:12px">${l.id}</td>
            <td>${l.cliente}</td>

  </div>
  `;
};

function translateUiTree(root){
  const doc=root?.nodeType===9?root:(root?.ownerDocument||document);
  const scope=root?.nodeType===9?root.documentElement:root;
  if(!scope) return;
  // Preserve functional values of options that originally used their visible text as value.
  scope.querySelectorAll?.("option").forEach(o=>{
    if(!o.hasAttribute("value")) o.setAttribute("value",o.textContent.trim());
  });
  scope.querySelectorAll?.("#papeis .chip").forEach(c=>{
    if(!c.dataset.i18nValue) c.dataset.i18nValue=c.textContent.trim();
  });
  const NF=doc.defaultView?.NodeFilter||NodeFilter;
  const walker=doc.createTreeWalker(scope,NF.SHOW_TEXT);
  const nodes=[]; let n;
  while((n=walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>{if(!shouldKeepUiNode(node)) node.nodeValue=translateUiText(node.nodeValue);});
  scope.querySelectorAll?.("[placeholder],[title],[aria-label],[alt]").forEach(el=>{
    for(const attr of ["placeholder","title","aria-label","alt"]){
      if(el.hasAttribute(attr)) el.setAttribute(attr,translateUiText(el.getAttribute(attr)));
    }
  });
}

async function actorRegistryAddress(provider){
  const registry=new ethers.Contract(EXPLORERCHEM_CONTRACT_ADDRESS,["function actorRegistry() view returns (address)"],provider);
  return await registry.actorRegistry();
}

async function adminContractContext(requireAdmin=true){
  if(!walletAddress) throw new Error("Conecte a carteira administradora.");
  const chainAtual=await refreshWalletChain();
  if(chainAtual!=="0xaa36a7") throw new Error("Troque a carteira para a rede Sepolia.");
  if(!window.ethers) throw new Error("Biblioteca Web3 não carregou.");
  const provider=new ethers.BrowserProvider(getWalletProvider());
  const signer=await provider.getSigner();
  const contract=new ethers.Contract(await actorRegistryAddress(provider),ADMIN_ABI,signer);
  const [ownerAddress,allowed]=await Promise.all([contract.owner(),contract.isAdmin(walletAddress)]);
  ADMIN_CONTEXT={checked:true,isAdmin:!!allowed,isOwner:String(ownerAddress).toLowerCase()===walletAddress.toLowerCase(),owner:String(ownerAddress)};
  if(requireAdmin&&!allowed) throw new Error("A carteira conectada não é administradora deste contrato.");
  return {provider,signer,contract};
}

async function adminLoadPending(){
  ADMIN_SCAN_MESSAGE="Consultando solicitações no contrato…";
  if(role==="op"&&page==="admin") render();
  try{
    const {provider,contract}=await adminContractContext(true);
    const actorAddress=await contract.getAddress();
    const latest=await provider.getBlockNumber();
    const from=Math.max(0,latest-600000);
    const iface=new ethers.Interface(ADMIN_ABI);
    const topic=iface.getEvent("ActorRegistrationRequested").topicHash;
    const logs=[];
    const chunk=50000;
    for(let start=from;start<=latest;start+=chunk){
      const end=Math.min(latest,start+chunk-1);
      try{logs.push(...await provider.getLogs({address:actorAddress,topics:[topic],fromBlock:start,toBlock:end}));}
      catch(error){
        for(let small=start;small<=end;small+=10000){
          logs.push(...await provider.getLogs({address:actorAddress,topics:[topic],fromBlock:small,toBlock:Math.min(end,small+9999)}));
        }
      }
    }
    const byActor=new Map();
    logs.forEach(log=>{try{const p=iface.parseLog(log);byActor.set(String(p.args.actorId).toLowerCase(),{actorId:String(p.args.actorId),controller:String(p.args.controller),registrationHash:String(p.args.registrationHash),requestedAt:new Date(Number(p.args.requestedAt)*1000).toLocaleString("pt-BR"),blockNumber:log.blockNumber});}catch(_){}});
    let dbRows=[];
    try{
      const response=await supabaseClient.from("explorerchem_actors").select("id,actor_id,display_name,country_code,active,created_at");
      if(!response.error&&Array.isArray(response.data))dbRows=response.data;
    }catch(_){ }
    const dbMap=new Map(dbRows.map(a=>[String(a.actor_id).toLowerCase(),a]));
    const requests=[];
    for(const item of byActor.values()){
      try{
        const actor=await contract.getActor(item.actorId);
        const status=Number(actor.status);
        if(status!==1)continue;
        const db=dbMap.get(item.actorId.toLowerCase());
        requests.push({...item,status,companyName:db?.display_name||"",country:db?.country_code||"",dbId:db?.id||null});
      }catch(_){ }
    }
    ADMIN_REQUESTS=requests.sort((a,b)=>b.blockNumber-a.blockNumber);
    ADMIN_SCAN_MESSAGE=ADMIN_REQUESTS.length?"":"Nenhuma solicitação PENDING encontrada no contrato.";
  }catch(error){
    ADMIN_REQUESTS=[];
    ADMIN_SCAN_MESSAGE=error.message||"Não foi possível consultar as solicitações.";
    toast(ADMIN_SCAN_MESSAGE);
  }
  if(role==="op"&&page==="admin")render();
}

async function adminDecideActor(actorId,approve,button){
  const original=button.textContent;
  button.disabled=true;button.textContent=approve?"Aprovando…":"Rejeitando…";
  try{
    const {contract}=await adminContractContext(true);
    const decisionHash=ethers.keccak256(ethers.toUtf8Bytes(JSON.stringify({schemaVersion:"explorechem.actor.decision.v1",action:approve?"APPROVE":"REJECT",actorId,decidedBy:walletAddress,timestamp:new Date().toISOString()})));
    const tx=approve?await contract.approveActorRegistration(actorId,decisionHash):await contract.rejectActorRegistration(actorId,decisionHash);
    await tx.wait();
    const request=ADMIN_REQUESTS.find(r=>r.actorId.toLowerCase()===actorId.toLowerCase());
    if(request?.dbId){
      const update={active:!!approve};
      if(approve)update.onchain_registered_at=new Date().toISOString();
      const result=await supabaseClient.from("explorerchem_actors").update(update).eq("id",request.dbId);
      if(result.error)console.warn("Decisão on-chain confirmada; banco não atualizado:",result.error.message);
    }
    toast(approve?"Empresa aprovada no contrato.":"Solicitação rejeitada no contrato.");
    await carregarAtores();
    await adminLoadPending();
  }catch(error){console.error(error);toast(error.message||"Não foi possível concluir a decisão.");}
  finally{button.disabled=false;button.textContent=original;}
}

async function adminSetWalletPermission(authorized,button){
  const target=$("#adminWalletInput")?.value.trim();
  if(!target||!window.ethers?.isAddress(target)){toast("Informe uma carteira Ethereum válida.");return;}
  const original=button.textContent;button.disabled=true;button.textContent="Confirmando…";
  try{
    const {contract}=await adminContractContext(true);
    if(!ADMIN_CONTEXT.isOwner)throw new Error("Somente a carteira owner pode alterar administradores.");
    const tx=await contract.setAdmin(target,authorized);await tx.wait();
    toast(authorized?"Administrador autorizado.":"Permissão de administrador revogada.");
  }catch(error){console.error(error);toast(error.message||"Não foi possível alterar o administrador.");}
  finally{button.disabled=false;button.textContent=original;}
}

async function actorLotIdentity(c,lot,blockTag){
 const p=await c.registry.getProof(lot.elementalProofId,{blockTag});
 if(!igualHex(p.proofId,lot.elementalProofId)||!igualHex(p.evidenceId,lot.evidenceId)||Number(p.proofType)!==3||Number(p.status)!==2)throw Error('Prova ELEMENTAL incompatível com o lote');
 const path='elemental-results/'+lot.evidenceId.slice(2).toLowerCase()+'/'+lot.elementalProofId.slice(2).toLowerCase()+'.json';
 const signed=await supabaseClient.storage.from(EVIDENCE_BUCKET).createSignedUrl(path,900);if(signed.error)throw signed.error;
 const response=await fetch(signed.data.signedUrl,{cache:'no-store'});if(!response.ok)throw Error('Resultado privado indisponível');
 const bytes=new Uint8Array(await response.arrayBuffer());if(!igualHex(ethers.keccak256(bytes),p.committedHash))throw Error('Hash privado divergente');
 const doc=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)),r=doc.result;
 const calculations=Array.isArray(r?.elements)?r.elements.filter(e=>e.status==='COMPLIANT'&&e.calculation).map(e=>e.calculation):[r?.calculation].filter(Boolean);
 const matching=calculations.filter(calc=>igualHex(clientBalanceHashStable({domain:'ExploreChem/ElementMassBasis/v1',element:calc.element,unit:'mg'}),lot.basisHash));
 const calc=matching.length===1?matching[0]:null;
 if(doc.schema!=='ExploreChem/PrivateElementalResult/v1'||!calc||!igualHex(r.evidenceId,lot.evidenceId)||!igualHex(r.expectedEvidenceHash,p.evidenceHash)||!igualHex(r.mufProofId,lot.mufProofId))throw Error('Identidade privada incompatível');
 const element=calc.element;if(typeof element!=='string'||!element.length)throw Error('Elemento ausente');
 const hash=clientBalanceHashStable;
 if(!igualHex(hash({domain:'ExploreChem/ElementMassBasis/v1',element,unit:'mg'}),lot.basisHash))throw Error('Base de unidade incompatível');
 const stream=calc.streams?.find(stream=>igualHex(hash({domain:'ExploreChem/TokenStream/v1',evidenceId:r.evidenceId,streamId:stream.streamId,element}),lot.streamId)&&igualHex(hash({domain:'ExploreChem/TokenMetadata/v1',evidenceId:r.evidenceId,evidenceHash:r.expectedEvidenceHash,element,unit:'mg',stream}),lot.metadataHash));
 if(!stream)throw Error('Corrente e metadados não correspondem ao lote');
 return {element,unit:'mg',stream:stream.streamId,proof:p,path,bytes,result:r};
}

  CLIENT_BALANCE_ACTORS=actors;
  clientBalanceApplyActorOptions(actors);
  if(!actors.length){for(const id of ['productOverview','productLots','productProof']){const n=document.getElementById(id);if(n)n.textContent='Nenhuma empresa cadastrada no ActorRegistry atual.';}return;}
  await actorStockRefresh();
 }catch(e){if(!current())return;CLIENT_BALANCE_ACTORS=[];clientBalanceApplyActorOptions([]);for(const id of ['productOverview','productLots','productProof']){const n=document.getElementById(id);if(n)n.textContent='Não foi possível validar as empresas do contrato atual: '+(e.shortMessage||e.message||String(e));}}
};
clientBalanceRenderDashboard=actorStockRefresh;
T.tokens=()=>T.dashboard();

function render(){
  document.getElementById("productTokenization")?.tokenCleanup?.();
  document.getElementById('productTokenization')?.tokenCleanup?.();
  const sessao=SESSION[role];
  $("#session").innerHTML='<span class="session-avatar">'+sessao.iniciais+'</span>'+
    '<span class="session-copy"><b>'+sessao.nome+'</b><span>'+sessao.acesso+'</span></span>';
  renderWallet();
  const roleSelector=$("#roleSelector");
  if(roleSelector){
    roleSelector.value=role;
    roleSelector.onchange=function(){
      const next=this.value;
      try{sessionStorage.setItem("explorechem_force_top","1");}catch(_){}
      window.scrollTo(0,0);
      window.location.href=window.location.pathname+(next==="op"?"":"?role="+encodeURIComponent(next));
    };
  }
  $("#nav").innerHTML=NAVS[role].map(n=>
    '<button data-page="'+n[0]+'"'+(n[0]===page?' aria-current="page"':'')+'>'+n[1]+'</button>').join("");
  $("#nav").querySelectorAll("button").forEach(b=>
    b.onclick=function(){page=b.dataset.page;window.scrollTo(0,0);render();if(role==='op'&&page==='admin'&&walletAddress&&walletChainId==='0xaa36a7'){adminLoadPending();}});
  if(page==="enviar"){importedOrderJson=null;importedOrderFile=null;}
  $("#view").innerHTML=T[page]?T[page]():"";
  if(page==="evidencias"){document.getElementById("tokenEvidenceRefresh").onclick=tokenEvidenceRefresh;tokenEvidenceRefresh();}
  window.scrollTo(0,0);
  requestAnimationFrame(()=>window.scrollTo(0,0));
  renderCharts();

  const ps=$("#papeis");
  if(ps) ps.querySelectorAll(".chip").forEach(c=>
    c.onclick=function(){ps.querySelectorAll(".chip").forEach(x=>
      x.setAttribute("aria-pressed",String(x===c)));});

  /* Aplica bloqueio */
  aplicarSomenteLeitura();
  translateUiTree(document);

  if(role==="cli"&&(page==="dashboard"||page==="tokens")){
    clientBalanceBindUi();
    queueMicrotask(()=>clientBalanceRefreshAll());
  }

  if(role==="op"&&page==="admin"){
    const refresh=$("#adminRefresh");
    if(refresh)refresh.onclick=()=>adminLoadPending();
    bindRegistryOperations();
    document.querySelectorAll("[data-admin-approve]").forEach(b=>b.onclick=()=>adminDecideActor(b.dataset.adminApprove,true,b));
    document.querySelectorAll("[data-admin-reject]").forEach(b=>b.onclick=()=>adminDecideActor(b.dataset.adminReject,false,b));
    const grant=$("#grantAdmin"),revoke=$("#revokeAdmin");
    if(grant)grant.onclick=()=>adminSetWalletPermission(true,grant);
    if(revoke)revoke.onclick=()=>adminSetWalletPermission(false,revoke);
  }

  if(role==="op"&&page==="atores"){
    const editor=$("#actorWalletEditor"),input=$("#actorWalletAddress"),title=$("#actorWalletEditorTitle"),save=$("#saveActorWallet"),cancel=$("#cancelActorWallet");
    document.querySelectorAll("[data-edit-actor-wallet]").forEach(button=>button.onclick=function(){
      const actor=ATORES.find(a=>String(a.dbId)===String(button.dataset.editActorWallet));
      if(!actor||!editor||!input||!save)return;
      editor.hidden=false;
      editor.dataset.actorDbId=actor.dbId;
      input.value=actor.publicWalletAddress||"";
      if(title)title.textContent="Alterar carteira pública · "+actor.nome;
      input.focus();
      editor.scrollIntoView({behavior:"smooth",block:"center"});
    });
    if(save)save.onclick=()=>salvarCarteiraPublicaAtor(editor?.dataset.actorDbId,input,save);
    if(cancel)cancel.onclick=()=>{if(editor){editor.hidden=true;delete editor.dataset.actorDbId;}if(input)input.value="";};
  }

  const bind=function(sel,msg){const el=$(sel);if(el)el.onclick=function(e){e.preventDefault();toast(msg);};};
  const bindOnchain=function(sel){const el=$(sel);if(el)el.onclick=function(e){
    e.preventDefault(); enviarEvidenciaReal(el);
  };};

  const salvarAtor=$("#salvarAtor");
  if(salvarAtor) salvarAtor.onclick=async function(e){
    e.preventDefault();
    if(escopoAtor().somenteLeitura){toast("Perfil somente leitura nesta visão.");return;}
    if(!walletAddress){toast("Conecte uma carteira autorizada antes de continuar.");return;}
    const chainAtual=await refreshWalletChain();
    if(chainAtual!=="0xaa36a7"){toast("Troque a carteira para a rede Sepolia antes de assinar.");return;}
    const nome=$("#rs")?.value.trim(),publicWalletRaw=$("#wl")?.value.trim(),papel="Empresa",existing=ATORES.find(a=>normalizarNomeEmpresa(a.nome)===normalizarNomeEmpresa(nome));
    if(!nome){toast("Informe a razão social.");return;}
    if(!publicWalletRaw){toast("Informe a carteira pública do ator.");return;}
    const novo={id:existing?.id||$("#actorId")?.value||novoActorId(),nome,papel,praca:$("#pr")?.value||"—",carteiras:1,evid:existing?.evid||0,desde:existing?.desde||new Date().toLocaleDateString("en-US")};
    if(!existing&&ATORES.some(a=>a.id===novo.id)){toast("Identificador já usado. Gere outro antes de cadastrar.");return;}
    const actorIdField=$("#actorId");if(actorIdField)actorIdField.value=novo.id;
    const originalText=salvarAtor.textContent;salvarAtor.disabled=true;salvarAtor.textContent="Verificando cadastro…";
    const actorType="OTHER",countryCode=($("#pa")?.value||"BR").slice(0,2).toUpperCase();
    try{
      if(!window.ethers) throw new Error("Biblioteca Web3 não carregou");
      if(!ethers.isAddress(publicWalletRaw)) throw new Error("A carteira pública do ator não é um endereço Ethereum válido.");
      const publicWalletAddress=ethers.getAddress(publicWalletRaw);
      const provider=new ethers.BrowserProvider(getWalletProvider());
      const signer=await provider.getSigner();
      const abi=[
        "function isAdmin(address account) view returns (bool)",
        "function getActor(bytes32 actorId) view returns (tuple(bytes32 actorId,address controller,bytes32 registrationHash,uint8 status,uint64 createdAt,uint64 statusUpdatedAt))",
        "function isWalletAuthorized(bytes32 actorId,address wallet) view returns (bool)",
        "function requestActorRegistration(bytes32 actorId,bytes32 registrationHash) external",
        "function approveActorRegistration(bytes32 actorId,bytes32 decisionHash) external"
      ];
      const contract=new ethers.Contract(await actorRegistryAddress(provider),abi,signer);
      const registrationAdmin=await contract.isAdmin(walletAddress);
      let status=0,approvalReceipt=null;
      try{status=Number((await contract.getActor(novo.id)).status);}catch(_){status=0;}
      const registrationData={schemaVersion:"explorechem.actor.registration.v1",actorId:novo.id,legalName:nome,operatingLocation:$("#pr")?.value||null,country:$("#pa")?.value||null,responsibleName:$("#rp")?.value||null,email:$("#em")?.value||null,controller:walletAddress};
      const registrationHash=ethers.keccak256(ethers.toUtf8Bytes(JSON.stringify(registrationData)));
      if(status===0){
        salvarAtor.textContent="Solicitando cadastro…";
        const requestTx=await contract.requestActorRegistration(novo.id,registrationHash);await requestTx.wait();status=1;
      }
      if(status===1&&registrationAdmin){
        salvarAtor.textContent="Aprovando empresa…";
        const decisionHash=ethers.keccak256(ethers.toUtf8Bytes(JSON.stringify({action:"APPROVE_ACTOR",actorId:novo.id,registrationHash})));
        const approveTx=await contract.approveActorRegistration(novo.id,decisionHash);approvalReceipt=await approveTx.wait();status=2;
      }
      if(status!==1&&status!==2)throw new Error(status===3?"A empresa está suspensa no contrato novo.":"A empresa não pode ser ativada no estado on-chain atual.");
      if(status===2&&!await contract.isWalletAuthorized(novo.id,walletAddress))throw new Error("A empresa está ativa, mas esta carteira não está autorizada a enviar evidências por ela.");
      salvarAtor.textContent="Salvando empresa…";
      const chainFields={active:status===2,onchain_registered_at:new Date().toISOString(),public_wallet_address:publicWalletAddress};if(approvalReceipt?.hash)chainFields.onchain_registration_tx=approvalReceipt.hash;
      const response=existing?.dbId
        ? await supabaseClient.from("explorerchem_actors").update({...chainFields,display_name:nome,actor_type:actorType,country_code:countryCode}).eq("id",existing.dbId).select("id,actor_id,display_name,actor_type,public_wallet_address").single()
        : await supabaseClient.from("explorerchem_actors").insert({actor_id:novo.id,display_name:nome,actor_type:actorType,country_code:countryCode,...chainFields}).select("id,actor_id,display_name,actor_type,public_wallet_address").single();
      const {data:row,error}=response;
      if(error) throw new Error("Blockchain confirmada, mas o Supabase recusou o cadastro: "+error.message);
      novo.dbId=row.id;
      ATOR_ATIVO=status===2?novo.id:null;
      persistirAtorAtivo();
      await carregarAtores();
      toast(status===1?"Cadastro solicitado. Aguarde aprovação administrativa da empresa.":"Empresa ativa no contrato.");
    }catch(error){
      console.error(error); toast(error.message||"Não foi possível concluir o cadastro.");
    }finally{
      salvarAtor.disabled=false; salvarAtor.textContent=originalText;
    }
  };
  const gerarActorId=$("#gerarActorId");
  if(gerarActorId) gerarActorId.onclick=function(){
    let id;
    do { id=novoActorId(); } while(ATORES.some(a=>a.id===id));
    const campo=$("#actorId"); if(campo) campo.value=id;
  };

  const salvarContractAddress=$("#salvarContractAddress");
  if(salvarContractAddress) salvarContractAddress.onclick=async function(){
    try{
      const address=salvarEnderecoContrato($("#contractAddressConfig")?.value);
      const campo=$("#contractAddressConfig"); if(campo) campo.value=address;
      ATOR_ATIVO=null;persistirAtorAtivo();await carregarAtores();
      toast("Contrato ativo atualizado para "+address+".");
    }catch(error){
      console.error(error);
      toast(error.message||"Endereço de contrato inválido.");
    }
  };
  const resetContractAddress=$("#resetContractAddress");
  if(resetContractAddress) resetContractAddress.onclick=async function(){
    const address=resetarEnderecoContrato();
    const campo=$("#contractAddressConfig"); if(campo) campo.value=address;
    ATOR_ATIVO=null;persistirAtorAtivo();await carregarAtores();toast("Endereço padrão restaurado.");
  };

  const atorSelecionado=$("#atorSelecionado");
  if(atorSelecionado) atorSelecionado.onchange=function(){
    ATOR_ATIVO=this.value||null; persistirAtorAtivo();
    toast(ATOR_ATIVO?"Perfil do ator selecionado para navegação.":"Nenhum ator selecionado.");
    render();
  };

  bindOnchain("#enviarEv");
  bindOnchain("#enviarTransporte");
  bindOnchain("#enviarLaudo");

  const bindFile=function(inputSel,infoSel){const input=$(inputSel),info=$(infoSel);if(input&&info)input.onchange=async function(){
    const file=input.files&&input.files[0];
    if(!file){info.innerHTML="";return;}
    info.innerHTML='<div class="filerow"><b>'+escaparHtml(file.name)+'</b><span>'+Math.ceil(file.size/1024)+' KB · lendo arquivo…</span></div>'; translateUiTree(info);
    try{
      if(isJsonFile(file)) await lerJsonDoArquivo(file);
      if(inputSel==="#arquivo"){
        if(input.files&&input.files[0]===file) info.innerHTML="";
        return;
      }
      const hash=await sha256Arquivo(file);
      if(input.files&&input.files[0]===file) { info.innerHTML='<div class="filerow"><b>'+escaparHtml(file.name)+'</b><span>'+Math.ceil(file.size/1024)+' KB · SHA-256 <span class="mono">'+hash.slice(0,18)+'…</span></span></div>'; translateUiTree(info); }
    }catch(error){info.innerHTML='<div class="filerow"><b>'+escaparHtml(file.name)+'</b><span>'+escaparHtml(error.message||"Não foi possível ler o arquivo.")+'</span></div>';translateUiTree(info);}
  };};
  bindFile("#arquivo","#arquivoInfo");
  bindFile("#arquivoTransporte","#arquivoTransporteInfo");
  bindFile("#arquivoLaudo","#arquivoLaudoInfo");

  const manualDocumentType=$("#td"),addStream=$("#addStream");
  if(manualDocumentType) manualDocumentType.onchange=()=>renderStreamRows(defaultStreamsForType(manualDocumentType.value));
  if(addStream) addStream.onclick=()=>addStreamRow({streamType:"INPUT",streamId:"FLOW-"+String(document.querySelectorAll("#streamRows .stream-row").length+1).padStart(3,"0"),massBasis:"DRY_105C",moisturePct:0,assay:{element:"Nd",basis:"COMPOUND_PCT",compound:"Nd2O3",method:"ICP-MS"},massMeasurement:{coverageFactor:2}});
  if($("#streamRows")&&!$("#streamRows").children.length) renderStreamRows(defaultStreamsForType(manualDocumentType?.value||""));

  const collected=$("#massaColetada"),delivered=$("#massaEntregue"),difference=$("#custodyDifference");
  const parseMass=v=>{const clean=v.replace(/\s*kg/gi,"").replace(/\./g,"").replace(",",".");return Number(clean);};
  const updateDifference=()=>{if(!collected||!delivered||!difference)return;const a=parseMass(collected.value),b=parseMass(delivered.value);difference.innerHTML=Number.isFinite(a)&&Number.isFinite(b)?'<b>Custody difference</b><span>'+Math.max(0,a-b).toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:3})+' kg</span>':'<b>Custody difference</b><span>Enter both masses</span>';translateUiTree(difference);};
  if(collected&&delivered){collected.oninput=updateDifference;delivered.oninput=updateDifference;}

  /* Botões específicos do laboratório */
  const novoLaudo=$("#novoLaudo");
  if(novoLaudo) novoLaudo.onclick=function(){
    if(escopoAtor().somenteLeitura){toast("Perfil somente leitura nesta visão.");return;}
    page="laudo"; render();
  };
  const verPendentes=$("#verPendentes");
  if(verPendentes) verPendentes.onclick=function(){
    if(escopoAtor().somenteLeitura){toast("Perfil somente leitura nesta visão.");return;}
    toast("Exibindo laudos pendentes (simulação).");
  };

  document.querySelectorAll("[data-print-cre-proof]").forEach(b=>b.onclick=function(e){
    e.preventDefault();
    abrirComprovanteCreTee();
  });

  document.querySelectorAll("[data-download-evidence]").forEach(b=>b.onclick=async function(e){
    e.preventDefault();
    const id=this.dataset.downloadEvidence;
    const item=EVIDENCIAS_REMOTAS.find(x=>x.evidenceId===id||x.id===id);
    if(!item){toast("Documento não encontrado nesta sessão.");return;}
    await abrirDocumento(item);
  });
  document.querySelectorAll("[data-download-report]").forEach(b=>b.onclick=async function(e){
    e.preventDefault();
    const report=relatorioClienteAtual();
    if(!report){toast("O relatório oficial ainda não foi disponibilizado pelo CRE/TEE.");return;}
    await abrirDocumento({storageBucket:report.storageBucket||report.storage_bucket||REPORT_BUCKET,storagePath:report.storagePath||report.storage_path});
  });
  document.querySelectorAll("[data-download-snapshot]").forEach(b=>b.onclick=function(e){
    e.preventDefault(); baixarSnapshotBalanco();
  });
  document.querySelectorAll(".dl").forEach(b=>{
    if(b.dataset.downloadEvidence||b.dataset.downloadReport||b.dataset.downloadSnapshot)return;
    b.onclick=function(){toast("Arquivo gerado. Recalcule o hash e compare com a transação.");};
  });
}

$("#home").onclick=function(){page=NAVS[role][0][0];window.scrollTo(0,0);render();};

carregarAtorAtivo();
render();
restoreWallet();
try{
  if(sessionStorage.getItem("explorechem_force_top")==="1"){
    sessionStorage.removeItem("explorechem_force_top");
    window.scrollTo(0,0);
    setTimeout(()=>window.scrollTo(0,0),0);
    setTimeout(()=>window.scrollTo(0,0),120);
  }
}catch(_){}

carregarAtores().then(()=>carregarDocumentosRemotos());

const walletProvider=getWalletProvider();
if(walletProvider&&typeof walletProvider.on==="function"){
  walletProvider.on("accountsChanged",contas=>{walletAddress=contas[0]||"";if(!walletAddress)walletChainId="";renderWallet();});
  walletProvider.on("chainChanged",chainId=>{walletChainId=chainId;renderWallet();});
}
</script>
</body>
</html>
