<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExploreChem — Confidential Industrial Traceability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14252D;
  --ink2:#50656D;
  --mute:#83949A;
  --paper:#F4F8F8;
  --panel:#FFFFFF;
  --sunk:#ECF3F3;
  --tint:#E8F7F3;
  --rule:#DCE8E8;
  --rule2:#BFD3D3;
  --nd:#087E83;
  --nd2:#0EA7A0;
  --nd-soft:#DDF4F0;
  --copper:#B86C36;
  --copper-soft:#F8ECE3;
  --ok:#087A62;
  --ok-soft:#E1F4EC;
  --div:#B34A3A;
  --div-soft:#FBE9E5;
  --att:#926C1B;
  --att-soft:#FBF2D9;
  --pend:#68777D;
  --pend-soft:#E8EFF0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDF8F6; --ink2:#B1C6C8; --mute:#83989B;
    --paper:#10191B; --panel:#172326; --sunk:#132022; --tint:#183536;
    --rule:#2B4446; --rule2:#3B5A5B;
    --nd:#5ED5C9; --nd2:#31BDB4; --nd-soft:#173E3F;
    --copper:#E0A273; --copper-soft:#3A271C;
    --ok:#6BD1AA; --ok-soft:#17372E; --div:#F09A8A; --div-soft:#3A201D;
    --att:#DABB6A; --att-soft:#382E16; --pend:#A2B4B6; --pend-soft:#223133;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Manrope","IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 96% -8%, rgba(14,167,160,.12), transparent 27rem),
    radial-gradient(circle at 7% 28%, rgba(8,126,131,.055), transparent 24rem),
    var(--paper);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(115deg,transparent 0 62%,rgba(255,255,255,.24) 100%)}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
button:active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--nd);outline-offset:2px}
#view.readonly .drop{opacity:.55;cursor:not-allowed;border-style:solid}
#view.readonly input:disabled,#view.readonly select:disabled{opacity:.7;cursor:not-allowed}
#view.readonly .btn:disabled{opacity:.45;box-shadow:none;transform:none;cursor:not-allowed}

.top{
  display:flex;align-items:center;gap:18px;padding:0 clamp(16px,3vw,42px);min-height:78px;
  border-bottom:1px solid color-mix(in srgb,var(--rule) 84%,transparent);
  background:color-mix(in srgb,var(--panel) 86%,transparent);
  backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(23,69,73,.055);
  position:sticky;top:0;z-index:20;flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:11px;padding:5px 9px 5px 5px;border-radius:14px;font-weight:600;font-size:16px;letter-spacing:0}
.brand:hover{background:var(--tint);box-shadow:0 6px 18px rgba(8,126,131,.09)}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--nd-soft),var(--panel));box-shadow:inset 0 0 0 1px rgba(8,126,131,.12),0 5px 14px rgba(8,126,131,.10)}
.brand-copy{display:flex;flex-direction:column;line-height:1.04;text-align:left}
.brand-copy strong{font-size:16px;font-weight:700;letter-spacing:-.035em;color:var(--ink)}
.brand-copy strong span{color:var(--nd)}
.brand-copy small{margin-top:5px;color:var(--mute);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.system-state{display:flex;align-items:center;gap:9px;padding-left:18px;margin-left:2px;border-left:1px solid var(--rule)}
.system-state>span:last-child{display:flex;flex-direction:column;line-height:1.25}
.system-state b{font-size:11px;font-weight:700;color:var(--ink2)}
.system-state small{font-size:9.5px;color:var(--mute)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.session{display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px}
.session-avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,var(--nd-soft),var(--tint));color:var(--nd);box-shadow:inset 0 0 0 1px rgba(8,126,131,.12);display:grid;place-items:center;font-size:12px;font-weight:700}
.session-copy{display:flex;flex-direction:column;line-height:1.3}.session-copy b{font-size:13px;font-weight:600}
.session-copy span{font-size:12px;color:var(--mute)}
.role-switch{display:flex;align-items:center;gap:7px;margin-left:auto}
.role-switch label{margin:0;color:var(--mute);font-size:11px}
.role-switch select{width:auto;padding:6px 8px;font-size:12px;border-radius:7px}
.wallet-area{margin-left:auto;display:flex;align-items:center}
.wallet-connect{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--rule2);border-radius:11px;background:var(--panel);box-shadow:0 4px 12px rgba(20,62,65,.04);font-weight:600;font-size:13px}
.wallet-connect:hover{border-color:var(--nd);background:var(--nd-soft);color:var(--nd);box-shadow:0 7px 18px rgba(8,126,131,.13)}
.wallet-state{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--rule);border-radius:11px;background:var(--sunk);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.wallet-logout{padding:5px 8px;border:1px solid var(--rule2);border-radius:7px;font-size:11px;color:var(--ink2)}
.wallet-logout:hover{border-color:var(--nd);background:var(--nd-soft);color:var(--nd)}
.wallet-network{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.wallet-network:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.wallet-address{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500}
.wallet-warning .wallet-network:before{background:var(--att)}
.readonly-state{font-size:12.5px;color:var(--mute);padding:9px 12px;border:1px solid var(--rule);border-radius:11px;background:var(--sunk)}

.shell{display:flex;min-height:calc(100vh - 78px)}
.rail{width:254px;flex:none;padding:28px 15px 20px;background:color-mix(in srgb,var(--panel) 76%,transparent);border-right:1px solid color-mix(in srgb,var(--rule) 80%,transparent);position:sticky;top:78px;height:calc(100vh - 78px);overflow:auto;display:flex;flex-direction:column}
.rail nav{display:flex;flex-direction:column;gap:4px}
.rail nav button{position:relative;padding:12px 14px 12px 39px;color:var(--ink2);font-size:13.5px;border-radius:12px;margin:0;font-weight:500;text-align:left}
.rail nav button:after{content:"•";position:absolute;left:13px;top:50%;width:18px;height:18px;display:grid;place-items:center;transform:translateY(-50%);color:var(--mute);font-family:"IBM Plex Mono",monospace;font-size:12px;transition:color .18s ease,transform .18s ease}
.rail nav button[data-page="lote"]:after,.rail nav button[data-page="dashboard"]:after{content:"◫"}
.rail nav button[data-page="evidencias"]:after,.rail nav button[data-page="minhas"]:after{content:"◇"}
.rail nav button[data-page="documento"]:after,.rail nav button[data-page="enviar"]:after,.rail nav button[data-page="entrega"]:after{content:"▤"}
.rail nav button[data-page="atores"]:after,.rail nav button[data-page="cadeia"]:after,.rail nav button[data-page="transferencia"]:after{content:"⌘"}
.rail nav button[data-page="cadastro"]:after,.rail nav button[data-page="resultado"]:after{content:"＋"}
.rail nav button[data-page="resultado"]:after{content:"◎"}
.rail nav button:hover{background:var(--sunk);color:var(--ink);padding-left:41px}
.rail nav button:hover:after{color:var(--nd2);transform:translateY(-50%) scale(1.12)}
.rail nav button[aria-current="page"]{color:var(--nd);font-weight:700;background:linear-gradient(90deg,var(--nd-soft),color-mix(in srgb,var(--nd-soft) 44%,transparent));box-shadow:inset 3px 0 0 var(--nd),0 6px 18px rgba(8,126,131,.08)}
.rail nav button[aria-current="page"]:after{color:var(--nd)}
.trust-card{margin-top:auto;padding:16px 15px;border:1px solid var(--rule);border-radius:15px;background:linear-gradient(145deg,var(--sunk),var(--tint));box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.trust-card>div:nth-child(2){margin-top:11px}.trust-card b{font-size:11px}.trust-card p{margin:5px 0 12px;color:var(--mute);font-size:10.5px;line-height:1.55}
.trust-card>span{display:block;padding-top:10px;border-top:1px solid var(--rule);color:var(--nd);font-family:"IBM Plex Mono",monospace;font-size:8.7px;line-height:1.5}
.trust-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:10px;background:var(--panel);color:var(--ok);box-shadow:0 5px 14px rgba(8,126,131,.10);font-weight:700}

main{flex:1;min-width:0;padding:40px clamp(20px,4vw,66px) 88px;max-width:none}
main>*{max-width:1440px;margin-left:auto;margin-right:auto}
@media(max-width:820px){
  .shell{flex-direction:column}
  .rail{width:auto;border-right:0;border-bottom:1px solid var(--rule);padding:12px 0;position:static;height:auto;background:var(--panel)}
  .trust-card{display:none}
  .system-state{display:none}
  .rail nav{flex-direction:row;overflow-x:auto}
  .rail nav button{white-space:nowrap;padding:10px 14px;border-left:0;border-bottom:2px solid transparent}
  .rail nav button[aria-current="page"]{border-left:0;border-bottom-color:var(--nd);background:transparent;box-shadow:none}
  .rail nav button:after{display:none}
  main{padding:28px 16px 62px}
}
@media(max-width:700px){
  .top{min-height:70px}
  .brand-copy small{display:none}
  .brand-copy strong{font-size:15px}
  .session-copy,.wallet-network{display:none}
  .wallet-state{padding:8px 10px}
}

.crumb{font-size:11.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
h1{font-size:34px;font-weight:700;letter-spacing:-.045em;margin:0 0 7px}
h2{font-size:18px;font-weight:700;letter-spacing:-.025em;margin:34px 0 12px}
h3{font-size:14px;font-weight:600;margin:0 0 10px}
.sub{color:var(--ink2);margin:0 0 18px;max-width:66ch;line-height:1.68}
.headrow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.headrow .grow{flex:1;min-width:240px}
.headrow .sub{margin-bottom:0}

.panel{background:var(--panel);border:1px solid color-mix(in srgb,var(--rule) 88%,transparent);border-radius:18px;box-shadow:0 12px 32px rgba(21,68,71,.065),0 2px 6px rgba(21,68,71,.035);overflow:hidden}
.panel:hover{border-color:color-mix(in srgb,var(--rule2) 80%,var(--rule))}
.pad{padding:23px 24px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split32{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media(max-width:880px){.split,.split32{grid-template-columns:1fr}}
.stack>*+*{margin-top:14px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:12px 16px;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--sunk) 60%,var(--panel));white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .16s ease}
tbody tr:hover{background:var(--tint)}
td.num,th.num{text-align:right}
td.num{font-family:"IBM Plex Mono",monospace;font-size:13px;white-space:nowrap}
.scrollx{overflow-x:auto}
.sm{font-size:11.5px;color:var(--mute)}
.stream-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:8px 0 12px}
.stream-heading h3,.stream-heading p{margin:0}.stream-heading p{margin-top:5px}
.stream-table-wrap{border:1px solid var(--rule);border-radius:12px;background:var(--sunk)}
.stream-table{min-width:1880px;background:var(--panel)}
.stream-table th,.stream-table td{padding:9px 7px}.stream-table th{font-size:9.5px}
.stream-table input,.stream-table select{min-width:125px;padding:9px 8px;font-size:12px}
.stream-table td:nth-child(1) select{min-width:170px}.stream-table td:nth-child(2) input{min-width:135px}
.stream-table td:nth-child(4) select,.stream-table td:nth-child(7) select{min-width:150px}
.stream-table td:nth-child(10) input{min-width:150px}.stream-table td:last-child{width:48px}
.json-readonly{margin-top:12px;border:1px solid var(--rule2);border-radius:14px;background:var(--sunk);overflow:hidden}
.json-readonly-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:15px 16px;border-bottom:1px solid var(--rule)}
.json-readonly-head b{display:block}.json-readonly-head span{display:block;margin-top:4px;color:var(--mute);font-size:11px}
.json-companies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.json-company{padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
.json-company small{display:block;color:var(--mute);margin-bottom:4px}.json-company b{display:block;font-size:12px}
.json-code{max-height:380px;overflow:auto;margin:0;padding:16px;color:var(--ink2);font:11px/1.6 "IBM Plex Mono",monospace;white-space:pre;tab-size:2}
.json-error{display:block;margin-top:5px;color:var(--div)!important;font-size:10px}
@media(max-width:700px){.stream-heading{flex-direction:column}.stream-heading .btn{width:100%}}
@media(max-width:700px){.json-readonly-head{flex-direction:column}.json-companies{grid-template-columns:1fr}}

.tag{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.035em;white-space:nowrap;border:1px solid transparent}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-div{background:var(--div-soft);color:var(--div)}
.t-att{background:var(--att-soft);color:var(--att)}
.t-pend{background:var(--pend-soft);color:var(--pend)}
.t-nd{background:var(--nd-soft);color:var(--nd);box-shadow:inset 0 0 0 1px rgba(8,126,131,.11)}
.hash{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2);word-break:break-all}

.identity{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:24px 23px;background:linear-gradient(145deg,var(--panel),var(--tint));box-shadow:0 12px 32px rgba(21,68,71,.06)}
.eqwrap{overflow-x:auto;padding-bottom:4px}
.eq{display:flex;align-items:flex-end;gap:2px;white-space:nowrap;font-family:"IBM Plex Mono",monospace}
.eq .t{display:flex;flex-direction:column;align-items:center;padding:0 6px}
.eq .t i{font-style:normal;font-size:19px;font-weight:500;letter-spacing:-.02em}
.eq .t span{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--mute);margin-top:2px}
.eq .op{color:var(--mute);font-size:16px;padding-bottom:19px}
.eq .t.res i{color:var(--nd);font-weight:600}
.heroline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.heroline .big{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--nd);line-height:1}
.heroline .cap{color:var(--ink2);font-size:13px;max-width:34ch}

.note{border-left:3px solid var(--nd2);border-radius:0 8px 8px 0;padding:6px 0 6px 13px;background:color-mix(in srgb,var(--nd-soft) 55%,transparent);color:var(--ink2);font-size:13px;margin:12px 0 0}

.arb{border:1px solid var(--att);border-left-width:3px;border-radius:12px;background:var(--att-soft);padding:14px 16px;margin-top:14px}
.arb b{color:var(--att);font-size:13px}
.arb p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.arb.bad{border-color:var(--div);background:var(--div-soft)}
.arb.bad b{color:var(--div)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stats div{padding:20px;border:1px solid var(--rule);border-radius:16px;background:var(--panel);box-shadow:0 8px 24px rgba(21,68,71,.045)}
.stats .n{display:block;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
.stats .l{font-size:13px;color:var(--mute)}
@media(max-width:760px){
  .stats{grid-template-columns:1fr 1fr}
  .stats div:nth-child(2){border-right:0}
  .stats div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
}

.chain{display:flex;align-items:stretch;overflow-x:auto;padding:3px 0 8px}
.node{flex:none;min-width:168px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:15px 16px;box-shadow:0 7px 20px rgba(21,68,71,.045)}
.node b{display:block;font-size:13px;font-weight:500;margin-bottom:2px}
.node .r{font-size:11.5px;color:var(--mute)}
.node.self{border-color:var(--nd2);background:var(--nd-soft);box-shadow:0 7px 20px rgba(8,126,131,.12)}
.node.self .r{color:var(--nd)}
.link{flex:none;width:42px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.horizon{flex:none;min-width:192px;border:1px dashed var(--rule2);border-radius:14px;padding:13px 15px;background:var(--sunk);color:var(--mute);font-size:12px;line-height:1.45}
.horizon b{display:block;color:var(--ink2);font-weight:500;font-size:12.5px;margin-bottom:3px}

.chart{width:100%;height:140px;display:block}
.donut{display:flex;align-items:center;gap:16px}
.donut .val{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em}

label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--rule2);border-radius:10px;background:color-mix(in srgb,var(--panel) 92%,var(--sunk));color:var(--ink);font:inherit;font-size:13.5px;box-shadow:inset 0 1px 2px rgba(24,57,59,.04)}
input:focus,select:focus{border-color:var(--nd);outline:3px solid var(--nd-soft);outline-offset:0}
input.mono,select.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.field{margin-bottom:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.f2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule2);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--ink2);background:var(--panel)}
.chip:hover{border-color:var(--nd2);color:var(--nd);background:var(--tint)}
.chip[aria-pressed="true"]{border-color:var(--nd);background:var(--nd-soft);color:var(--nd);font-weight:500}
.btn{background:linear-gradient(135deg,#173B43,#0B6F76);color:#fff;padding:10px 16px;border-radius:11px;font-size:13px;font-weight:700;box-shadow:0 7px 16px rgba(11,111,118,.18)}
.btn:hover{opacity:1;transform:translateY(-1px);box-shadow:0 10px 20px rgba(11,111,118,.27)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--rule2);box-shadow:0 4px 12px rgba(21,68,71,.045);font-weight:400}
.btn.ghost:hover{background:var(--tint);border-color:var(--nd2);color:var(--nd)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.drop{border:1px dashed var(--nd2);border-radius:14px;padding:32px 18px;text-align:center;background:linear-gradient(145deg,var(--tint),var(--sunk));color:var(--mute)}
.drop b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px}
.filerow{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border:1px solid var(--rule);border-radius:11px;background:var(--sunk)}
.filerow .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.kv{display:grid;grid-template-columns:minmax(125px,auto) 1fr;gap:7px 16px;font-size:13px;margin:0}
.kv dt{color:var(--mute);font-size:12px}
.kv dd{margin:0}

.docview{background:var(--sunk);border:1px solid var(--rule);border-radius:16px;padding:22px;background:linear-gradient(145deg,var(--sunk),var(--tint))}
.sheet{background:#fff;color:#15181B;border:1px solid #E2E2DD;border-radius:10px;padding:22px 24px;font-size:12.5px;line-height:1.55;max-width:440px;margin:0 auto;box-shadow:0 14px 30px rgba(21,42,44,.10)}
.sheet h4{margin:0 0 2px;font-size:12.5px;color:#5D4B8C;font-weight:600}
.sheet h5{margin:8px 0 10px;font-size:15px;font-weight:600}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:12px}
.sheet dt{color:#767E85}
.sheet dd{margin:0}
.sheet .ft{margin-top:14px;padding-top:10px;border-top:1px solid #E2E2DD;font-size:11px;color:#767E85}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:60;box-shadow:0 10px 28px rgba(9,50,55,.25)}

.hash-proof{background:linear-gradient(135deg,var(--panel),var(--tint));position:relative}
.hash-proof:after{content:"";position:absolute;right:-32px;bottom:-42px;width:105px;height:105px;border:1px solid rgba(8,126,131,.10);border-radius:50%;box-shadow:0 0 0 14px rgba(8,126,131,.025)}
.hash-proof-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;position:relative;z-index:1}
.hash-proof-head span{display:block;margin-bottom:4px;color:var(--nd);font-size:9px;font-weight:700;letter-spacing:.11em}.hash-proof-head h3{margin:0}
.hash-proof-head>b{padding:5px 8px;border:1px solid rgba(8,126,131,.16);border-radius:8px;background:var(--nd-soft);color:var(--nd);font-size:9px}
.hash-proof .hash{position:relative;z-index:1;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:color-mix(in srgb,var(--panel) 78%,transparent);font-size:10.8px}

/* Product dashboard */
.lot-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);gap:18px;margin-bottom:16px}
.lot-main{position:relative;padding:30px 32px;background:linear-gradient(135deg,var(--panel) 0%,var(--tint) 100%);isolation:isolate}
.lot-main:after{content:"";position:absolute;right:-72px;bottom:-105px;width:270px;height:270px;border:1px solid rgba(8,126,131,.14);border-radius:50%;box-shadow:0 0 0 24px rgba(8,126,131,.035),0 0 0 48px rgba(8,126,131,.025);z-index:-1}
.proof-stack{position:absolute;right:34px;top:25px;width:68px;height:64px;opacity:.7;pointer-events:none}
.proof-stack i{position:absolute;inset:0;border:1px solid rgba(8,126,131,.20);border-radius:13px;background:color-mix(in srgb,var(--panel) 72%,transparent);box-shadow:0 8px 20px rgba(8,126,131,.05)}
.proof-stack i:nth-child(1){transform:translate(-18px,14px) rotate(-7deg);opacity:.45}.proof-stack i:nth-child(2){transform:translate(-9px,7px) rotate(-3deg);opacity:.7}
.proof-stack span{position:absolute;inset:0;display:grid;place-items:center;color:var(--nd);font-family:"IBM Plex Mono",monospace;font-size:25px;font-weight:600}
.lot-kicker{display:flex;align-items:center;gap:9px;color:var(--nd);font-size:12px;font-weight:600;letter-spacing:.02em;margin-bottom:12px}
.lot-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.lot-title h1{font-size:35px;margin:0}
.lot-sub{color:var(--ink2);margin:8px 0 0;max-width:68ch}
.lot-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:25px;padding-top:20px;border-top:1px solid var(--rule)}
.lot-meta span{font-size:12px;color:var(--mute)}
.lot-meta b{color:var(--ink);font-weight:500}
.verdict-card{padding:27px;background:linear-gradient(160deg,#17343A 0%,#0C626B 100%);border-color:#0C626B;box-shadow:0 14px 32px rgba(12,98,107,.2);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:210px}
.verdict-card .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#A9E5DE;font-weight:700}
.verdict-card .verdict{font-size:29px;font-weight:600;letter-spacing:-.025em;margin:8px 0}
.verdict-card .reason{color:#DDD7E8;font-size:14px;line-height:1.5}
.verdict-card .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;margin-top:18px;border-top:1px solid rgba(255,255,255,.16);font-size:13px;color:#A9D4D3}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#E38B76;margin-right:7px;box-shadow:0 0 0 4px rgba(227,139,118,.15)}
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:16px 0}
.metric{position:relative;padding:21px 22px;border:1px solid var(--rule);border-radius:16px;background:var(--panel)}
.metric:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--nd2),transparent);opacity:.72}
.metric .label{display:block;color:var(--mute);font-size:12.5px;font-weight:600;margin-bottom:10px}
.metric .value{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:700;letter-spacing:-.035em}
.metric .unit{font-size:13px;color:var(--mute);margin-left:4px;font-family:"IBM Plex Sans",sans-serif;font-weight:400}
.metric .hint{font-size:12.5px;color:var(--ink2);margin-top:7px}
.metric.alert{border-color:#E8C1B7;background:linear-gradient(145deg,var(--panel),var(--div-soft))}.metric.alert .value{color:var(--div)}
.assurance-strip{display:grid;grid-template-columns:minmax(210px,.55fr) minmax(0,1.7fr);align-items:center;gap:22px;margin:16px 0;padding:18px 22px;border:1px solid color-mix(in srgb,var(--nd) 18%,var(--rule));border-radius:17px;background:linear-gradient(110deg,#153A41 0%,#0A6970 48%,#087E83 100%);color:#fff;box-shadow:0 14px 30px rgba(10,105,112,.15);overflow:hidden;position:relative}
.assurance-strip:after{content:"";position:absolute;width:210px;height:210px;right:-90px;top:-95px;border:1px solid rgba(255,255,255,.13);border-radius:50%;box-shadow:0 0 0 23px rgba(255,255,255,.035)}
.assurance-copy{position:relative;z-index:1}.assurance-copy span{display:block;margin-bottom:5px;color:#9EE0DA;font-size:9.5px;font-weight:700;letter-spacing:.12em}.assurance-copy b{font-size:14px;line-height:1.35}
.assurance-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:12px;position:relative;z-index:1}
.assurance-flow>div{display:flex;align-items:flex-start;gap:9px}.assurance-flow i{flex:none;width:25px;height:25px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.09);color:#A8E8E1;font-family:"IBM Plex Mono",monospace;font-size:9px;font-style:normal}
.assurance-flow span{min-width:0}.assurance-flow b{display:block;font-size:11px}.assurance-flow small{display:block;margin-top:3px;color:#B5D7D7;font-size:9.5px;line-height:1.4}.assurance-flow em{color:#70C7C3;font-style:normal}
.correlation-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.62fr);gap:16px;margin-top:16px;align-items:stretch}
.correlation-card{padding:24px 26px;overflow-x:auto}
.section-eyebrow{display:block;margin-bottom:5px;color:var(--nd);font-size:9px;font-weight:700;letter-spacing:.13em}.correlation-card .section-title h2 .mono{color:var(--nd);font-size:.85em}
.correlation-kpis{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 15px}.correlation-kpis span{padding:6px 9px;border:1px solid var(--rule);border-radius:9px;background:var(--sunk);color:var(--mute);font-size:9.5px}.correlation-kpis b{color:var(--ink);font-size:10.5px}
.correlation-graph{position:relative;min-width:600px;height:270px;border:1px solid var(--rule);border-radius:15px;overflow:hidden;background:radial-gradient(circle at 55% 40%,rgba(14,167,160,.10),transparent 37%),linear-gradient(rgba(8,126,131,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(8,126,131,.035) 1px,transparent 1px),var(--sunk);background-size:auto,24px 24px,24px 24px,auto}
.graph-lines{position:absolute;inset:0;width:100%;height:100%}.graph-lines path{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}.graph-lines .verified{stroke:var(--nd2)}.graph-lines .candidate{stroke:var(--att);stroke-dasharray:5 6}
.cg-node{position:absolute;display:flex;align-items:center;gap:8px;padding:9px 10px 9px 8px;border:1px solid rgba(8,126,131,.24);border-radius:12px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 8px 20px rgba(21,68,71,.10);white-space:nowrap}
.cg-node>i{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(145deg,var(--nd2),var(--nd));color:#fff;font-family:"IBM Plex Mono",monospace;font-size:9px;font-style:normal}.cg-node>span{display:flex;flex-direction:column}.cg-node small{color:var(--nd);font-size:7.5px;font-weight:700;letter-spacing:.08em}.cg-node b{font-size:10.5px}.cg-node em{color:var(--mute);font-size:7.8px;font-style:normal}
.cg-node.pending{border-color:var(--att);border-style:dashed;background:var(--att-soft)}.cg-node.pending>i{background:var(--att);}.cg-node.pending small{color:var(--att)}
.n-origin{left:3%;top:16%}.n-transport{left:21%;top:57%}.n-process{left:45%;top:46%}.n-lab{left:63%;top:8%}.n-dest{right:3%;top:57%}
.graph-legend{position:absolute;left:14px;bottom:12px;display:flex;gap:14px;color:var(--mute);font-size:8.5px}.graph-legend span{display:flex;align-items:center;gap:5px}.graph-legend i{display:block;width:18px;height:2px;background:var(--nd2)}.graph-legend i.dashed{height:0;background:none;border-top:2px dashed var(--att)}
.graph-alert{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--att) 28%,var(--rule));border-radius:12px;background:linear-gradient(90deg,var(--att-soft),color-mix(in srgb,var(--panel) 70%,var(--att-soft)));font-size:11px}.graph-alert>span{color:var(--att)}.graph-alert b{font-size:11px}.graph-alert p{margin:3px 0 7px;color:var(--ink2);line-height:1.5}
.verification-card{padding:24px;display:flex;flex-direction:column;background:linear-gradient(155deg,var(--panel),var(--tint))}
.run-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.run-head span{display:block;margin-bottom:5px;color:var(--nd);font-size:9px;font-weight:700;letter-spacing:.12em}.run-head h2{margin:0;font-size:17px}.run-head>i{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px var(--ok-soft)}
.run-id{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:18px 0;padding:11px 12px;border:1px solid var(--rule);border-radius:11px;background:color-mix(in srgb,var(--panel) 75%,transparent)}.run-id span{color:var(--mute);font-size:9px}.run-id b{color:var(--nd);font-size:10px}.run-id small{grid-column:1/-1;color:var(--mute);font-size:9px}
.verification-score{display:flex;align-items:flex-end;gap:7px;margin:2px 0 10px}.verification-score b{color:var(--nd);font-family:"IBM Plex Mono",monospace;font-size:30px;line-height:1}.verification-score span{padding-bottom:3px;color:var(--mute);font-size:10px}
.verification-list{display:grid;gap:9px;margin:16px 0}.verification-list div{display:flex;justify-content:space-between;gap:12px;font-size:10.5px}.verification-list span{color:var(--mute)}
.trust-note{margin-top:auto;padding:12px 13px;border-left:3px solid var(--nd);border-radius:0 10px 10px 0;background:var(--nd-soft)}.trust-note b{font-size:10.5px}.trust-note p{margin:4px 0 0;color:var(--ink2);font-size:9.5px;line-height:1.5}
.correlation-banner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;margin:0 0 14px;padding:15px 18px;border:1px solid color-mix(in srgb,var(--nd) 20%,var(--rule));border-radius:15px;background:linear-gradient(110deg,var(--tint),var(--panel));box-shadow:0 8px 24px rgba(21,68,71,.045)}
.correlation-banner>div:first-child{display:flex;flex-direction:column}.correlation-banner>div:first-child span{color:var(--nd);font-size:8px;font-weight:700;letter-spacing:.11em}.correlation-banner>div:first-child b{font-size:14px}.correlation-banner p{margin:0;padding-left:18px;border-left:1px solid var(--rule);color:var(--ink2);font-size:10.5px;line-height:1.5}.correlation-banner p strong{color:var(--ink)}
.banner-stat{display:flex;align-items:center;justify-content:center;justify-self:end;align-self:center;width:150px;min-height:42px;box-sizing:border-box;gap:8px;padding:8px 12px;border-radius:10px;background:var(--nd-soft);color:var(--nd);line-height:1;white-space:nowrap}.banner-stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:20px;line-height:1}.banner-stat span{display:flex;align-items:center;text-align:left;font-size:8.5px;line-height:1.25}
.custody,.evidence-card,.balance-card{padding:24px 26px}
.custody-step .dot{border-radius:10px}
.custody-step.done .dot{background:linear-gradient(145deg,var(--nd2),var(--nd));border-color:var(--nd)}
.quiet-warning{display:flex;gap:11px;align-items:flex-start;padding:14px 16px;margin-top:14px;border:1px solid #E7D5A8;border-radius:12px;background:linear-gradient(90deg,var(--att-soft),color-mix(in srgb,var(--att-soft) 35%,var(--panel)));color:#66521F;font-size:13px}
.quiet-warning b{display:block;margin-bottom:2px}.quiet-warning p{margin:0;color:#75643B}
.source-mark{display:inline-flex;align-items:center;padding:3px 6px;margin-right:5px;border-radius:6px;font-family:"IBM Plex Mono",monospace;font-size:7.5px;letter-spacing:.06em;vertical-align:1px}.source-mark.arbit{background:rgba(146,108,27,.12);color:var(--att);box-shadow:inset 0 0 0 1px rgba(146,108,27,.16)}
.evidence-score{display:flex;align-items:flex-end;gap:7px;margin:8px 0 14px}
.evidence-score b{font-family:"IBM Plex Mono",monospace;font-size:34px;line-height:1;letter-spacing:-.04em;font-weight:700;color:var(--nd)}
.evidence-score span{color:var(--mute);font-size:13px;padding-bottom:3px}
.progress{height:9px;border-radius:99px;background:var(--sunk);overflow:hidden}.progress span{display:block;height:100%;width:86%;background:linear-gradient(90deg,var(--nd),var(--nd2));border-radius:inherit}
.evidence-list{display:grid;gap:10px;margin-top:17px}.evidence-list div{display:flex;justify-content:space-between;gap:12px;font-size:13px}.evidence-list span{color:var(--mute)}
.balance-card{padding:24px 26px;margin-top:16px}
.balance-line{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));align-items:center;gap:10px;padding:8px 0 2px;overflow-x:auto}
.balance-item{min-width:120px}.balance-item span{display:block;color:var(--mute);font-size:12.5px;margin-bottom:5px}.balance-item b{font-family:"IBM Plex Mono",monospace;font-size:18px}.balance-op{color:var(--mute);font-size:20px;text-align:center}
.balance-result{padding:13px 15px;border-radius:12px;background:linear-gradient(135deg,var(--div-soft),var(--panel));border:1px solid rgba(179,74,58,.13);color:var(--div)}
.calc-trace{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:10px;min-width:820px;margin-top:18px;padding-top:17px;border-top:1px solid var(--rule);overflow-x:auto}.calc-trace>div{display:flex;align-items:flex-start;gap:8px}.calc-trace i{flex:none;width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:var(--nd-soft);color:var(--nd);font-family:"IBM Plex Mono",monospace;font-size:8px;font-style:normal}.calc-trace span{display:flex;flex-direction:column}.calc-trace b{font-size:9.5px}.calc-trace small{margin-top:2px;color:var(--mute);font-size:8.5px;line-height:1.35}.calc-trace em{color:var(--rule2);font-style:normal}
.product-details{margin-top:14px;border-radius:16px;overflow:hidden}
.product-details summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 24px;cursor:pointer;font-weight:700;background:linear-gradient(90deg,var(--panel),var(--sunk))}
.product-details summary::-webkit-details-marker{display:none}
.product-details summary:after{content:"+";font-family:"IBM Plex Mono",monospace;color:var(--nd);font-size:20px;width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:var(--nd-soft);font-weight:400}
.product-details[open] summary:after{content:"−"}
.product-details summary span{display:block;font-size:12.5px;color:var(--mute);font-weight:400;margin-top:2px}
.product-details .details-body{padding:0 24px 24px;border-top:1px solid var(--rule)}
.product-details .details-body>.panel{box-shadow:none}
.product-details .details-body>.panel:first-child{margin-top:18px}
.version-chain{display:flex;align-items:center;gap:12px;margin:18px 0 12px;padding:14px 16px;border:1px solid var(--rule);border-radius:13px;background:var(--sunk);overflow-x:auto}.version-chain>div{min-width:145px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:11px;background:var(--panel)}.version-chain>div>i{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--pend-soft);color:var(--mute);font-family:"IBM Plex Mono",monospace;font-size:9px;font-style:normal}.version-chain span{display:flex;flex-direction:column}.version-chain b{font-size:9px}.version-chain small{color:var(--mute);font-size:8px}.version-chain em{color:var(--rule2);font-style:normal}.version-chain>div.current{border-color:var(--div);background:var(--div-soft)}.version-chain>div.current>i{background:var(--div);color:#fff}.version-chain>div.current b{color:var(--div)}
.chart-grid{align-items:stretch}
.chart-card{min-height:292px;position:relative}
.chart-card h3{margin-bottom:3px}
.chart-card .chart-sub{margin:0 0 14px;color:var(--mute);font-size:12px}
.chart-wrap{height:205px;position:relative}
.chart-wrap canvas{display:block;width:100%!important;height:100%!important}
.chart-fallback{height:100%;display:grid;place-items:center;text-align:center;padding:18px;border:1px dashed var(--rule2);border-radius:12px;background:var(--sunk);color:var(--mute);font-size:12px}
.chart-fallback b{display:block;color:var(--ink2);margin-bottom:4px}
@media(max-width:1120px){.lot-hero,.product-grid,.correlation-layout{grid-template-columns:1fr}.verdict-card{min-height:0}.metric-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){
  .metric-grid{grid-template-columns:1fr}
  .lot-main,.verdict-card,.custody,.evidence-card,.balance-card{padding:20px}
  .lot-title{display:block}.lot-title .btn{margin-top:16px}
  .custody-path{min-width:720px}.balance-line{min-width:760px}
  .assurance-strip{grid-template-columns:1fr;padding:18px}
  .correlation-banner{grid-template-columns:1fr}.correlation-banner p{padding:10px 0;border-left:0;border-top:1px solid var(--rule)}.banner-stat{justify-self:start}
  .assurance-flow{grid-template-columns:1fr;gap:12px}.assurance-flow em{display:none}
}

/* Cliente — resultado único, balanço e auditoria */
.client-result-hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.72fr);gap:16px;margin-bottom:16px}
.client-order{padding:28px 30px;background:linear-gradient(135deg,var(--panel),var(--tint));position:relative;overflow:hidden}
.client-order:after{content:"";position:absolute;width:220px;height:220px;border:1px solid rgba(8,126,131,.10);border-radius:50%;right:-95px;bottom:-120px;box-shadow:0 0 0 22px rgba(8,126,131,.025)}
.client-kicker{display:flex;align-items:center;gap:8px;color:var(--nd);font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;margin-bottom:8px}
.client-order h1{font-size:32px;margin:0 0 6px}.client-order .sub{margin-bottom:0}
.client-order-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule);position:relative;z-index:1}
.client-order-grid span{display:block;color:var(--mute);font-size:10px;margin-bottom:3px}.client-order-grid b{font-size:12.5px;font-weight:600;word-break:break-word}
.client-final{padding:25px 26px;background:linear-gradient(155deg,#17343A,#0C626B);border-color:#0C626B;color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:220px}
.client-final .eyebrow{color:#A9E5DE;font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.client-final .final-status{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:8px 0}.client-final .final-copy{color:#C4E0DF;font-size:12.5px;line-height:1.55}
.client-final .final-foot{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);display:flex;justify-content:space-between;gap:12px;color:#A9D4D3;font-size:10px}
.client-balance-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 16px}
.client-balance-metric{padding:20px 21px;border:1px solid var(--rule);border-radius:15px;background:var(--panel)}
.client-balance-metric span{display:block;color:var(--mute);font-size:11px;margin-bottom:7px}.client-balance-metric b{display:block;font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:-.03em}.client-balance-metric small{display:block;margin-top:5px;color:var(--ink2);font-size:10px}

@media (prefers-reduced-motion:no-preference){
  @keyframes ec-fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes ec-soft-in{from{opacity:0}to{opacity:1}}
  @keyframes ec-breathe{0%,100%{box-shadow:0 5px 14px rgba(8,126,131,.10)}50%{box-shadow:0 8px 20px rgba(8,126,131,.19)}}
  @keyframes ec-progress{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
  @keyframes ec-route{to{stroke-dashoffset:-22}}
  #view> *{animation:ec-fade-up .42s cubic-bezier(.22,.7,.25,1) both}
  #view> .lot-hero{animation-delay:.03s}
  #view> .metric-grid{animation-delay:.08s}
  #view> .correlation-layout{animation-delay:.13s}
  #view> .product-grid{animation-delay:.13s}
  #view> .balance-card,#view> .product-details{animation-delay:.18s}
  .brand-mark{animation:ec-breathe 4.8s ease-in-out infinite}
  .brand:hover .brand-mark{animation:none;transform:rotate(-4deg) scale(1.05)}
  .panel{transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease}
  .panel:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(21,68,71,.085),0 3px 8px rgba(21,68,71,.04)}
  .lot-main:hover,.verdict-card:hover{transform:translateY(-3px)}
  .metric-grid .metric:nth-child(1){animation:ec-fade-up .45s .10s both}
  .metric-grid .metric:nth-child(2){animation:ec-fade-up .45s .15s both}
  .metric-grid .metric:nth-child(3){animation:ec-fade-up .45s .20s both}
  .metric-grid .metric:nth-child(4){animation:ec-fade-up .45s .25s both}
  .custody-step .dot{transition:transform .22s ease,box-shadow .22s ease}
  .custody-step:hover .dot{transform:translateY(-3px) scale(1.08);box-shadow:0 6px 14px rgba(8,126,131,.22)}
  .progress span{transform-origin:left;animation:ec-progress .9s .28s cubic-bezier(.22,.7,.25,1) both}
  .tag{transition:transform .18s ease,box-shadow .18s ease}
  .tag:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(8,126,131,.12)}
  tbody tr{transition:background .16s ease,transform .16s ease}
  tbody tr:hover{transform:translateX(2px)}
  .product-details[open] .details-body{animation:ec-soft-in .25s ease both}
  .graph-lines .candidate{animation:ec-route 2.8s linear infinite}
  .cg-node{transition:transform .2s ease,box-shadow .2s ease}.cg-node:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(8,126,131,.16)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ===================================================================
   EXPLORECHEM — PREMIUM DARK TEAL VISUAL SYSTEM
   Visual redesign only. Application logic remains unchanged.
   =================================================================== */
:root{
  color-scheme:dark;
  --ink:#F0F8F6;
  --ink2:#A9BFBC;
  --mute:#6F918D;
  --paper:#041A19;
  --panel:#092826;
  --sunk:#071F1E;
  --tint:#0B3532;
  --rule:#174A46;
  --rule2:#286660;
  --nd:#38D7CA;
  --nd2:#2ACABD;
  --nd-soft:#0A3A36;
  --copper:#E5A06D;
  --copper-soft:#3A271E;
  --ok:#62D8AE;
  --ok-soft:#0B352B;
  --div:#F09584;
  --div-soft:#3B211E;
  --att:#E0BB68;
  --att-soft:#352D17;
  --pend:#9CB4B0;
  --pend-soft:#18312F;
}

html{background:#031615}
body{
  min-height:100vh;
  color:var(--ink);
  background:
    radial-gradient(circle at 78% 8%,rgba(37,190,177,.18),transparent 29rem),
    radial-gradient(circle at 94% 48%,rgba(19,105,99,.22),transparent 31rem),
    radial-gradient(circle at 6% 95%,rgba(15,93,87,.16),transparent 30rem),
    linear-gradient(135deg,#031514 0%,#062421 48%,#041A19 100%);
}
body:before{
  z-index:-2;
  background:
    linear-gradient(90deg,rgba(56,215,202,.028) 1px,transparent 1px),
    linear-gradient(rgba(56,215,202,.022) 1px,transparent 1px);
  background-size:54px 54px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 82%);
}
body:after{
  content:"";
  position:fixed;
  width:560px;height:560px;
  right:-220px;top:-235px;
  border:1px solid rgba(56,215,202,.10);
  border-radius:50%;
  box-shadow:0 0 0 74px rgba(56,215,202,.018),0 0 0 148px rgba(56,215,202,.012);
  pointer-events:none;
  z-index:-1;
}

.top{
  min-height:82px;
  border-bottom:1px solid rgba(83,188,179,.16);
  background:rgba(3,24,23,.82);
  backdrop-filter:blur(22px) saturate(135%);

}

}

  border-color:#1C554F;
}
/* Intentionally keep .sheet light to preserve the feeling of a real document. */

/* Client — real blockchain-selected balance */
.client-live-toolbar{
  background:
    radial-gradient(circle at 100% 0,rgba(56,215,202,.08),transparent 40%),
    linear-gradient(110deg,rgba(10,48,45,.97),rgba(6,31,29,.98));
  border-color:rgba(56,215,202,.19);
  box-shadow:0 16px 36px rgba(0,0,0,.15);
}
.client-live-message{
  border-left-color:#39D7CA;
  background:linear-gradient(90deg,rgba(56,215,202,.07),rgba(7,31,29,.95));
}
.client-live-message.error{
  border-left-color:#F09584;
  background:linear-gradient(90deg,rgba(179,74,58,.17),rgba(7,31,29,.95));
}
.client-live-stat{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(145deg,rgba(10,44,41,.98),rgba(6,29,28,.98));
  border-color:rgba(67,149,142,.20);
  box-shadow:0 15px 35px rgba(0,0,0,.12);
}
.client-live-stat:before{
  content:"";
  position:absolute;
  left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,#36D6C9,transparent 72%);
}
.client-live-stat b{color:#F2FAF8}
.client-live-stat span{color:#789792}
.client-live-result-head h2{
  font-family:"DM Serif Display",Georgia,serif;
  font-size:27px;
  font-weight:400;
}
.client-live-warning{color:#718F8A}
.client-live-table{
  border-color:rgba(66,150,142,.18);
}
#clientLiveDashboard > h2{
  margin-top:28px;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.10em;
  color:#75A39D;
}
#clientLatestHash,#clientLatestInputHash,
#clientLatestEvidence,#clientLatestResult{
  color:#A8CAC5;
}

/* Client chart canvas holder */
.client-live-chart{
  padding:10px 6px 2px;
  border-radius:13px;
  background:
    linear-gradient(rgba(56,215,202,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,215,202,.025) 1px,transparent 1px);
  background-size:28px 28px;
}

/* Old client helper components, retained for compatibility */
.client-filter-bar,
.client-result-hero .client-order,
.client-proof{
  background:linear-gradient(145deg,rgba(10,44,41,.97),rgba(6,30,28,.98));
}
.client-filter-meta{
  background:#082523;
  border-color:#1E514C;
}

/* Scrollbar */
*{scrollbar-width:thin;scrollbar-color:#286660 #061C1B}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#061C1B}
::-webkit-scrollbar-thumb{
  background:#1F5D57;
  border:2px solid #061C1B;
  border-radius:999px;
}
::-webkit-scrollbar-thumb:hover{background:#2E7770}

/* Mobile retains the dark product language without reducing readability */
@media(max-width:820px){
  .rail{
    background:rgba(4,26,25,.97);
    border-bottom-color:rgba(67,146,139,.18);
  }
  .rail nav button[aria-current="page"]{
    border-bottom-color:#38D7CA;
  }
}

function novoBytes32(){
  if(window.crypto&&typeof window.crypto.getRandomValues==="function"){
    const bytes=new Uint8Array(32); window.crypto.getRandomValues(bytes);
    return "0x"+Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

async function sha256Arquivo(file){
  const buffer=await file.arrayBuffer();
  if(window.crypto&&window.crypto.subtle){
    const digest=await window.crypto.subtle.digest("SHA-256",buffer);
    return "0x"+Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  if(window.ethers&&typeof ethers.sha256==="function") return ethers.sha256(new Uint8Array(buffer));
  throw new Error("Este navegador não disponibilizou SHA-256 para o arquivo.");
}

/*
 * MVP demo session: the connected wallet is used for the blockchain
 * signature, while Supabase receives an anonymous Auth session so RLS can
 * attribute the evidence row to a real auth.users id. This is intentionally
 * a demo-only convenience; production must replace it with real sign-in.
 */
async function garantirSessaoSupabaseDemo(){
  const atual=await supabaseClient.auth.getSession();
  let user=atual?.data?.session?.user||null;
  if(!user){
    const signed=await supabaseClient.auth.signInAnonymously();
    if(signed.error) throw new Error("Supabase não criou a sessão demo: "+signed.error.message);
    user=signed.data?.user||null;
  }
  if(!user?.id) throw new Error("Supabase não retornou um usuário autenticado.");
  const claim=await supabaseClient.rpc("explorerchem_demo_claim_actors");
  if(claim.error) throw new Error("Não foi possível preparar as permissões demo: "+claim.error.message);
  return user.id;
}

  return garantirSessaoSupabaseDemo();

async function urlAssinada(bucket,path){
  if(!bucket||!path) throw new Error("O documento ainda não possui um caminho de armazenamento.");

  // O bucket de evidências é privado. Antes de solicitar a signed URL,
  // garante a sessão Supabase da demonstração e aplica o claim de atores.
  // Isso afeta somente o acesso ao arquivo original já armazenado;
  // não depende de novo broadcast nem altera a evidência on-chain.
  await garantirSessaoSupabaseDemo();

  const {data,error}=await supabaseClient.storage.from(bucket).createSignedUrl(path,3600);
  if(error) throw new Error("Não foi possível preparar o download: "+error.message);
  if(!data?.signedUrl) throw new Error("O armazenamento não retornou uma URL de download.");
  return data.signedUrl;
}

let _providerLeituraSepolia=null;
async function providerLeituraSepolia(){
  if(_providerLeituraSepolia) return _providerLeituraSepolia;
  if(!window.ethers) throw new Error("Biblioteca ethers não carregou.");
  try{
    const p=new ethers.JsonRpcProvider(SEPOLIA_PUBLIC_RPC,SEPOLIA_CHAIN_ID_DECIMAL,{staticNetwork:true});
    await p.getBlockNumber();
    _providerLeituraSepolia=p;
    return p;
  }catch(publicError){
    const injected=getWalletProvider();
    if(injected){
      const p=new ethers.BrowserProvider(injected);
      const network=await p.getNetwork();
      if(Number(network.chainId)===SEPOLIA_CHAIN_ID_DECIMAL){
        _providerLeituraSepolia=p;
        return p;
      }
    }
    throw new Error("Não foi possível consultar a Sepolia pelo RPC público nem pela carteira: "+(publicError?.message||publicError));
  }
}
async function hashBufferPorAlgoritmo(buffer,algorithm){
  const alg=String(algorithm||"SHA-256").toUpperCase();
  if(alg.includes("KECCAK")) return ethers.keccak256(new Uint8Array(buffer));
  if(window.crypto&&window.crypto.subtle){
    const digest=await window.crypto.subtle.digest("SHA-256",buffer);
    return "0x"+Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  return ethers.sha256(new Uint8Array(buffer));
}
async function recalcularHashOriginal(e){
  if(!e.storagePath) return {hash:null,error:"storage_path ausente"};
  try{
    const url=await urlAssinada(e.storageBucket||EVIDENCE_BUCKET,e.storagePath);
    const response=await fetch(url,{cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    const buffer=await response.arrayBuffer();
    return {hash:await hashBufferPorAlgoritmo(buffer,e.hashAlgorithm),sizeBytes:buffer.byteLength,error:null};
  }catch(error){
    return {hash:null,sizeBytes:null,error:error?.message||String(error)};
  }
}
async function localizarEventoMaisRecente(contract,filter,fromBlock,toBlock){
  let end=Number(toBlock);
  const floor=Math.max(0,Number(fromBlock)||0);
  let chunk=10000;
  while(end>=floor){
    const start=Math.max(floor,end-chunk+1);
    try{
      const logs=await contract.queryFilter(filter,start,end);
      if(logs.length) return logs[logs.length-1];
      end=start-1;
    }catch(error){
      if(chunk>1000){chunk=Math.floor(chunk/2);continue;}
      throw error;
    }
  }
  return null;
}
function parseEventFromReceipt(iface,receipt,eventName,evidenceId){
  if(!receipt) return null;
  for(const log of receipt.logs||[]){
    try{
      const parsed=iface.parseLog(log);
      if(parsed?.name===eventName && igualHex(parsed.args?.evidenceId,evidenceId)) return {parsed,log};
    }catch(_){ }
  }
  return null;
}
async function auditarEvidenciaHibrida(e,ctx){
  const result={source:e,errors:[]};
  try{
    const chainEvidence=await ctx.contract.getEvidence(e.evidenceId);
    result.chainEvidence=chainEvidence;
    result.chainState="REGISTRADA";
    result.actorIdChain=chainEvidence.actorId;
    result.submittedBy=chainEvidence.submittedBy;
    result.evidenceHashChain=chainEvidence.evidenceHash;
    result.createdAtChain=chainEvidence.createdAt;
    result.matchedAtChain=null;
    result.actorIdMatches=!!e.actorId&&igualHex(e.actorId,chainEvidence.actorId);
    result.dbHashMatchesChain=!!e.evidenceHash&&igualHex(e.evidenceHash,chainEvidence.evidenceHash);
    try{result.dbHashVerifiedByContract=await ctx.contract.verifyEvidenceHash(e.evidenceId,e.evidenceHash);}catch(_){result.dbHashVerifiedByContract=result.dbHashMatchesChain;}

    const actorKey=String(chainEvidence.actorId).toLowerCase();
    let actor=ctx.actorCache.get(actorKey);
    if(!actor){actor=await ctx.contract.getActor(chainEvidence.actorId);ctx.actorCache.set(actorKey,actor);}
    result.actor=actor;
    try{result.submittedWalletCurrentlyAuthorized=await ctx.contract.isWalletAuthorized(chainEvidence.actorId,chainEvidence.submittedBy);}catch(_){result.submittedWalletCurrentlyAuthorized=null;}

    if(txHashReal(e.submissionTxHash)){
      try{
        result.submissionReceipt=await ctx.provider.getTransactionReceipt(e.submissionTxHash);
        const parsed=parseEventFromReceipt(ctx.iface,result.submissionReceipt,"EvidenceSubmitted",e.evidenceId);
        if(parsed){
          result.submissionEvent=parsed.parsed;
          result.submissionTxHashChain=result.submissionReceipt.hash||e.submissionTxHash;
          result.submissionBlock=result.submissionReceipt.blockNumber;
          result.submissionEventMatchesActor=igualHex(parsed.parsed.args.actorId,chainEvidence.actorId);
          result.submissionEventMatchesHash=igualHex(parsed.parsed.args.evidenceHash,chainEvidence.evidenceHash);
        }
      }catch(error){result.errors.push("Tx de submissão: "+(error?.message||error));}
    }

    let fromBlock=result.submissionBlock;
    if(fromBlock===undefined||fromBlock===null) fromBlock=Math.max(0,ctx.latestBlock-250000);
    const original=await recalcularHashOriginal(e);
    result.fileHash=original.hash;
    result.fileBytes=original.sizeBytes;
    result.fileHashError=original.error;
    result.fileHashMatchesChain=!!original.hash&&igualHex(original.hash,chainEvidence.evidenceHash);
    result.integrity=original.hash?(result.fileHashMatchesChain?"ÍNTEGRO":"FALHA DE INTEGRIDADE"):"NÃO VERIFICADO";
    result.stateMatchesDb=String(e.state||"").toUpperCase()===result.chainState;
    result.supabaseMatchTxIsStaleZero=!txHashReal(e.matchTxHash)&&String(e.state||"").toUpperCase()==="MATCHED";
  }catch(error){
    result.errors.push(error?.message||String(error));
  }
  return result;
}
function linkTx(tx){
  if(!txHashReal(tx)) return "—";
  const safe=escaparHtml(tx);
  return '<a href="https://sepolia.etherscan.io/tx/'+safe+'" target="_blank" rel="noopener">'+safe+'</a>';
}
function linkBlock(block){
  if(block===undefined||block===null) return "—";
  return '<a href="https://sepolia.etherscan.io/block/'+Number(block)+'" target="_blank" rel="noopener">'+Number(block).toLocaleString("en-US")+'</a>';
}
function fmtBytes(value){
  const n=Number(value||0); if(!Number.isFinite(n)||n<=0)return "—";
  if(n<1024)return n+" B"; if(n<1024*1024)return (n/1024).toFixed(1)+" KB"; return (n/1024/1024).toFixed(2)+" MB";
}
function auditOk(v){return v===true?badgeAudit("OK","ok"):v===false?badgeAudit("DIVERGENTE","bad"):badgeAudit("—","muted");}

let ACTOR_LOAD_SEQUENCE=0, ACTOR_LOAD_ERROR="";
async function atoresNoRegistry(rows,address){
  const provider=await clientBalanceProvider();
  const proofRegistry=new ethers.Contract(address,["function actorRegistry() view returns(address)"],provider);
  const actorAddress=await proofRegistry.actorRegistry();
  if(!ethers.isAddress(actorAddress)||actorAddress===ethers.ZeroAddress)throw new Error("ActorRegistry não configurado.");
  const registry=new ethers.Contract(actorAddress,["function getActor(bytes32) view returns (tuple(bytes32 actorId,address controller,bytes32 registrationHash,uint8 status,uint64 createdAt,uint64 statusUpdatedAt))","error ActorNotFound(bytes32 actorId)"],provider);
  const output=[],seen=new Set();
  for(const row of rows){
    const key=String(row.actor_id||" ").toLowerCase();
    if(!/^0x[0-9a-f]{64}$/.test(key)||seen.has(key))continue;
    try{
      const actor=await registry.getActor(row.actor_id);
      if(Number(actor.status)>0&&String(actor.actorId).toLowerCase()===key){seen.add(key);output.push({...row,chainStatus:Number(actor.status),chainController:actor.controller});}
    }catch(e){
      let missing=e.revert?.name==='ActorNotFound';
      const data=e.data||e.info?.error?.data;
      if(typeof data==='string'){try{missing=registry.interface.parseError(data)?.name==='ActorNotFound';}catch(_){}}
      if(!missing)throw e;
    }
  }
  return output;
}
async function carregarAtores(){
  const sequence=++ACTOR_LOAD_SEQUENCE,address=EXPLORERCHEM_CONTRACT_ADDRESS;
  ATORES=[];ACTOR_LOAD_ERROR="";
  try{

      .select("id,actor_id,display_name,actor_type,country_code,public_wallet_address,created_at")

let conformes=0, divergentes=[], VEREDITO="NAO_ATESTADO";
const CATALOGO_REGRAS=[
  "Base da massa e base do teor coincidem",
  "Temperatura de secagem entre 100 e 110 °C",
  "Fórmula do óxido admitida para o elemento",
  "Mesma versão da tabela de fatores em todas as correntes",
  "Denominador de pureza igual a massa seca",
  "Pesagem e amostragem de umidade no mesmo evento"
];

function recalcular(){
  ELEMENTOS.forEach(x=>{
    x.muf=(x.entrada+x.i0)-(x.saida+x.i1);
    x.banda=x.k*x.sigma;
    x.veredito=Math.abs(x.muf)<=x.banda?"CONFORME":"DIVERGENTE";
    x.rel=x.entrada?x.muf/x.entrada*100:0;
  });
  conformes=ELEMENTOS.filter(x=>x.veredito==="CONFORME").length;
  divergentes=ELEMENTOS.filter(x=>x.veredito==="DIVERGENTE");
  VEREDITO=!ELEMENTOS.length?"NAO_ATESTADO":(divergentes.length?"DIVERGENTE":"CONFORME");
}
recalcular();

async function connectWallet(){
  const provider=getWalletProvider();
  if(!provider){toast("Nenhuma carteira Web3 foi detectada neste navegador.");return;}
  try{
    const contas=await provider.request({method:"eth_requestAccounts"});
    walletAddress=contas[0]||"";

    renderWallet();

  }catch(error){
    toast("A conexão com a carteira não foi autorizada.");
  }

async function restoreWallet(){
  const provider=getWalletProvider();
  if(!provider||role==="cli") return;
  try{
    const contas=await provider.request({method:"eth_accounts"});

    walletChainId=walletAddress?await provider.request({method:"eth_chainId"}):"";

    if(role==="op"&&page==="admin"&&walletAddress&&walletChainId==="0xaa36a7")queueMicrotask(()=>{adminLoadPending();});

}

function disconnectWallet(){
  walletAddress="";

}

async function refreshWalletChain(){
  const provider=getWalletProvider();

}

let envioEvidenciaEmCurso=false;
function chaveEnvioPendente(){
  return "explorechem:pending-anchor:v1:"+SEPOLIA_CHAIN_ID_DECIMAL+":"+
    EXPLORERCHEM_CONTRACT_ADDRESS.toLowerCase()+":"+walletAddress.toLowerCase();

async function concluirEnvioPendente(provider,key,button){
  const raw=localStorage.getItem(key);
  if(!raw)return false;
  const pending=JSON.parse(raw);
  if(!/^0x[0-9a-f]{64}$/i.test(pending.txHash)||!/^0x[0-9a-f]{64}$/i.test(pending.evidenceId))
    throw new Error("Referência local de envio inválida. Verifique a transação antes de reenviar.");
  button.textContent="Concluindo envio anterior…";
  const receipt=await provider.getTransactionReceipt(pending.txHash);
  if(!receipt)throw new Error("A transação "+pending.txHash+" ainda não foi confirmada. Clique novamente após a confirmação; não será enviada outra transação.");
  if(Number((await provider.getNetwork()).chainId)!==SEPOLIA_CHAIN_ID_DECIMAL)
    throw new Error("Selecione Sepolia para concluir o envio pendente.");
  if(Number(receipt.status)!==1){
    const {error}=await supabaseClient.from("explorerchem_evidences")
      .update({state:"ANCHOR_FAILED"}).eq("evidence_id",pending.evidenceId).eq("state","AWAITING_ANCHOR");
    if(error)throw new Error("A transação falhou e o banco não registrou a falha: "+error.message);
    localStorage.removeItem(key);
    throw new Error("A transação anterior reverteu. O cadastro ficou como ANCHOR_FAILED. Você pode iniciar um novo envio.");
  }
  const {data:row,error:readError}=await supabaseClient.from("explorerchem_evidences")
    .select("evidence_id,evidence_hash,submitted_by_user_id,state,submission_tx_hash")
    .eq("evidence_id",pending.evidenceId).single();
  if(readError||!row)throw new Error("Não foi possível recuperar o cadastro do envio: "+(readError?.message||"linha ausente"));
  const userId=await usuarioSupabaseAtual();
  if(row.submitted_by_user_id!==userId)throw new Error("Entre na sessão que iniciou este envio para concluir o cadastro.");
  const registry=new ethers.Contract(EXPLORERCHEM_CONTRACT_ADDRESS,[
    "function getEvidence(bytes32 evidenceId) view returns (tuple(bytes32 evidenceId,bytes32 actorId,address submittedBy,bytes32 evidenceHash,uint64 createdAt))"
  ],provider);
  const evidence=await registry.getEvidence(pending.evidenceId);
  if(evidence.evidenceId.toLowerCase()!==pending.evidenceId.toLowerCase()||
     evidence.evidenceHash.toLowerCase()!==row.evidence_hash.toLowerCase()||
     evidence.submittedBy.toLowerCase()!==walletAddress.toLowerCase())
    throw new Error("Os dados da evidência no contrato não correspondem ao cadastro pendente.");
  // A wallet may route the transaction through another address. Bind the
  // receipt to this Registry's event, rather than assuming receipt.to is it.
  const eventAbi=new ethers.Interface([
    "event EvidenceSubmitted(bytes32 indexed evidenceId,bytes32 indexed actorId,address indexed submittedBy,bytes32 evidenceHash,uint64 createdAt)"
  ]);
  const matchedEvent=(receipt.logs||[]).some(log=>{
    if(log.address?.toLowerCase()!==EXPLORERCHEM_CONTRACT_ADDRESS.toLowerCase())return false;
    try{
      const parsed=eventAbi.parseLog(log);
      return parsed?.name==="EvidenceSubmitted"&&
        parsed.args.evidenceId.toLowerCase()===evidence.evidenceId.toLowerCase()&&
        parsed.args.actorId.toLowerCase()===evidence.actorId.toLowerCase()&&
        parsed.args.submittedBy.toLowerCase()===evidence.submittedBy.toLowerCase()&&
        parsed.args.evidenceHash.toLowerCase()===evidence.evidenceHash.toLowerCase()&&
        BigInt(parsed.args.createdAt)===BigInt(evidence.createdAt);
    }catch(_){return false;}
  });
  if(!matchedEvent){
    const details={evidenceId:pending.evidenceId,txHash:pending.txHash,
      registry:EXPLORERCHEM_CONTRACT_ADDRESS,to:receipt.to,
      logAddresses:(receipt.logs||[]).map(log=>log.address)};
    console.error("Recibo sem o evento esperado da evidência",details);
    throw new Error("A transação "+pending.txHash+" não contém o evento desta evidência no contrato "+EXPLORERCHEM_CONTRACT_ADDRESS+". O envio foi preservado para verificação.");
  }
  if(row.state==="AWAITING_ANCHOR"){
    const {data:updated,error}=await supabaseClient.from("explorerchem_evidences").update({
      state:"PENDING",submission_tx_hash:pending.txHash,
      chain_id:SEPOLIA_CHAIN_ID_DECIMAL,
      chain_created_at:new Date(Number(evidence.createdAt)*1000).toISOString()
    }).eq("evidence_id",pending.evidenceId).eq("state","AWAITING_ANCHOR").select("evidence_id").single();
    if(error||!updated)throw new Error("Transação confirmada: "+pending.txHash+". Falta concluir o banco: "+(error?.message||"cadastro não atualizado")+". Clique novamente para tentar somente essa etapa.");
  }else if(!row.submission_tx_hash||row.submission_tx_hash.toLowerCase()!==pending.txHash.toLowerCase()){
    throw new Error("O cadastro mudou de estado e precisa ser reconciliado com a transação "+pending.txHash);
  }
  localStorage.removeItem(key);
  toast("Envio concluído. Evidência e transação registradas no banco.");
  try{await carregarDocumentosRemotos();}catch(error){console.error("Envio concluído; falha ao atualizar a lista:",error);}
  return true;
}

      "function submitEvidence(bytes32 evidenceId, bytes32 actorId, bytes32 evidenceHash) external"
    ],signer);
    let chainActor;try{chainActor=await contract.getActor(actorId);}catch(_){throw new Error("A empresa responsável "+responsibleActor.nome+" ainda não está cadastrada no contrato novo.");}
    const actorStatus=Number(chainActor.status);if(actorStatus!==2)throw new Error(actorStatus===1?"A empresa responsável ainda aguarda aprovação no contrato novo.":actorStatus===3?"A empresa responsável está suspensa no contrato novo.":"A empresa responsável não está ativa no contrato novo.");
    if(!await contract.isWalletAuthorized(actorId,walletAddress))throw new Error("A carteira conectada não está autorizada a enviar evidências pela empresa "+responsibleActor.nome+".");
    const evidenceHash=await sha256Arquivo(file);
    button.textContent="Uploading file…";
    const upload=await supabaseClient.storage.from(EVIDENCE_BUCKET).upload(storagePath,file,{
      cacheControl:"3600",contentType:mimeType,upsert:false
    });
    if(upload.error) throw new Error("Storage recusou o arquivo: "+upload.error.message);

    button.textContent="Validando cadastro no banco…";
    const payload={
      evidence_id:evidenceId,display_code:"EV-"+Date.now()+"-"+evidenceId.slice(2,10).toUpperCase(),
      actor_db_id:responsibleActor.dbId,
      origin_actor_db_id:originActorDbId,
      destination_actor_db_id:destinationActorDbId,
      lot_reference:String(jsonData?.lotId||"").trim()||null,
      submitted_by_user_id:userId,submitted_wallet:walletAddress,
      document_type:config.documentType,calculation_role:config.calculationRole,state:"AWAITING_ANCHOR",
      evidence_hash:evidenceHash,hash_algorithm:"SHA-256",storage_bucket:EVIDENCE_BUCKET,
      storage_path:storagePath,original_filename:file.name,mime_type:mimeType,size_bytes:file.size,
      extractor_version:"frontend-raw-file-v1",chain_id:SEPOLIA_CHAIN_ID_DECIMAL,
      submission_tx_hash:null,chain_created_at:null
    };
    const {error:metadataError}=await supabaseClient.from("explorerchem_evidences").insert(payload);
    if(metadataError){
      throw new Error("Cadastro recusado pelo banco antes da assinatura: "+metadataError.message+". Nenhuma transação foi enviada.");
    }
    button.textContent="Assinando envio…";
    const tx=await contract.submitEvidence(evidenceId,actorId,evidenceHash);
    if(!/^0x[0-9a-f]{64}$/i.test(tx.hash||""))throw new Error("A carteira não retornou um hash de transação válido.");
    localStorage.setItem(pendingKey,JSON.stringify({evidenceId,txHash:tx.hash}));
    button.textContent="Aguardando confirmação…";
    try{await tx.wait();}
    catch(error){
      // ethers supplies the mined replacement when a transaction is sped up.
      if(error.code==="TRANSACTION_REPLACED"&&!error.cancelled&&error.replacement?.hash){
        localStorage.setItem(pendingKey,JSON.stringify({evidenceId,txHash:error.replacement.hash}));
      }else{throw new Error("Envio preservado: "+tx.hash+". "+(error.shortMessage||error.message||"Confirmação indisponível")+". Clique novamente para verificar sem reenviar.");}
    }
    await concluirEnvioPendente(provider,pendingKey,button);
  }catch(error){
    console.error(error);
    toast(error.message||"Não foi possível enviar a evidência.");
  }finally{
    button.disabled=false; button.textContent=originalText;
  }
}

function toast(m){

  const t=document.createElement("div");

  document.body.appendChild(t);setTimeout(()=>t.remove(),3200);
}

 const host=document.getElementById('tokenEvidenceRows'),status=document.getElementById('tokenEvidenceStatus'),button=document.getElementById('tokenEvidenceRefresh');
 if(!host)return;
 const address=EXPLORERCHEM_CONTRACT_ADDRESS,request=(host.request||0)+1;host.request=request;
 const active=()=>host.isConnected&&host.request===request&&address===EXPLORERCHEM_CONTRACT_ADDRESS;
 button.disabled=true;host.replaceChildren();status.textContent='Consultando os lotes emitidos na blockchain…';
 try{
  const c=await newLotsContext(false),blockTag=await c.provider.getBlockNumber();
  if(c.linked===ethers.ZeroAddress)throw Error('O Registry ainda não está vinculado ao contrato de lotes.');
  const count=await c.lots.lotCount({blockTag}),groups=new Map();
  for(let id=1n;id<=count;id++){
   if(!active())return;
   const lot=await c.lots.getLot(id,{blockTag});
   checkedHash(lot.evidenceId);
   const key=lot.evidenceId.toLowerCase();
   if(!groups.has(key))groups.set(key,{id:lot.evidenceId,lots:[]});
   groups.get(key).lots.push(id.toString());
   status.textContent='Consultando lote '+id+' de '+count+'…';
  }
  const indexed=new Map(evidenciasExibidas().map(e=>[String(e.id).toLowerCase(),e]));
  const rows=[];const labels=['NÃO REGISTRADO','PENDING','COMPLIANT','DIVERGENT','NOT_ATTESTED'];
  for(const g of groups.values()){
   if(!active())return;
   const [evidence,state]=await Promise.all([c.registry.getEvidence(g.id,{blockTag}),c.registry.getCurrentProofState(g.id,{blockTag})]);
   if(!igualHex(evidence.evidenceId,g.id))throw Error('Vínculo de evidência inconsistente no Registry.');
   const local=indexed.get(g.id.toLowerCase()),esc=escaparHtml;
   const proofStatus=n=>esc(labels[Number(n)]||('ESTADO '+n));
   rows.push('<tr><td class="mono" style="overflow-wrap:anywhere;max-width:240px">'+esc(g.id)+'</td><td>'+esc(local?.ator||evidence.actorId)+'</td><td>'+esc(local?.doc||'Documento privado não disponível nesta sessão')+'</td><td>'+g.lots.map(id=>'#'+id).join(', ')+'</td><td>'+proofStatus(state.mufStatus)+'</td><td>'+proofStatus(state.elementalStatus)+'</td><td>Emissão registrada</td></tr>');
  }
  if(!active())return;
  host.innerHTML=rows.length?'<table><thead><tr><th>Evidência</th><th>Empresa de origem</th><th>Documento</th><th>Tokens / lotes</th><th>MUF atual</th><th>ELEMENTAL atual</th><th>Tokenização</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>':'<div class="pad">Nenhuma evidência vinculada a tokens emitidos neste contrato.</div>';
  status.textContent=groups.size+' evidência(s) · '+count+' lote(s) · Sepolia · bloco '+blockTag;
 }catch(e){if(active()){host.replaceChildren();status.textContent='Não foi possível consultar as evidências dos tokens: '+(e.message||String(e));}}
 finally{if(active())button.disabled=false;}
}

async function salvarCarteiraPublicaAtor(actorDbId,addressInput,button){
  const actor=ATORES.find(a=>String(a.dbId)===String(actorDbId));
  if(!actor){toast("Empresa não encontrada.");return;}
  if(!window.ethers){toast("Biblioteca Web3 não carregou.");return;}
  const raw=String(addressInput?.value||"").trim();
  if(!ethers.isAddress(raw)){toast("Informe um endereço Ethereum válido.");return;}
  const address=ethers.getAddress(raw),originalText=button.textContent;
  button.disabled=true;button.textContent="Salvando…";
  try{
    const {data,error}=await supabaseClient.from("explorerchem_actors")
      .update({public_wallet_address:address})
      .eq("id",actor.dbId)
      .select("id,public_wallet_address");
    if(error)throw new Error(error.message);
    if(!Array.isArray(data)||data.length!==1)throw new Error("Seu usuário do Supabase não está vinculado a esta empresa.");
    actor.publicWalletAddress=data[0].public_wallet_address;
    actor.carteiras=1;
    toast("Carteira pública de "+actor.nome+" atualizada.");
    await carregarAtores();
  }catch(error){
    console.error(error);
    toast("Não foi possível atualizar a carteira: "+(error.message||error));
  }finally{
    button.disabled=false;button.textContent=originalText;
  }
}

function relatorioClienteAtual(){
  const resultDbId=LOTE?.clientResultDbId||LOTE?.resultDbId||LOTE?.balanceResultDbId;
  return RELATORIOS_REMOTOS.find(r=>!resultDbId||r.result_db_id===resultDbId)||
    RELATORIOS_REMOTOS[0]||LOTE?.reportFile||null;
}
function evidenciaClienteAtual(){
  const actorId=String(LOTE?.clientActorId||LOTE?.resultOwnerActorId||LOTE?.actorId||"").toLowerCase();
  const company=String(LOTE?.sharingCompany||LOTE?.supplierName||LOTE?.actorName||"").trim().toLowerCase();
  const candidates=EVIDENCIAS_REMOTAS.filter(e=>{
    if(actorId&&String(e.actorId||"").toLowerCase()===actorId) return true;
    if(company&&String(e.actorName||"").trim().toLowerCase()===company) return true;
    return false;
  });
  return candidates.sort((a,b)=>String(b.submittedAt||"").localeCompare(String(a.submittedAt||"")))[0]||null;
}
function normalizarStatusCliente(value){
  const s=String(value||"").trim().toUpperCase().replace(/\s+/g,"_");
  if(["VERIFIED","VERIFICADO","AUDITED","AUDIT_VERIFIED"].includes(s)) return "VERIFIED";
  if(["DIVERGENT","DIVERGENTE","REJECTED","REPROVADO","AUDIT_DIVERGENT"].includes(s)) return "DIVERGENT";
  if(["MATCHED","CONFORME"].includes(s)) return s;
  return s||"PENDING";
}
function auditoriaClienteAtual(){
  const ev=evidenciaClienteAtual();
  const raw=LOTE?.clientAuditStatus||LOTE?.auditStatus||LOTE?.auditorStatus||LOTE?.latestAuditStatus||LOTE?.audit?.status||ev?.auditStatus||ev?.state;
  const status=normalizarStatusCliente(raw);
  const explicit=!!(LOTE?.clientAuditStatus||LOTE?.auditStatus||LOTE?.auditorStatus||LOTE?.latestAuditStatus||LOTE?.audit?.status);
  const audited=status==="VERIFIED"||status==="DIVERGENT";
  return {
    status:audited?status:"PENDING",
    explicit,
    txHash:LOTE?.clientAuditTxHash||LOTE?.auditTxHash||LOTE?.auditorTransactionHash||LOTE?.audit?.txHash||"",
    resultId:LOTE?.clientAuditResultId||LOTE?.auditResultId||LOTE?.audit?.resultId||"",
    auditedAt:LOTE?.clientAuditedAt||LOTE?.auditedAt||LOTE?.audit?.auditedAt||""
  };
}
function matchClienteAtual(){
  const ev=evidenciaClienteAtual();
  const status=normalizarStatusCliente(LOTE?.clientMatchStatus||LOTE?.matchStatus||ev?.state);
  return {
    status:["MATCHED","VERIFIED","DIVERGENT"].includes(status)?"MATCHED":"PENDING",
    txHash:LOTE?.clientMatchTxHash||LOTE?.matchTxHash||ev?.matchTxHash||"",
    matchedAt:LOTE?.clientMatchedAt||LOTE?.matchedAt||ev?.matchedAt||""
  };
}

  if(!ator) return [];

    String(e.actorName||"").trim().toLowerCase()===String(ator.nome||"").trim().toLowerCase()

  });

function balancoDemonstracaoAtor(ator,ev,totalBalancos){
  const nome=String(ator?.nome||"").toLowerCase();
  let demo=null;
  if(nome.includes("serra clara")) demo={
    lotId:"LOT-ND-2026-001", destino:"Rota Mineral Logística S.A.", declarada:800, confirmada:800,
    origemLabel:"Massa enviada", destinoLabel:"Coleta confirmada", diferenca:0, status:"CONFORME",
    descricao:"A saída declarada pelo minerador é comparada com a coleta registrada pela transportadora."
  };
  else if(nome.includes("rota mineral")) demo={
    lotId:"LOT-ND-2026-001", destino:"Neodym Processamento Mineral Ltda.", declarada:798, confirmada:798,
    origemLabel:"Massa entregue", destinoLabel:"Entrada no destino", diferenca:0, status:"CONFORME",
    descricao:"A transportadora entregou 798 kg; a etapa de processamento declara os mesmos 798 kg como entrada."
  };
  else if(nome.includes("neodym")) demo={
    lotId:"LOT-ND-2026-001", destino:"Magnetra Componentes Avançados S.A.", declarada:11.7551, confirmada:11.7551,
    origemLabel:"Produto purificado", destinoLabel:"Entrada na fabricação", diferenca:0, status:"CONFORME",
    descricao:"O produto purificado enviado pela Neodym coincide com a massa de Nd2O3 declarada como entrada pela Magnetra."
  };
  else if(nome.includes("magnetra")) demo={
    lotId:"LOT-ND-2026-001", destino:"CircularMet Recuperação de Materiais Ltda.", declarada:1.7551, confirmada:1.7551,
    origemLabel:"Sucata enviada", destinoLabel:"Sucata recebida", diferenca:0, status:"CONFORME",
    descricao:"A sucata gerada na fabricação é comparada com a massa recebida pela recicladora."
  };
  else if(nome.includes("circularmet")) demo={
    lotId:"LOT-ND-2026-001", destino:"Magnetra Componentes Avançados S.A.", declarada:1.7551, confirmada:1.7551,
    origemLabel:"Material recebido", destinoLabel:"Produto recuperado", diferenca:0, status:"CONFORME",
    descricao:"A recicladora declara 1,7551 kg de material de entrada e 1,7551 kg de produto recuperado."
  };
  if(!demo) return null;

  /*
   * Se ainda existe somente um balanço para o ator, usamos os números da
   * demonstração atual. Quando houver histórico com vários balanços, nunca
   * reciclamos esses números para um resultado novo: somente o evidenceId
   * original da demo recebe esse recorte; os demais aguardam o resultado
   * próprio do CRE/TEE.
   */
  if(!ev || Number(totalBalancos||0)<=1) return demo;
  const esperado=evidenceDemoIdDoAtor(ator);
  if(esperado && String(ev.evidenceId||"").toLowerCase()===esperado.toLowerCase()) return demo;
  return null;
}
function dataCurtaCliente(value){
  if(!value) return "Sem data";
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleDateString("en-US");
}
function idCurtoCliente(value){
  const s=String(value||"");
  if(!s) return "resultado";
  return s.length>24?s.slice(0,10)+"…"+s.slice(-8):s;
}
function rotuloBalancoCliente(ev,index){
  if(!ev) return "Balanço atual";
  const data=dataCurtaCliente(ev.submittedAt);
  const codigo=ev.displayCode||ev.originalFilename||idCurtoCliente(ev.evidenceId);
  const estado=normalizarStatusCliente(ev.state);
  return data+" · "+codigo+" · "+estado;
}

function clientBalanceSameHex(a,b){
  return String(a||"").toLowerCase()===String(b||"").toLowerCase();
}
function clientBalanceStableValue(value){
  if(Array.isArray(value)) return value.map(clientBalanceStableValue);
  if(value!==null&&typeof value==="object"){
    return Object.fromEntries(
      Object.keys(value).sort().map(key=>[key,clientBalanceStableValue(value[key])])
    );
  }
  return value;
}
function clientBalanceStableJson(value){
  return JSON.stringify(clientBalanceStableValue(value));
}
function clientBalanceHashStable(value){
  return ethers.keccak256(ethers.toUtf8Bytes(clientBalanceStableJson(value)));
}
function clientBalanceHashText(value){
  return ethers.keccak256(ethers.toUtf8Bytes(String(value)));
}
function clientBalanceEvidenceState(value){
  return ["NONE","PENDING","MATCHED","VERIFIED","DIVERGENT"][Number(value)]||"UNKNOWN";
}
function clientBalanceResultState(value){
  return ["UNKNOWN","COMPLIANT","DIVERGENT","NOT ATTESTED"][Number(value)]||"UNKNOWN";
}
function clientBalanceMassState(value){
  return {CONFORME:"COMPLIANT",DIVERGENTE:"DIVERGENT",NAO_ATESTADO:"NOT ATTESTED",NOT_ATTESTED:"NOT ATTESTED"}[value]||
    String(value||"UNKNOWN");
}
function clientBalanceTag(value){
  const label=clientBalanceMassState(value);
  const kind=(label==="COMPLIANT"||label==="VERIFIED"||label==="HASH VERIFIED")?"t-ok":
    label==="DIVERGENT"?"t-div":
    (label==="MATCHED"||label==="NOT ATTESTED"||label==="PENDING")?"t-att":"t-pend";
  return '<span class="tag '+kind+'">'+escaparHtml(label)+'</span>';
}
function clientBalanceShort(value){
