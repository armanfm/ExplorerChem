# ExploreChem CI
#
# Runs on every push and pull request to develop and main.
# Each job shows up as a separate check on the pull request.
#
# What it checks today:
#   solidity       contracts compile with solc 0.8.26; Slither fails the run on HIGH impact findings
#   cre-workflows  MUF and Elemental workflows install from the lockfile and pass the TypeScript typecheck
#   solana         Anchor program passes cargo clippy with warnings treated as errors
#   secrets        gitleaks scans the full git history for committed secrets
#
# Not yet included (next steps, see the PR description):
#   - Foundry tests for the contracts (the repo has no Solidity tests yet)
#   - bun test for the CRE workflows (main.test.ts is still the CRE template and imports
#     onCronTrigger, which main.ts no longer exports)
#   - anchor test for the Solana program (needs Solana CLI, Anchor CLI and a local validator)
#
# Third-party actions are pinned to a full commit SHA, not a tag, because a tag can be moved.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solidity:
    name: solidity (compile + slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install solc 0.8.26 and Slither
        run: |
          pip install slither-analyzer==0.11.6 solc-select==1.2.0
          solc-select install 0.8.26
          solc-select use 0.8.26

      - name: Compile contracts
        run: |
          for f in contracts/*.sol; do
            echo "Compiling $f"
            solc --base-path . "$f" > /dev/null
          done

      - name: Slither (fails on HIGH impact)
        run: slither contracts/ --fail-high

  cre-workflows:
    name: cre-workflows (${{ matrix.workflow }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workflow:
          - muf/muf-worflow
          - elemental/elemental-worflow
    defaults:
      run:
        working-directory: workflows/${{ matrix.workflow }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

  solana:
    name: solana (clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # rust-toolchain.toml pins Rust 1.89.0 with clippy; rustup installs it automatically.
      - name: Clippy
        # --locked fails the job if Cargo.toml changed without an updated Cargo.lock.
        run: cargo clippy --locked --all-targets -- -D warnings

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # full history, so old commits are scanned too

      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz

      - name: Scan history
        # --redact keeps any detected value out of the public job log.
        run: ./gitleaks git --redact --verbose --config .gitleaks.toml .
