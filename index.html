<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExploreChem — Confidential Industrial Traceability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14252D;
  --ink2:#50656D;
  --mute:#83949A;
  --paper:#F4F8F8;
  --panel:#FFFFFF;
  --sunk:#ECF3F3;
  --tint:#E8F7F3;
  --rule:#DCE8E8;
  --rule2:#BFD3D3;
  --nd:#087E83;
  --nd2:#0EA7A0;
  --nd-soft:#DDF4F0;
  --copper:#B86C36;
  --copper-soft:#F8ECE3;
  --ok:#087A62;
  --ok-soft:#E1F4EC;
  --div:#B34A3A;
  --div-soft:#FBE9E5;
  --att:#926C1B;
  --att-soft:#FBF2D9;
  --pend:#68777D;
  --pend-soft:#E8EFF0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDF8F6; --ink2:#B1C6C8; --mute:#83989B;
    --paper:#10191B; --panel:#172326; --sunk:#132022; --tint:#183536;
    --rule:#2B4446; --rule2:#3B5A5B;
    --nd:#5ED5C9; --nd2:#31BDB4; --nd-soft:#173E3F;
    --copper:#E0A273; --copper-soft:#3A271C;
    --ok:#6BD1AA; --ok-soft:#17372E; --div:#F09A8A; --div-soft:#3A201D;
    --att:#DABB6A; --att-soft:#382E16; --pend:#A2B4B6; --pend-soft:#223133;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Manrope","IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 96% -8%, rgba(14,167,160,.12), transparent 27rem),
    radial-gradient(circle at 7% 28%, rgba(8,126,131,.055), transparent 24rem),
    var(--paper);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(115deg,transparent 0 62%,rgba(255,255,255,.24) 100%)}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:background .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
button:active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--nd);outline-offset:2px}
#view.readonly .drop{opacity:.55;cursor:not-allowed;border-style:solid}
#view.readonly input:disabled,#view.readonly select:disabled{opacity:.7;cursor:not-allowed}
#view.readonly .btn:disabled{opacity:.45;box-shadow:none;transform:none;cursor:not-allowed}

.top{
  display:flex;align-items:center;gap:18px;padding:0 clamp(16px,3vw,42px);min-height:78px;
  border-bottom:1px solid color-mix(in srgb,var(--rule) 84%,transparent);
  background:color-mix(in srgb,var(--panel) 86%,transparent);
  backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(23,69,73,.055);
  position:sticky;top:0;z-index:20;flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:11px;padding:5px 9px 5px 5px;border-radius:14px;font-weight:600;font-size:16px;letter-spacing:0}
.brand:hover{background:var(--tint);box-shadow:0 6px 18px rgba(8,126,131,.09)}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--nd-soft),var(--panel));box-shadow:inset 0 0 0 1px rgba(8,126,131,.12),0 5px 14px rgba(8,126,131,.10)}
.brand-copy{display:flex;flex-direction:column;line-height:1.04;text-align:left}
.brand-copy strong{font-size:16px;font-weight:700;letter-spacing:-.035em;color:var(--ink)}
.brand-copy strong span{color:var(--nd)}
.brand-copy small{margin-top:5px;color:var(--mute);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.system-state{display:flex;align-items:center;gap:9px;padding-left:18px;margin-left:2px;border-left:1px solid var(--rule)}
.system-state>span:last-child{display:flex;flex-direction:column;line-height:1.25}
.system-state b{font-size:11px;font-weight:700;color:var(--ink2)}
.system-state small{font-size:9.5px;color:var(--mute)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.session{display:flex;align-items:center;gap:10px;padding:5px 8px 5px 5px}
.session-avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,var(--nd-soft),var(--tint));color:var(--nd);box-shadow:inset 0 0 0 1px rgba(8,126,131,.12);display:grid;place-items:center;font-size:12px;font-weight:700}
.session-copy{display:flex;flex-direction:column;line-height:1.3}.session-copy b{font-size:13px;font-weight:600}
.session-copy span{font-size:12px;color:var(--mute)}
.role-switch{display:flex;align-items:center;gap:7px;margin-left:auto}
.role-switch label{margin:0;color:var(--mute);font-size:11px}
.role-switch select{width:auto;padding:6px 8px;font-size:12px;border-radius:7px}
.wallet-area{margin-left:auto;display:flex;align-items:center}
.wallet-connect{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--rule2);border-radius:11px;background:var(--panel);box-shadow:0 4px 12px rgba(20,62,65,.04);font-weight:600;font-size:13px}
.wallet-connect:hover{border-color:var(--nd);background:var(--nd-soft);color:var(--nd);box-shadow:0 7px 18px rgba(8,126,131,.13)}
.wallet-state{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--rule);border-radius:11px;background:var(--sunk);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.wallet-logout{padding:5px 8px;border:1px solid var(--rule2);border-radius:7px;font-size:11px;color:var(--ink2)}
.wallet-logout:hover{border-color:var(--nd);background:var(--nd-soft);color:var(--nd)}
.wallet-network{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.wallet-network:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.wallet-address{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500}
.wallet-warning .wallet-network:before{background:var(--att)}
.readonly-state{font-size:12.5px;color:var(--mute);padding:9px 12px;border:1px solid var(--rule);border-radius:11px;background:var(--sunk)}

.shell{display:flex;min-height:calc(100vh - 78px)}
.rail{width:254px;flex:none;padding:28px 15px 20px;background:color-mix(in srgb,var(--panel) 76%,transparent);border-right:1px solid color-mix(in srgb,var(--rule) 80%,transparent);position:sticky;top:78px;height:calc(100vh - 78px);overflow:auto;display:flex;flex-direction:column}
.rail nav{display:flex;flex-direction:column;gap:4px}
.rail nav button{position:relative;padding:12px 14px 12px 39px;color:var(--ink2);font-size:13.5px;border-radius:12px;margin:0;font-weight:500;text-align:left}
.rail nav button:after{content:"•";position:absolute;left:13px;top:50%;width:18px;height:18px;display:grid;place-items:center;transform:translateY(-50%);color:var(--mute);font-family:"IBM Plex Mono",monospace;font-size:12px;transition:color .18s ease,transform .18s ease}
.rail nav button[data-page="lote"]:after,.rail nav button[data-page="dashboard"]:after{content:"◫"}
.rail nav button[data-page="evidencias"]:after,.rail nav button[data-page="minhas"]:after{content:"◇"}
.rail nav button[data-page="documento"]:after,.rail nav button[data-page="enviar"]:after,.rail nav button[data-page="entrega"]:after{content:"▤"}
.rail nav button[data-page="atores"]:after,.rail nav button[data-page="cadeia"]:after,.rail nav button[data-page="transferencia"]:after{content:"⌘"}
.rail nav button[data-page="cadastro"]:after,.rail nav button[data-page="resultado"]:after{content:"＋"}
.rail nav button[data-page="resultado"]:after{content:"◎"}
.rail nav button:hover{background:var(--sunk);color:var(--ink);padding-left:41px}
.rail nav button:hover:after{color:var(--nd2);transform:translateY(-50%) scale(1.12)}
.rail nav button[aria-current="page"]{color:var(--nd);font-weight:700;background:linear-gradient(90deg,var(--nd-soft),color-mix(in srgb,var(--nd-soft) 44%,transparent));box-shadow:inset 3px 0 0 var(--nd),0 6px 18px rgba(8,126,131,.08)}
.rail nav button[aria-current="page"]:after{color:var(--nd)}
.trust-card{margin-top:auto;padding:16px 15px;border:1px solid var(--rule);border-radius:15px;background:linear-gradient(145deg,var(--sunk),var(--tint));box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.trust-card>div:nth-child(2){margin-top:11px}.trust-card b{font-size:11px}.trust-card p{margin:5px 0 12px;color:var(--mute);font-size:10.5px;line-height:1.55}
.trust-card>span{display:block;padding-top:10px;border-top:1px solid var(--rule);color:var(--nd);font-family:"IBM Plex Mono",monospace;font-size:8.7px;line-height:1.5}
.trust-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:10px;background:var(--panel);color:var(--ok);box-shadow:0 5px 14px rgba(8,126,131,.10);font-weight:700}

main{flex:1;min-width:0;padding:40px clamp(20px,4vw,66px) 88px;max-width:none}
main>*{max-width:1440px;margin-left:auto;margin-right:auto}
@media(max-width:820px){
  .shell{flex-direction:column}
  .rail{width:auto;border-right:0;border-bottom:1px solid var(--rule);padding:12px 0;position:static;height:auto;background:var(--panel)}
  .trust-card{display:none}
  .system-state{display:none}
  .rail nav{flex-direction:row;overflow-x:auto}
  .rail nav button{white-space:nowrap;padding:10px 14px;border-left:0;border-bottom:2px solid transparent}
  .rail nav button[aria-current="page"]{border-left:0;border-bottom-color:var(--nd);background:transparent;box-shadow:none}
  .rail nav button:after{display:none}
  main{padding:28px 16px 62px}
}
@media(max-width:700px){
  .top{min-height:70px}
  .brand-copy small{display:none}
  .brand-copy strong{font-size:15px}
  .session-copy,.wallet-network{display:none}
  .wallet-state{padding:8px 10px}
}

.crumb{font-size:11.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
h1{font-size:34px;font-weight:700;letter-spacing:-.045em;margin:0 0 7px}
h2{font-size:18px;font-weight:700;letter-spacing:-.025em;margin:34px 0 12px}
h3{font-size:14px;font-weight:600;margin:0 0 10px}
.sub{color:var(--ink2);margin:0 0 18px;max-width:66ch;line-height:1.68}
.headrow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.headrow .grow{flex:1;min-width:240px}
.headrow .sub{margin-bottom:0}

.panel{background:var(--panel);border:1px solid color-mix(in srgb,var(--rule) 88%,transparent);border-radius:18px;box-shadow:0 12px 32px rgba(21,68,71,.065),0 2px 6px rgba(21,68,71,.035);overflow:hidden}
.panel:hover{border-color:color-mix(in srgb,var(--rule2) 80%,var(--rule))}
.pad{padding:23px 24px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split32{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media(max-width:880px){.split,.split32{grid-template-columns:1fr}}
.stack>*+*{margin-top:14px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:12px 16px;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--sunk) 60%,var(--panel));white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .16s ease}
tbody tr:hover{background:var(--tint)}
td.num,th.num{text-align:right}
td.num{font-family:"IBM Plex Mono",monospace;font-size:13px;white-space:nowrap}
.scrollx{overflow-x:auto}
.sm{font-size:11.5px;color:var(--mute)}

.tag{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.035em;white-space:nowrap;border:1px solid transparent}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-div{background:var(--div-soft);color:var(--div)}
.t-att{background:var(--att-soft);color:var(--att)}
.t-pend{background:var(--pend-soft);color:var(--pend)}
.t-nd{background:var(--nd-soft);color:var(--nd);box-shadow:inset 0 0 0 1px rgba(8,126,131,.11)}
.hash{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2);word-break:break-all}

.identity{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:24px 23px;background:linear-gradient(145deg,var(--panel),var(--tint));box-shadow:0 12px 32px rgba(21,68,71,.06)}
.eqwrap{overflow-x:auto;padding-bottom:4px}
.eq{display:flex;align-items:flex-end;gap:2px;white-space:nowrap;font-family:"IBM Plex Mono",monospace}
.eq .t{display:flex;flex-direction:column;align-items:center;padding:0 6px}
.eq .t i{font-style:normal;font-size:19px;font-weight:500;letter-spacing:-.02em}
.eq .t span{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--mute);margin-top:2px}
.eq .op{color:var(--mute);font-size:16px;padding-bottom:19px}
.eq .t.res i{color:var(--nd);font-weight:600}
.heroline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.heroline .big{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--nd);line-height:1}
.heroline .cap{color:var(--ink2);font-size:13px;max-width:34ch}

.note{border-left:3px solid var(--nd2);border-radius:0 8px 8px 0;padding:6px 0 6px 13px;background:color-mix(in srgb,var(--nd-soft) 55%,transparent);color:var(--ink2);font-size:13px;margin:12px 0 0}

.arb{border:1px solid var(--att);border-left-width:3px;border-radius:12px;background:var(--att-soft);padding:14px 16px;margin-top:14px}
.arb b{color:var(--att);font-size:13px}
.arb p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.arb.bad{border-color:var(--div);background:var(--div-soft)}
.arb.bad b{color:var(--div)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stats div{padding:20px;border:1px solid var(--rule);border-radius:16px;background:var(--panel);box-shadow:0 8px 24px rgba(21,68,71,.045)}
.stats .n{display:block;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
.stats .l{font-size:13px;color:var(--mute)}
@media(max-width:760px){
  .stats{grid-template-columns:1fr 1fr}
  .stats div:nth-child(2){border-right:0}
  .stats div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
}

.chain{display:flex;align-items:stretch;overflow-x:auto;padding:3px 0 8px}
.node{flex:none;min-width:168px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:15px 16px;box-shadow:0 7px 20px rgba(21,68,71,.045)}
.node b{display:block;font-size:13px;font-weight:500;margin-bottom:2px}
.node .r{font-size:11.5px;color:var(--mute)}
.node.self{border-color:var(--nd2);background:var(--nd-soft);box-shadow:0 7px 20px rgba(8,126,131,.12)}
.node.self .r{color:var(--nd)}
.link{flex:none;width:42px;display:flex;align-items:center;justify-content:center;color:var(--rule2)}
.horizon{flex:none;min-width:192px;border:1px dashed var(--rule2);border-radius:14px;padding:13px 15px;background:var(--sunk);color:var(--mute);font-size:12px;line-height:1.45}
.horizon b{display:block;color:var(--ink2);font-weight:500;font-size:12.5px;margin-bottom:3px}

.chart{width:100%;height:140px;display:block}
.donut{display:flex;align-items:center;gap:16px}
.donut .val{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;letter-spacing:-.02em}

label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--rule2);border-radius:10px;background:color-mix(in srgb,var(--panel) 92%,var(--sunk));color:var(--ink);font:inherit;font-size:13.5px;box-shadow:inset 0 1px 2px rgba(24,57,59,.04)}
input:focus,select:focus{border-color:var(--nd);outline:3px solid var(--nd-soft);outline-offset:0}
input.mono,select.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.field{margin-bottom:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.f2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule2);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--ink2);background:var(--panel)}
.chip:hover{border-color:var(--nd2);color:var(--nd);background:var(--tint)}
.chip[aria-pressed="true"]{border-color:var(--nd);background:var(--nd-soft);color:var(--nd);font-weight:500}
.btn{background:linear-gradient(135deg,#173B43,#0B6F76);color:#fff;padding:10px 16px;border-radius:11px;font-size:13px;font-weight:700;box-shadow:0 7px 16px rgba(11,111,118,.18)}
.btn:hover{opacity:1;transform:translateY(-1px);box-shadow:0 10px 20px rgba(11,111,118,.27)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--rule2);box-shadow:0 4px 12px rgba(21,68,71,.045);font-weight:400}
.btn.ghost:hover{background:var(--tint);border-color:var(--nd2);color:var(--nd)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.drop{border:1px dashed var(--nd2);border-radius:14px;padding:32px 18px;text-align:center;background:linear-gradient(145deg,var(--tint),var(--sunk));color:var(--mute)}
.drop b{display:block;color:var(--ink);font-weight:500;margin-bottom:3px}
.filerow{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border:1px solid var(--rule);border-radius:11px;background:var(--sunk)}
.filerow .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.kv{display:grid;grid-template-columns:minmax(125px,auto) 1fr;gap:7px 16px;font-size:13px;margin:0}
.kv dt{color:var(--mute);font-size:12px}
.kv dd{margin:0}

.docview{background:var(--sunk);border:1px solid var(--rule);border-radius:16px;padding:22px;background:linear-gradient(145deg,var(--sunk),var(--tint))}
.sheet{background:#fff;color:#15181B;border:1px solid #E2E2DD;border-radius:10px;padding:22px 24px;font-size:12.5px;line-height:1.55;max-width:440px;margin:0 auto;box-shadow:0 14px 30px rgba(21,42,44,.10)}
.sheet h4{margin:0 0 2px;font-size:12.5px;color:#5D4B8C;font-weight:600}
.sheet h5{margin:8px 0 10px;font-size:15px;font-weight:600}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:12px}
.sheet dt{color:#767E85}
.sheet dd{margin:0}
.sheet .ft{margin-top:14px;padding-top:10px;border-top:1px solid #E2E2DD;font-size:11px;color:#767E85}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:60;box-shadow:0 10px 28px rgba(9,50,55,.25)}

.hash-proof{background:linear-gradient(135deg,var(--panel),var(--tint));position:relative}
.hash-proof:after{content:"";position:absolute;right:-32px;bottom:-42px;width:105px;height:105px;border:1px solid rgba(8,126,131,.10);border-radius:50%;box-shadow:0 0 0 14px rgba(8,126,131,.025)}
.hash-proof-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;position:relative;z-index:1}
.hash-proof-head span{display:block;margin-bottom:4px;color:var(--nd);font-size:9px;font-weight:700;letter-spacing:.11em}.hash-proof-head h3{margin:0}
.hash-proof-head>b{padding:5px 8px;border:1px solid rgba(8,126,131,.16);border-radius:8px;background:var(--nd-soft);color:var(--nd);font-size:9px}
.hash-proof .hash{position:relative;z-index:1;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:color-mix(in srgb,var(--panel) 78%,transparent);font-size:10.8px}

/* Product dashboard */
.lot-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.8fr);gap:18px;margin-bottom:16px}
.lot-main{position:relative;padding:30px 32px;background:linear-gradient(135deg,var(--panel) 0%,var(--tint) 100%);isolation:isolate}

.custody,.evidence-card,.balance-card{padding:24px 26px}

.chart-grid{align-items:stretch}

@media(max-width:700px){
  .metric-grid{grid-template-columns:1fr}

}

@media (prefers-reduced-motion:no-preference){
  @keyframes ec-fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes ec-soft-in{from{opacity:0}to{opacity:1}}
  @keyframes ec-breathe{0%,100%{box-shadow:0 5px 14px rgba(8,126,131,.10)}50%{box-shadow:0 8px 20px rgba(8,126,131,.19)}}
  @keyframes ec-progress{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
  @keyframes ec-route{to{stroke-dashoffset:-22}}
  #view> *{animation:ec-fade-up .42s cubic-bezier(.22,.7,.25,1) both}
  #view> .lot-hero{animation-delay:.03s}
  #view> .metric-grid{animation-delay:.08s}
  #view> .correlation-layout{animation-delay:.13s}
  #view> .product-grid{animation-delay:.13s}
  #view> .balance-card,#view> .product-details{animation-delay:.18s}
  .brand-mark{animation:ec-breathe 4.8s ease-in-out infinite}
  .brand:hover .brand-mark{animation:none;transform:rotate(-4deg) scale(1.05)}
  .panel{transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease}
  .panel:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(21,68,71,.085),0 3px 8px rgba(21,68,71,.04)}
  .lot-main:hover,.verdict-card:hover{transform:translateY(-3px)}
  .metric-grid .metric:nth-child(1){animation:ec-fade-up .45s .10s both}
  .metric-grid .metric:nth-child(2){animation:ec-fade-up .45s .15s both}
  .metric-grid .metric:nth-child(3){animation:ec-fade-up .45s .20s both}
  .metric-grid .metric:nth-child(4){animation:ec-fade-up .45s .25s both}
  .custody-step .dot{transition:transform .22s ease,box-shadow .22s ease}
  .custody-step:hover .dot{transform:translateY(-3px) scale(1.08);box-shadow:0 6px 14px rgba(8,126,131,.22)}
  .progress span{transform-origin:left;animation:ec-progress .9s .28s cubic-bezier(.22,.7,.25,1) both}
  .tag{transition:transform .18s ease,box-shadow .18s ease}
  .tag:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(8,126,131,.12)}
  tbody tr{transition:background .16s ease,transform .16s ease}
  tbody tr:hover{transform:translateX(2px)}
  .product-details[open] .details-body{animation:ec-soft-in .25s ease both}
  .graph-lines .candidate{animation:ec-route 2.8s linear infinite}
  .cg-node{transition:transform .2s ease,box-shadow .2s ease}.cg-node:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(8,126,131,.16)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ===================================================================
   EXPLORECHEM — PREMIUM DARK TEAL VISUAL SYSTEM
   Visual redesign only. Application logic remains unchanged.
   =================================================================== */
:root{
  color-scheme:dark;
  --ink:#F0F8F6;
  --ink2:#A9BFBC;
  --mute:#6F918D;
  --paper:#041A19;
  --panel:#092826;
  --sunk:#071F1E;
  --tint:#0B3532;
  --rule:#174A46;
  --rule2:#286660;
  --nd:#38D7CA;
  --nd2:#2ACABD;
  --nd-soft:#0A3A36;
  --copper:#E5A06D;
  --copper-soft:#3A271E;
  --ok:#62D8AE;
  --ok-soft:#0B352B;
  --div:#F09584;
  --div-soft:#3B211E;
  --att:#E0BB68;
  --att-soft:#352D17;
  --pend:#9CB4B0;
  --pend-soft:#18312F;
}

html{background:#031615}
body{
  min-height:100vh;
  color:var(--ink);
  background:
    radial-gradient(circle at 78% 8%,rgba(37,190,177,.18),transparent 29rem),
    radial-gradient(circle at 94% 48%,rgba(19,105,99,.22),transparent 31rem),
    radial-gradient(circle at 6% 95%,rgba(15,93,87,.16),transparent 30rem),
    linear-gradient(135deg,#031514 0%,#062421 48%,#041A19 100%);
}
body:before{
  z-index:-2;
  background:
    linear-gradient(90deg,rgba(56,215,202,.028) 1px,transparent 1px),
    linear-gradient(rgba(56,215,202,.022) 1px,transparent 1px);
  background-size:54px 54px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.4),transparent 82%);
}
body:after{
  content:"";
  position:fixed;
  width:560px;height:560px;
  right:-220px;top:-235px;
  border:1px solid rgba(56,215,202,.10);
  border-radius:50%;
  box-shadow:0 0 0 74px rgba(56,215,202,.018),0 0 0 148px rgba(56,215,202,.012);
  pointer-events:none;
  z-index:-1;
}

.top{
  min-height:82px;
  border-bottom:1px solid rgba(83,188,179,.16);
  background:rgba(3,24,23,.82);
  backdrop-filter:blur(22px) saturate(135%);
  box-shadow:0 12px 38px rgba(0,0,0,.16);
}
.brand{
  border:1px solid transparent;
}

function bytes32(value,label){
  const text=String(value||"");

  throw new Error((label||"Identificador")+" precisa ter 32 bytes em hexadecimal.");

function novoBytes32(){
  if(window.crypto&&typeof window.crypto.getRandomValues==="function"){
    const bytes=new Uint8Array(32); window.crypto.getRandomValues(bytes);
    return "0x"+Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  if(window.ethers&&typeof ethers.randomBytes==="function") return ethers.hexlify(ethers.randomBytes(32));
  throw new Error("O navegador não conseguiu gerar um evidenceId seguro.");

async function sha256Arquivo(file){
  const buffer=await file.arrayBuffer();
  if(window.crypto&&window.crypto.subtle){
    const digest=await window.crypto.subtle.digest("SHA-256",buffer);
    return "0x"+Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  if(window.ethers&&typeof ethers.sha256==="function") return ethers.sha256(new Uint8Array(buffer));
  throw new Error("Este navegador não disponibilizou SHA-256 para o arquivo.");
}

function isoToDatetimeLocal(value){

  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return String(value).slice(0,16);
  const pad=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());

async function garantirSessaoSupabaseDemo(){
  const atual=await supabaseClient.auth.getSession();
  let user=atual?.data?.session?.user||null;
  if(!user){
    const signed=await supabaseClient.auth.signInAnonymously();
    if(signed.error) throw new Error("Supabase não criou a sessão demo: "+signed.error.message);
    user=signed.data?.user||null;
  }
  if(!user?.id) throw new Error("Supabase não retornou um usuário autenticado.");
  const claim=await supabaseClient.rpc("explorerchem_demo_claim_actors");
  if(claim.error) throw new Error("Não foi possível preparar as permissões demo: "+claim.error.message);
  return user.id;
}

async function urlAssinada(bucket,path){
  if(!bucket||!path) throw new Error("O documento ainda não possui um caminho de armazenamento.");

  // O bucket de evidências é privado. Antes de solicitar a signed URL,
  // garante a sessão Supabase da demonstração e aplica o claim de atores.
  // Isso afeta somente o acesso ao arquivo original já armazenado;
  // não depende de novo broadcast nem altera a evidência on-chain.
  await garantirSessaoSupabaseDemo();

  const {data,error}=await supabaseClient.storage.from(bucket).createSignedUrl(path,3600);
  if(error) throw new Error("Não foi possível preparar o download: "+error.message);
  if(!data?.signedUrl) throw new Error("O armazenamento não retornou uma URL de download.");
  return data.signedUrl;
}

  "function EVIDENCE_TTL() view returns (uint64)",
  "event EvidenceSubmitted(bytes32 indexed evidenceId, bytes32 indexed actorId, address indexed submittedBy, bytes32 evidenceHash, uint64 createdAt)",
  "event EvidenceMatched(bytes32 indexed evidenceId, bytes32 indexed actorId, bytes32 workflowId, uint64 matchedAt)"
];
let _providerLeituraSepolia=null;
async function providerLeituraSepolia(){
  if(_providerLeituraSepolia) return _providerLeituraSepolia;
  if(!window.ethers) throw new Error("Biblioteca ethers não carregou.");
  try{
    const p=new ethers.JsonRpcProvider(SEPOLIA_PUBLIC_RPC,SEPOLIA_CHAIN_ID_DECIMAL,{staticNetwork:true});
    await p.getBlockNumber();
    _providerLeituraSepolia=p;
    return p;
  }catch(publicError){
    const injected=getWalletProvider();
    if(injected){
      const p=new ethers.BrowserProvider(injected);
      const network=await p.getNetwork();
      if(Number(network.chainId)===SEPOLIA_CHAIN_ID_DECIMAL){
        _providerLeituraSepolia=p;
        return p;
      }
    }
    throw new Error("Não foi possível consultar a Sepolia pelo RPC público nem pela carteira: "+(publicError?.message||publicError));
  }
}
async function hashBufferPorAlgoritmo(buffer,algorithm){
  const alg=String(algorithm||"SHA-256").toUpperCase();
  if(alg.includes("KECCAK")) return ethers.keccak256(new Uint8Array(buffer));
  if(window.crypto&&window.crypto.subtle){
    const digest=await window.crypto.subtle.digest("SHA-256",buffer);
    return "0x"+Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  return ethers.sha256(new Uint8Array(buffer));
}
async function recalcularHashOriginal(e){
  if(!e.storagePath) return {hash:null,error:"storage_path ausente"};
  try{
    const url=await urlAssinada(e.storageBucket||EVIDENCE_BUCKET,e.storagePath);
    const response=await fetch(url,{cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    const buffer=await response.arrayBuffer();
    return {hash:await hashBufferPorAlgoritmo(buffer,e.hashAlgorithm),sizeBytes:buffer.byteLength,error:null};
  }catch(error){
    return {hash:null,sizeBytes:null,error:error?.message||String(error)};
  }
}
async function localizarEventoMaisRecente(contract,filter,fromBlock,toBlock){
  let end=Number(toBlock);
  const floor=Math.max(0,Number(fromBlock)||0);
  let chunk=10000;
  while(end>=floor){
    const start=Math.max(floor,end-chunk+1);
    try{
      const logs=await contract.queryFilter(filter,start,end);
      if(logs.length) return logs[logs.length-1];
      end=start-1;
    }catch(error){
      if(chunk>1000){chunk=Math.floor(chunk/2);continue;}
      throw error;
    }
  }
  return null;
}
function parseEventFromReceipt(iface,receipt,eventName,evidenceId){
  if(!receipt) return null;
  for(const log of receipt.logs||[]){
    try{
      const parsed=iface.parseLog(log);
      if(parsed?.name===eventName && igualHex(parsed.args?.evidenceId,evidenceId)) return {parsed,log};
    }catch(_){ }
  }
  return null;
}
async function auditarEvidenciaHibrida(e,ctx){
  const result={source:e,errors:[]};
  try{
    const chainEvidence=await ctx.contract.getEvidence(e.evidenceId);
    result.chainEvidence=chainEvidence;
    result.chainState=statusEvidenceOnchain(chainEvidence.status);
    result.actorIdChain=chainEvidence.actorId;
    result.submittedBy=chainEvidence.submittedBy;
    result.evidenceHashChain=chainEvidence.evidenceHash;
    result.createdAtChain=chainEvidence.createdAt;
    result.matchedAtChain=chainEvidence.matchedAt;
    result.actorIdMatches=!!e.actorId&&igualHex(e.actorId,chainEvidence.actorId);
    result.dbHashMatchesChain=!!e.evidenceHash&&igualHex(e.evidenceHash,chainEvidence.evidenceHash);
    try{result.dbHashVerifiedByContract=await ctx.contract.verifyEvidenceHash(e.evidenceId,e.evidenceHash);}catch(_){result.dbHashVerifiedByContract=result.dbHashMatchesChain;}

    const actorKey=String(chainEvidence.actorId).toLowerCase();
    let actor=ctx.actorCache.get(actorKey);
    if(!actor){actor=await ctx.contract.getActor(chainEvidence.actorId);ctx.actorCache.set(actorKey,actor);}
    result.actor=actor;
    try{result.submittedWalletCurrentlyAuthorized=await ctx.contract.isWalletAuthorized(chainEvidence.actorId,chainEvidence.submittedBy);}catch(_){result.submittedWalletCurrentlyAuthorized=null;}

    if(txHashReal(e.submissionTxHash)){
      try{
        result.submissionReceipt=await ctx.provider.getTransactionReceipt(e.submissionTxHash);
        const parsed=parseEventFromReceipt(ctx.iface,result.submissionReceipt,"EvidenceSubmitted",e.evidenceId);
        if(parsed){
          result.submissionEvent=parsed.parsed;
          result.submissionTxHashChain=result.submissionReceipt.hash||e.submissionTxHash;
          result.submissionBlock=result.submissionReceipt.blockNumber;
          result.submissionEventMatchesActor=igualHex(parsed.parsed.args.actorId,chainEvidence.actorId);
          result.submissionEventMatchesHash=igualHex(parsed.parsed.args.evidenceHash,chainEvidence.evidenceHash);
        }
      }catch(error){result.errors.push("Tx de submissão: "+(error?.message||error));}
    }

    let fromBlock=result.submissionBlock;
    if(fromBlock===undefined||fromBlock===null) fromBlock=Math.max(0,ctx.latestBlock-250000);
    if(result.chainState==="MATCHED"){
      try{
        const matchLog=await localizarEventoMaisRecente(
          ctx.contract,
          ctx.contract.filters.EvidenceMatched(e.evidenceId),
          fromBlock,
          ctx.latestBlock
        );
        if(matchLog){
          result.matchEvent=matchLog;
          result.matchTxHash=matchLog.transactionHash;
          result.matchBlock=matchLog.blockNumber;
          result.matchWorkflowId=matchLog.args?.workflowId;
          result.matchEventActorId=matchLog.args?.actorId;
          result.matchEventMatchedAt=matchLog.args?.matchedAt;
          result.matchEventMatchesActor=igualHex(result.matchEventActorId,chainEvidence.actorId);
          result.workflowMatchesCurrentExpected=ctx.expectedWorkflowId?igualHex(result.matchWorkflowId,ctx.expectedWorkflowId):null;
        }
      }catch(error){result.errors.push("Evento EvidenceMatched: "+(error?.message||error));}
    }

    const original=await recalcularHashOriginal(e);
    result.fileHash=original.hash;
    result.fileBytes=original.sizeBytes;
    result.fileHashError=original.error;
    result.fileHashMatchesChain=!!original.hash&&igualHex(original.hash,chainEvidence.evidenceHash);
    result.integrity=original.hash?(result.fileHashMatchesChain?"ÍNTEGRO":"FALHA DE INTEGRIDADE"):"NÃO VERIFICADO";
    result.stateMatchesDb=String(e.state||"").toUpperCase()===result.chainState;
    result.supabaseMatchTxIsStaleZero=!txHashReal(e.matchTxHash)&&String(e.state||"").toUpperCase()==="MATCHED";
  }catch(error){
    result.errors.push(error?.message||String(error));
  }
  return result;
}
function linkTx(tx){
  if(!txHashReal(tx)) return "—";
  const safe=escaparHtml(tx);
  return '<a href="https://sepolia.etherscan.io/tx/'+safe+'" target="_blank" rel="noopener">'+safe+'</a>';
}
function linkBlock(block){
  if(block===undefined||block===null) return "—";
  return '<a href="https://sepolia.etherscan.io/block/'+Number(block)+'" target="_blank" rel="noopener">'+Number(block).toLocaleString("en-US")+'</a>';
}
function fmtBytes(value){
  const n=Number(value||0); if(!Number.isFinite(n)||n<=0)return "—";
  if(n<1024)return n+" B"; if(n<1024*1024)return (n/1024).toFixed(1)+" KB"; return (n/1024/1024).toFixed(2)+" MB";
}
function auditOk(v){return v===true?badgeAudit("OK","ok"):v===false?badgeAudit("DIVERGENTE","bad"):badgeAudit("—","muted");}

    const {data,error}=await supabaseClient.from("explorerchem_evidences")
      .select("id,evidence_id,display_code,actor_db_id,document_type,calculation_role,state,evidence_hash,hash_algorithm,storage_bucket,storage_path,original_filename,mime_type,size_bytes,submission_tx_hash,match_tx_hash,matched_at,created_at")
      .order("created_at",{ascending:false}).limit(100);
    if(!error&&Array.isArray(data)){
      EVIDENCIAS_REMOTAS=data.map(e=>({
        dbId:e.id,evidenceId:e.evidence_id,displayCode:e.display_code,actorDbId:e.actor_db_id,
        actorId:ATORES.find(a=>a.dbId===e.actor_db_id)?.id,actorName:ATORES.find(a=>a.dbId===e.actor_db_id)?.nome,
        actorType:ATORES.find(a=>a.dbId===e.actor_db_id)?.papel,
        documentType:e.document_type,calculationRole:e.calculation_role,state:e.state,evidenceHash:e.evidence_hash,hashAlgorithm:e.hash_algorithm,
        storageBucket:e.storage_bucket,storagePath:e.storage_path,originalFilename:e.original_filename,mimeType:e.mime_type,sizeBytes:e.size_bytes,
        submissionTxHash:e.submission_tx_hash,matchTxHash:e.match_tx_hash,matchedAt:e.matched_at,submittedAt:e.created_at
      }));
    } else if(error) console.warn("Não foi possível carregar evidências do Supabase:",error.message);
  }catch(error){console.warn("Falha ao carregar evidências:",error.message);}
  try{
    const {data,error}=await supabaseClient.from("explorerchem_report_files")
      .select("id,result_db_id,storage_bucket,storage_path,filename,mime_type,file_hash,size_bytes,created_at")
      .order("created_at",{ascending:false}).limit(20);
    if(!error&&Array.isArray(data)) RELATORIOS_REMOTOS=data;
    else if(error) console.warn("Não foi possível carregar relatórios:",error.message);
  }catch(error){console.warn("Falha ao carregar relatórios:",error.message);}
  if(document.readyState!=="loading") render();
}

const actorTypeLabel={MINER:"Minerador",CARRIER:"Transportadora",LABORATORY:"Laboratório",PROCESSOR:"Processador",REFINER:"Purificador",RECYCLER:"Reciclador",MANUFACTURER:"Fabricante",OTHER:"Outro"};

/* Mapa papel → visão e persistência do ator ativo */
const PAPEL_ROLE={
  "Minerador":"forn","Laboratório":"lab","Laboratorio":"lab","Purificador":"forn",
  "Reciclador":"forn","Fabricante":"forn","Processador":"forn","Outro":"forn",
  "Transportadora":"transp"
};
function persistirAtorAtivo(){try{ATOR_ATIVO?localStorage.setItem("explorechem_ator_ativo",ATOR_ATIVO):localStorage.removeItem("explorechem_ator_ativo");}catch(e){}}
function carregarAtorAtivo(){try{ATOR_ATIVO=localStorage.getItem("explorechem_ator_ativo")||null;}catch(e){}}
function atorAtivo(){return ATORES.find(a=>a.id===ATOR_ATIVO)||null;}
function escopoAtor(){
  const ator=atorAtivo();
  const roleDoAtor=ator?(PAPEL_ROLE[ator.papel]||"forn"):null;
  const telaDeAtor=(role==="forn"||role==="transp"||role==="lab");
  return {ator,roleDoAtor,somenteLeitura:!!(telaDeAtor&&(!ator||roleDoAtor!==role))};
}

/* Função que aplica o bloqueio */
function aplicarSomenteLeitura(){
  const view=$("#view"), esc=escopoAtor();
  view.classList.toggle("readonly",esc.somenteLeitura);
  if(!esc.somenteLeitura) return;
  const nomeRole={forn:"Fornecedor",transp:"Transportadora",lab:"Laboratório",op:"Operador",cli:"Cliente"};
  const aviso=document.createElement("div");
  aviso.className="quiet-warning";
  aviso.innerHTML=esc.ator
    ? '<span aria-hidden="true">🔒</span><div><b>Somente leitura · '+esc.ator.nome+' ('+esc.ator.papel+')</b>'+
      '<p>Este perfil escreve apenas na visão '+nomeRole[esc.roleDoAtor]+'. Na visão '+nomeRole[role]+
      ' a tela fica disponível para acompanhamento: nenhum campo é editável e nenhum upload é autorizado.</p></div>'
    : '<span aria-hidden="true">🔒</span><div><b>Somente leitura · Operador</b>'+ 
      '<p>O Operador cadastra atores e acompanha o processamento, mas não edita campos nem envia arquivos na visão '+nomeRole[role]+'.</p></div>';
  const ancora=view.querySelector(".split,.stats,.panel,.chain");
  ancora?view.insertBefore(aviso,ancora):view.prepend(aviso);

  view.querySelectorAll("input,select,textarea").forEach(el=>{el.disabled=true;el.setAttribute("aria-disabled","true");});
  view.querySelectorAll(".drop").forEach(el=>{el.removeAttribute("for");el.setAttribute("aria-disabled","true");});
  view.querySelectorAll("button").forEach(b=>{
    if(b.classList.contains("dl")) return; // downloads liberados
    b.disabled=true; b.setAttribute("aria-disabled","true"); b.title="Ação indisponível para este perfil";
  });
}

async function carregarAtores(){
  try{
    const {data,error}=await supabaseClient.from("explorerchem_actors")
      .select("id,actor_id,display_name,actor_type,country_code,created_at")
      .eq("active",true)
      .order("created_at",{ascending:false});
    if(!error&&Array.isArray(data)){
      ATORES=data.map(a=>({dbId:a.id,id:a.actor_id,nome:a.display_name,papel:actorTypeLabel[a.actor_type]||a.actor_type,praca:a.country_code||"—",carteiras:1,evid:0,desde:a.created_at?new Date(a.created_at).toLocaleDateString("en-US"):"—"}));
      if(ATOR_ATIVO&&!ATORES.some(a=>a.id===ATOR_ATIVO)){
        ATOR_ATIVO=null;
        persistirAtorAtivo();
      }
    } else if(error) console.warn("Não foi possível carregar atores do Supabase:",error.message);
  }catch(error){console.warn("Falha ao carregar atores:",error.message);}
  if(document.readyState!=="loading") render();
}
function novoActorId(){
  if(window.crypto&&typeof window.crypto.getRandomValues==='function'){
    const bytes=new Uint8Array(32); window.crypto.getRandomValues(bytes);
    return '0x'+Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  return '0x'+Array.from({length:32},()=>Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join('');
}

let conformes=0, divergentes=[], VEREDITO="NAO_ATESTADO";
const CATALOGO_REGRAS=[
  "Base da massa e base do teor coincidem",
  "Temperatura de secagem entre 100 e 110 °C",
  "Fórmula do óxido admitida para o elemento",
  "Mesma versão da tabela de fatores em todas as correntes",
  "Denominador de pureza igual a massa seca",
  "Pesagem e amostragem de umidade no mesmo evento"
];

function recalcular(){
  ELEMENTOS.forEach(x=>{
    x.muf=(x.entrada+x.i0)-(x.saida+x.i1);
    x.banda=x.k*x.sigma;
    x.veredito=Math.abs(x.muf)<=x.banda?"CONFORME":"DIVERGENTE";
    x.rel=x.entrada?x.muf/x.entrada*100:0;
  });
  conformes=ELEMENTOS.filter(x=>x.veredito==="CONFORME").length;
  divergentes=ELEMENTOS.filter(x=>x.veredito==="DIVERGENTE");
  VEREDITO=!ELEMENTOS.length?"NAO_ATESTADO":(divergentes.length?"DIVERGENTE":"CONFORME");
}
recalcular();

function carregar(d){
  d=d||{};
  if(d.role!==role) throw new Error("Escopo de dados incompatível com o perfil autenticado.");
  if("lote" in d) LOTE=d.lote;
  if("periodo" in d){
    PERIODO=d.periodo;
    if(!("lote" in d)) LOTE=d.periodo;
  }
  if("elementos" in d) ELEMENTOS=d.elementos||[];
  if("serie" in d) SERIE=d.serie||[];
  if(role==="op"){
    if("atores" in d) ATORES=d.atores||[];
    if("evidencias" in d) EVIDENCIAS=d.evidencias||[];
    if("documento" in d) DOCUMENTO=d.documento;
  }
  if(role==="forn"||role==="transp"||role==="lab"){
    if("minhas" in d) MINHAS=d.minhas||[];
    if("cadeia" in d) CADEIA=d.cadeia||[];
    if("cadeiaEvidencias" in d) CADEIA_EVIDENCIAS=d.cadeiaEvidencias||[];
  }
  recalcular();
  render();
}

async function connectWallet(){
  const provider=getWalletProvider();
  if(!provider){toast("Nenhuma carteira Web3 foi detectada neste navegador.");return;}
  try{
    const contas=await provider.request({method:"eth_requestAccounts"});
    walletAddress=contas[0]||"";
    walletChainId=await provider.request({method:"eth_chainId"});
    renderWallet();
    toast(walletChainId==="0xaa36a7"?"Carteira conectada à Sepolia.":"Carteira conectada. Troque a rede para Sepolia antes de assinar.");
  }catch(error){
    toast("A conexão com a carteira não foi autorizada.");
  }
}

async function restoreWallet(){
  const provider=getWalletProvider();
  if(!provider||role==="cli") return;
  try{
    const contas=await provider.request({method:"eth_accounts"});
    walletAddress=contas[0]||"";
    walletChainId=walletAddress?await provider.request({method:"eth_chainId"}):"";
    renderWallet();
  }catch(error){renderWallet();}
}

function disconnectWallet(){
  walletAddress="";
  walletChainId="";
  renderWallet();
  toast("Carteira desconectada desta sessão.");
}

async function refreshWalletChain(){
  const provider=getWalletProvider();
  if(!provider) return "";
  walletChainId=await provider.request({method:"eth_chainId"});
  renderWallet();
  return walletChainId;
}

async function enviarEvidenciaReal(button){
  const esc=escopoAtor();
  if(esc.somenteLeitura){toast("Perfil somente leitura nesta visão.");return;}
  if(!esc.ator){toast("Selecione um ator antes de enviar a evidência.");return;}
  if(!esc.ator.dbId){toast("Este ator ainda não tem registro do Supabase. Recarregue a página e selecione o ator salvo.");return;}
  if(!walletAddress){toast("Conecte a carteira autorizada deste ator antes de continuar.");return;}
  const chainAtual=await refreshWalletChain();
  if(chainAtual!=="0xaa36a7"){toast("Troque a carteira para a rede Sepolia antes de assinar.");return;}
  const file=arquivoDaTela();
  if(!file){toast("Selecione o arquivo JSON ou PDF original antes de enviar.");return;}
  if(file.size>MAX_EVIDENCE_BYTES){toast("O arquivo ultrapassa o limite de 20 MB.");return;}
  const json=isJsonFile(file), pdf=isPdfFile(file);
  if(!json&&!pdf){toast("Envie um arquivo JSON ou PDF.");return;}

  let jsonData=null;
  let originActorDbId=null;
  let destinationActorDbId=null;

  if(json){
    try{
      jsonData=await lerJsonDoArquivo(file);

      const normalizeActorName=value=>String(value||"")
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g,"")
        .replace(/\s+/g," ");

      const originName=String(jsonData?.originActor||"").trim();
      const destinationName=String(jsonData?.destinationActor||"").trim();

      if(!originName) throw new Error("O JSON não contém originActor.");
      if(!destinationName) throw new Error("O JSON não contém destinationActor.");

      const originActor=ATORES.find(a=>normalizeActorName(a.nome)===normalizeActorName(originName));
      const destinationActor=ATORES.find(a=>normalizeActorName(a.nome)===normalizeActorName(destinationName));

      if(!originActor?.dbId) throw new Error('Origem não cadastrada em explorerchem_actors: '+originName);
      if(!destinationActor?.dbId) throw new Error('Destino não cadastrado em explorerchem_actors: '+destinationName);

      originActorDbId=originActor.dbId;
      destinationActorDbId=destinationActor.dbId;
    }catch(error){
      toast(error.message||"Não foi possível extrair origem e destino do JSON.");
      return;
    }
  }

  let userId;
  try{userId=await usuarioSupabaseAtual();}
  catch(error){
    console.error(error);
    toast(error.message||"Não foi possível criar a sessão demo do Supabase.");
    return;
  }
  if(!userId){
    toast("O banco exige uma sessão autenticada do Supabase para registrar a evidência. A carteira sozinha não substitui esse usuário.");
    return;
  }
  if(!button)return;
  const originalText=button.textContent;
  const config=configDaEvidencia();
  const evidenceId=novoBytes32();
  const actorId=bytes32(esc.ator.id,"actorId");
  const mimeType=json?"application/json":"application/pdf";
  const extension=json?"json":"pdf";
  const storagePath=esc.ator.id+"/"+evidenceId.slice(2)+"."+extension;
  button.disabled=true; button.textContent="Calculating hash…";
  try{
    const evidenceHash=await sha256Arquivo(file);
    button.textContent="Uploading file…";
    const upload=await supabaseClient.storage.from(EVIDENCE_BUCKET).upload(storagePath,file,{
      cacheControl:"3600",contentType:mimeType,upsert:false
    });
    if(upload.error) throw new Error("Storage recusou o arquivo: "+upload.error.message);

    button.textContent="Signing on-chain…";
    const provider=new ethers.BrowserProvider(getWalletProvider());
    const signer=await provider.getSigner();
    const contract=new ethers.Contract(EXPLORERCHEM_CONTRACT_ADDRESS,[
      "function submitEvidence(bytes32 evidenceId, bytes32 actorId, bytes32 evidenceHash) external"
    ],signer);
    const tx=await contract.submitEvidence(evidenceId,actorId,evidenceHash);
    const receipt=await tx.wait();
    const txHash=tx.hash||receipt?.hash||"";

    button.textContent="Registering metadata…";
    const payload={
      evidence_id:evidenceId,display_code:"EV-"+Date.now()+"-"+evidenceId.slice(2,10).toUpperCase(),
      actor_db_id:esc.ator.dbId,
      origin_actor_db_id:originActorDbId,
      destination_actor_db_id:destinationActorDbId,
      lot_reference:String(jsonData?.lotId||"").trim()||null,
      submitted_by_user_id:userId,submitted_wallet:walletAddress,
      document_type:config.documentType,calculation_role:config.calculationRole,state:"PENDING",
      evidence_hash:evidenceHash,hash_algorithm:"SHA-256",storage_bucket:EVIDENCE_BUCKET,
      storage_path:storagePath,original_filename:file.name,mime_type:mimeType,size_bytes:file.size,
      extractor_version:"frontend-raw-file-v1",chain_id:SEPOLIA_CHAIN_ID_DECIMAL,
      submission_tx_hash:txHash,chain_created_at:new Date().toISOString()
    };
    const {error:metadataError}=await supabaseClient.from("explorerchem_evidences").insert(payload);
    if(metadataError){
      console.error("Blockchain/Storage concluídos, mas os metadados falharam:",metadataError);
      throw new Error("PDF e blockchain concluídos, mas o Supabase recusou os metadados: "+metadataError.message);
    }
    await carregarDocumentosRemotos();
    toast("Evidência enviada como PENDING. Hash e transação registrados.");
  }catch(error){
    console.error(error);
    toast(error.message||"Não foi possível enviar a evidência.");
  }finally{
    button.disabled=false; button.textContent=originalText;
  }
}

function sparkline(){
  const max=Math.max.apply(null,SERIE)*1.3;
  const pts=SERIE.map((v,i)=>[i/(SERIE.length-1)*100,100-(v/max)*100]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" ");
  const last=pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none" role="img" '+
    'aria-label="Não contabilizado nas versões do período">'+
    '<path d="'+path+' L100 100 L0 100 Z" fill="var(--nd-soft)"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--nd)" stroke-width="1.6" '+
    'vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="var(--nd)" vector-effect="non-scaling-stroke"/></svg>';
}
function donut(p){
  const r=42,c=2*Math.PI*r;
  return '<div class="donut"><svg width="104" height="104" viewBox="0 0 108 108" role="img" aria-label="'+pct(p)+' contabilizado">'+
    '<circle cx="54" cy="54" r="'+r+'" fill="none" stroke="var(--rule)" stroke-width="9"/>'+
    '<circle cx="54" cy="54" r="'+r+'" fill="none" stroke="var(--nd)" stroke-width="9" stroke-linecap="round" '+
    'stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p/100))+'" transform="rotate(-90 54 54)"/></svg>'+
    '<div><div class="val">'+pct(p)+'</div><div class="sm">da massa de entrada contabilizada nas saídas e no inventário</div></div></div>';
}

function heroIdentidade(){
  const nd=ELEMENTOS[0];
  return '<div class="identity"><div class="eqwrap"><div class="eq">'+
    '<div class="t"><i>'+fmt(nd.entrada)+'</i><span>entradas</span></div><div class="op">+</div>'+
    '<div class="t"><i>'+fmt(nd.i0)+'</i><span>inventário inicial</span></div><div class="op">−</div>'+
    '<div class="t"><i>'+fmt(nd.saida)+'</i><span>saídas</span></div><div class="op">−</div>'+
    '<div class="t"><i>'+fmt(nd.i1)+'</i><span>inventário final</span></div><div class="op">=</div>'+
    '<div class="t res"><i>'+fmt(nd.muf)+'</i><span>não contabilizado</span></div>'+
    '</div></div><div class="heroline">'+
    '<span class="big">'+fmt(nd.muf)+'<span style="font-size:18px;font-weight:400"> mg</span></span>'+
    '<span class="cap">de neodímio sem destino declarado, '+pct(Math.abs(nd.rel))+' da entrada</span>'+
    vtag(nd.veredito)+'</div>'+
    '<p class="note">Tudo em miligramas de elemento, base seca a 105 °C. Óxido é apresentação: '+
    'nenhuma massa de óxido entra na identidade de conservação.</p></div>';
}
function avisoArbitrado(){
  return '<div class="quiet-warning"><span aria-hidden="true">ⓘ</span><div><b><span class="source-mark arbit">ARBITRADO</span> Parâmetros de demonstração</b>'+
    '<p>Esta simulação utiliza k = 3 e σ definido por elemento. Como o veredito depende desses valores, ele herda a marca arbitrada até que a política de tolerância seja aprovada, medida e versionada.</p></div></div>';
}
function avisoDivergente(){
  if(!divergentes.length) return "";
  const d=divergentes[0];
  return '<div class="arb bad"><b>'+divergentes.map(x=>x.e).join(", ")+' fora da banda</b>'+
    '<p>'+d.nome+' está em '+fmt(d.muf)+' mg contra uma banda de ± '+fmt(d.banda)+' mg. Somado à '+
    'massa total do lote, esse excesso desapareceria na folga do neodímio. O lote abre '+
    'janela de contestação.</p></div>';
}
function tabelaElementos(){
  return '<div class="panel scrollx"><table><thead><tr><th>Elemento</th>'+
    '<th class="num">Entradas + I₀</th><th class="num">Saídas + I₁</th>'+
    '<th class="num">Não contabilizado</th><th class="num">Banda k·σ</th><th>Veredito</th></tr></thead><tbody>'+
    ELEMENTOS.map(x=>'<tr><td><b>'+x.e+'</b> <span class="sm">'+x.nome+'</span></td>'+
      '<td class="num">'+fmt(x.entrada+x.i0)+'</td><td class="num">'+fmt(x.saida+x.i1)+'</td>'+
      '<td class="num">'+sgn(x.muf)+'</td><td class="num">± '+fmt(x.banda)+'</td>'+
      '<td>'+vtag(x.veredito)+'</td></tr>').join("")+'</tbody></table></div>';
}

const T={};

function vazio(titulo,texto){
  return '<div class="panel pad" style="text-align:center;padding:48px 24px">'+
    '<b style="display:block;font-size:15px;margin-bottom:6px">'+titulo+'</b>'+
    '<p style="margin:0;color:var(--ink2);max-width:52ch;margin-inline:auto">'+texto+'</p></div>';
}
function semPeriodo(){
  return vazio("Nenhum período processado",
    "Quando o CRE/TEE concluir um período de reconciliação, o balanço, as correntes e a prova ancorada aparecerão aqui.");
}
const semDado='<span class="sm">—</span>';
const val=(v,alt)=>v===undefined||v===null||v===""?(alt===undefined?semDado:alt):v;

/* ========== TELAS ========== */
T.lote=()=>{
  if(!LOTE||!ELEMENTOS.length) return semPeriodo();
  const nd=ELEMENTOS[0];
  const g=LOTE.correlationGroup||{};
  const run=LOTE.workflowRun||{};
  const periodId=LOTE.periodId||LOTE.reconciliationPeriodId||LOTE.lotId;
  const periodWindow=LOTE.periodWindow||LOTE.documentWindow;
  const periodNode=LOTE.nodeActor||LOTE.responsibleActor;
  const includedLots=Array.isArray(LOTE.includedLotIds)
    ? LOTE.includedLotIds.join(", ")
    : (LOTE.includedLots||LOTE.lotId);

  return '<div class="crumb">Período de reconciliação · <span class="mono">'+val(periodId)+'</span></div>'+
  '<section class="lot-hero"><div class="panel lot-main">'+
  '<div class="proof-stack" aria-hidden="true"><i></i><i></i><i></i><span>#</span></div>'+
  '<div class="lot-kicker"><span class="tag t-nd">GRUPO PRIVADO REVALIDADO</span> Balanço de massa'+
  (LOTE.version?' · versão '+LOTE.version:'')+'</div>'+
  '<div class="lot-title"><div><h1>'+val(periodId)+'</h1>'+
  '<p class="lot-sub">Balanço do período entre t₀ e t₁. Lotes de origens '+
  'distintas, saídas e inventários foram normalizados e recalculados a partir das evidências verificadas.</p></div>'+
  '<button class="btn dl">Baixar relatório</button></div>'+
  '<div class="lot-meta"><span>Nó de processamento <b>'+val(periodNode)+'</b></span>'+
  '<span>Período <b>'+val(periodWindow)+'</b></span>'+
  '<span>Lotes incluídos <b class="mono">'+val(includedLots)+'</b></span>'+
  '<span>Cálculo <b class="mono">'+val(LOTE.calculationVersion)+'</b></span>'+
  '<span>Resultado <b class="mono">'+val(LOTE.resultId)+'</b></span></div>'+
  '</div><aside class="panel verdict-card"><div><span class="eyebrow">Resultado atual</span>'+
  '<div class="verdict"><span class="status-dot"></span>'+VEREDITO+'</div>'+
  '<p class="reason">'+(divergentes.length
    ? divergentes.length+' de '+ELEMENTOS.length+' elementos está fora da tolerância: '+
      divergentes.map(x=>x.nome).join(', ')+'. O período permanece disponível para análise e contestação.'
    : 'Todos os '+ELEMENTOS.length+' elementos estão dentro da tolerância declarada.')+'</p></div>'+
  '<div class="foot"><span>Atualizado após nova evidência</span><b>'+val(LOTE.anchoredAt)+'</b></div></aside></section>'+

  '<section class="metric-grid" aria-label="Resumo do balanço">'+
  '<div class="panel metric"><span class="label">Massa elemental de '+nd.e+' disponível</span>'+
  '<span class="value">'+kg3(nd.entrada+nd.i0)+'<span class="unit">kg de '+nd.e+'</span></span>'+
  '<div class="hint">Σ entradas + I₀ · compromisso em mg inteiro</div></div>'+
  '<div class="panel metric"><span class="label">Massa elemental de '+nd.e+' contabilizada</span>'+
  '<span class="value">'+kg3(nd.saida+nd.i1)+'<span class="unit">kg de '+nd.e+'</span></span>'+
  '<div class="hint">Σ saídas + I₁ · compromisso em mg inteiro</div></div>'+
  '<div class="panel metric"><span class="label">'+nd.e+' não contabilizado</span>'+
  '<span class="value">'+kg3(nd.muf)+'<span class="unit">kg de '+nd.e+'</span></span>'+
  '<div class="hint">'+fmt(nd.muf)+' mg · '+pct(Math.abs(nd.rel))+' da entrada</div></div>'+
  '<div class="panel metric'+(divergentes.length?' alert':'')+'"><span class="label">Elementos em revisão</span>'+
  '<span class="value">'+divergentes.length+'<span class="unit">de '+ELEMENTOS.length+'</span></span>'+
  '<div class="hint">'+(divergentes.length

  '<div class="assurance-flow"><div><i>01</i><span><b>Documento original</b><small>Arquivo preservado no cofre privado</small></span></div><em>→</em>'+
  '<div><i>02</i><span><b>Validação confidencial</b><small>Integridade, correlação e cálculo no CRE/TEE</small></span></div><em>→</em>'+
  '<div><i>03</i><span><b>Prova versionada</b><small>Hashes e estados ancorados sem expor o negócio</small></span></div></div></section>'+

  '<section class="correlation-layout"><div class="panel correlation-card">'+
  '<div class="section-title"><div><span class="section-eyebrow">GRAFO CONFIDENCIAL</span>'+
  '<h2>Grupo privado <span class="mono">'+val(g.correlationGroupId)+'</span></h2>'+
  '<p>O identificador localiza candidatos; cada relação abaixo foi conferida novamente nesta execução.</p></div>'+
  (g.edgeCount?'<span class="tag t-ok">'+g.edgeCount+' RELAÇÕES REVALIDADAS</span>':'')+'</div>'+
  '<div class="correlation-kpis"><span><b>'+val(g.evidenceCount,0)+'</b> evidências</span>'+
  '<span><b>'+val(g.actorCount,0)+'</b> atores</span>'+
  '<span><b>'+val(g.physicalFlowCount,0)+'</b> correntes físicas</span>'+
  '<span><b class="mono">'+val(g.correlationPolicyVersion)+'</b> política</span></div>'+
  (g.nodes&&g.nodes.length
    ? '<div class="panel scrollx" style="margin-top:14px"><table><thead><tr><th>Nó</th><th>Função</th>'+
      '<th>Participante</th><th>Evidência</th><th>Estado</th></tr></thead><tbody>'+
      g.nodes.map((n,i)=>'<tr><td class="mono">'+String(i+1).padStart(2,"0")+'</td>'+
        '<td>'+val(n.funcao)+'</td><td>'+val(n.participante)+'</td>'+
        '<td class="mono" style="font-size:12.5px">'+val(n.evidencia)+'</td>'+
        '<td>'+vtag(val(n.estado,"PENDING"))+'</td></tr>').join("")+
      '</tbody></table></div>'
    : vazio("Grafo ainda não montado",
        "Assim que houver evidências correlacionadas neste período, os nós aparecem aqui."))+
  (g.edges&&g.edges.length
    ? '<h3 style="margin-top:20px">Arestas verificadas</h3><div class="panel scrollx"><table><thead><tr><th>relationId</th><th>De</th><th>Para</th><th>Tipo</th><th>transferId</th><th>Verificada em</th></tr></thead><tbody>'+
      g.edges.map(e=>'<tr><td class="mono">'+val(e.relationId)+'</td><td class="mono">'+val(e.fromEvidenceId)+'</td><td class="mono">'+val(e.toEvidenceId)+'</td><td>'+val(e.relationType)+'</td><td class="mono">'+val(e.transferId)+'</td><td>'+val(e.verifiedAt)+'</td></tr>').join('')+
      '</tbody></table></div>'
    : vazio("Nenhuma aresta validada","As relações verificadas aparecem aqui com sua regra, transferência e última verificação."))+
  '</div>'+
  '<aside class="panel verification-card"><div class="run-head"><div><span>EXECUÇÃO CRE/TEE</span>'+
  '<h2>'+val(run.title,"Sem execução registrada")+'</h2></div><i></i></div>'+
  '<div class="run-id"><span>workflowRunId</span><b class="mono">'+val(run.workflowRunId)+'</b><small>'+val(run.executedAt)+'</small></div>'+
  '<div class="verification-score"><b>'+val(run.confirmedEvidence,0)+'/'+val(run.totalEvidence,0)+'</b><span>evidências confirmadas</span></div>'+
  '<div class="progress"><span style="width:'+(run.totalEvidence?Math.round((run.confirmedEvidence/run.totalEvidence)*100):0)+'%"></span></div>'+
  '<div class="verification-list"><div><span>Integridade dos hashes</span><b>'+val(run.hashStatus)+'</b></div>'+
  '<div><span>Relações rechecadas</span><b>'+val(run.revalidatedEdges)+'</b></div>'+
  '<div><span>Política de correlação</span><b class="mono">'+val(g.correlationPolicyVersion)+'</b></div>'+
  '<div><span>Versão do cálculo</span><b class="mono">'+val(LOTE.calculationVersion)+'</b></div></div>'+
  '<div class="trust-note"><b>O grupo não é fonte de confiança</b><p>O identificador apenas acelera '+
  'a descoberta. O CRE/TEE reabre os dados e valida cada aresta antes do cálculo.</p></div></aside></section>'+

  '<section class="panel balance-card"><div class="section-title"><div>'+
  '<span class="section-eyebrow">IDENTIDADE DE CONSERVAÇÃO</span>'+
  '<h2>Balanço elemental · '+nd.nome+'</h2>'+
  '<p>Unidade canônica: massa do elemento em miligramas inteiros. Óxido é apresentação e não entra '+
  'na identidade.</p></div>'+vtag(nd.veredito)+'</div>'+
  '<div class="balance-line"><div class="balance-item"><span>Σ entradas + I₀</span><b>'+fmt(nd.entrada+nd.i0)+' mg</b></div>'+
  '<div class="balance-op">−</div><div class="balance-item"><span>Σ saídas + I₁</span><b>'+fmt(nd.saida+nd.i1)+' mg</b></div>'+
  '<div class="balance-op">=</div><div class="balance-item balance-result"><span>MUF · não contabilizado</span>'+
  '<b>'+fmt(nd.muf)+' mg</b></div></div>'+
  '<div class="calc-trace"><div><i>00</i><span><b>Coerência de base</b><small>massa e teor compatíveis</small></span></div><em>→</em>'+
  '<div><i>01</i><span><b>Normalização</b><small>base seca a 105 °C</small></span></div><em>→</em>'+
  '<div><i>02</i><span><b>Conversão elementar</b><small>óxido para elemento</small></span></div><em>→</em>'+
  '<div><i>03</i><span><b>Inteiro canônico</b><small>arredondamento único</small></span></div><em>→</em>'+
  '<div><i>04</i><span><b>Decisão</b><small>|MUF| ≤ k·σ</small></span></div></div></section>'+

  '<details class="panel product-details"><summary><div>Detalhamento por elemento'+
  '<span>'+ELEMENTOS.map(x=>x.nome).join(', ')+'</span></div></summary>'+
  '<div class="details-body">'+tabelaElementos()+avisoDivergente()+avisoArbitrado()+'</div></details>'+

  '<details class="panel product-details"><summary><div>Correntes e bases de cálculo'+
  '<span>Entradas, produto, rejeito, efluente e inventários usados neste período</span></div></summary>'+
  '<div class="details-body">'+
  (LOTE.physicalFlows&&LOTE.physicalFlows.length
    ? '<div class="panel scrollx"><table><thead><tr><th>Corrente</th><th>Tipo</th><th>Base</th>'+
      '<th class="num">Massa seca</th><th class="num">Elemento contido</th><th>Origem do valor</th></tr></thead><tbody>'+
      LOTE.physicalFlows.map(c=>'<tr><td>'+val(c.nome)+'</td><td>'+val(c.tipo)+'</td>'+
        '<td class="mono">'+val(c.base)+'</td><td class="num">'+val(c.massaSeca)+'</td>'+
        '<td class="num">'+val(c.contido)+'</td><td>'+val(c.origem)+'</td></tr>').join("")+
      '</tbody></table></div>'
    : vazio("Nenhuma corrente declarada","As correntes físicas aparecem aqui quando as evidências correspondentes forem correlacionadas."))+
  '</div></details>'+

  '<details class="panel product-details"><summary><div>Prova blockchain e histórico'+
  '<span>Resultado atual, versões anteriores e transação de ancoragem</span></div></summary>'+
  '<div class="details-body">'+
  (LOTE.versions&&LOTE.versions.length
    ? '<div class="version-chain">'+LOTE.versions.map((v,i)=>
        '<div'+(i===LOTE.versions.length-1?' class="current"':'')+'><i>'+val(v.label)+'</i>'+
        '<span><b>'+val(v.status)+'</b><small class="mono">'+val(v.resultId)+
        (i===LOTE.versions.length-1?' · ATUAL':'')+'</small></span></div>').join('<em>→</em>')+
      '</div>'
    : '')+
  '<div class="panel pad"><dl class="kv">'+
  '<dt>resultId atual</dt><dd class="mono">'+val(LOTE.resultId)+'</dd>'+
  '<dt>resultHash atual</dt><dd class="mono">'+val(LOTE.resultHash)+'</dd>'+
  '<dt>previousResultId</dt><dd class="mono">'+val(LOTE.previousResultId)+'</dd>'+
  '<dt>Versão do cálculo</dt><dd class="mono">'+val(LOTE.calculationVersion)+'</dd>'+
  '<dt>Ancorado em</dt><dd>'+val(LOTE.anchoredAt)+'</dd>'+
  '<dt>Transação</dt><dd class="hash">'+val(LOTE.transactionHash)+'</dd></dl>'+
  '<p class="note">O resultado atual foi adicionado ao histórico. A versão anterior continua '+
  'disponível e não pode ser sobrescrita. O resultHash compromete o manifesto privado com '+
  'evidenceIds ordenados, arestas, versões das regras, recorte do ator e privateNonce. Nenhum '+
  'desses dados privados é publicado na transação.</p></div></div></details>';
};

T.evidencias=()=>{
  const g=(LOTE&&LOTE.correlationGroup)||{};
  const q=(LOTE&&LOTE.queue)||{};
  const filas=evidenciasExibidas();
  return '<div class="crumb">Lote <span class="mono">'+(LOTE?val(LOTE.lotId):semDado)+'</span></div>'+
  '<h1>Fila e correlação privada</h1><p class="sub">Cada documento entra como PENDING. O CRE/TEE '+
  'confirma o hash, extrai novamente os dados do documento e valida as relações antes de marcar MATCHED.</p>'+
  '<div class="actions" style="margin-bottom:14px"><button class="btn ghost" data-print-cre-proof>Consultar artefato CRE/TEE</button></div>'+
  '<div class="stats" aria-label="Fila determinística">'+
  '<div><span class="n mono">EvidenceSubmitted</span><span class="l">Gatilho principal</span></div>'+
  '<div><span class="n">'+val(q.pendingCount,0)+'</span><span class="l">PENDING na fila</span></div>'+
  '<div><span class="n">'+val(q.retryCount,0)+'</span><span class="l">Retries programados</span></div>'+
  '<div><span class="n">'+val(q.lastRecoveryScan)+'</span><span class="l">Última varredura de recuperação</span></div></div>'+
  '<p class="note">Processamento orientado por evento, fila determinística e varredura programada como fallback. '+
  'Nenhuma evidência depende de escolha aleatória.</p>'+
  (g.correlationGroupId?'<div class="correlation-banner"><div><span>correlationGroupId CANDIDATO</span><b class="mono">'+g.correlationGroupId+'</b></div>'+
   '<p><strong>Descoberta acelerada, confiança recalculada.</strong> O grupo orienta a varredura; '+
   'origem, destino, datas, referências e relações são conferidos novamente pelo CRE/TEE.</p>'+
   '<div class="banner-stat"><b>'+val(g.edgeCount,0)+'</b><span>arestas revalidadas<br>nesta execução</span></div></div>':'')+
  (filas.length
    ? '<div class="panel scrollx"><table class="evidence-grid-table"><thead><tr><th>Evidência</th><th>Participante</th>'+
      '<th>Documento</th><th>Função no cálculo</th><th>transferId</th><th>correlationGroupId</th><th>Estado</th></tr></thead><tbody>'+
      filas.map(e=>'<tr><td class="mono" style="font-size:12.5px">'+val(e.id)+'<div class="sm">'+val(e.enviada)+'</div></td>'+
        '<td>'+val(e.ator)+'<div class="sm">'+val(e.papel)+'</div></td>'+
        '<td>'+val(e.doc)+'<div class="sm mono">'+val(e.ref)+'</div></td><td>'+val(e.calculationRole)+'</td>'+
        '<td class="mono" style="font-size:12px">'+val(e.transferId)+'</td>'+
        '<td class="mono" style="font-size:12px">'+val(e.correlationGroupId)+'</td><td>'+vtag(val(e.status,"PENDING"))+'</td></tr>').join("")+
      '</tbody></table></div>'
    : vazio("Nenhuma evidência registrada",
        "Quando um participante enviar um documento, ele aparece aqui como pendente até a correlação ser validada."))+
  (g.edges&&g.edges.length
    ? '<h2>Arestas verificadas</h2><div class="panel scrollx"><table><thead><tr><th>relationId</th><th>Evidência A</th><th>Evidência B</th><th>Relação</th><th>transferId</th><th>Política</th><th>Verificada em</th></tr></thead><tbody>'+
      g.edges.map(e=>'<tr><td class="mono">'+val(e.relationId)+'</td><td class="mono">'+val(e.fromEvidenceId)+'</td><td class="mono">'+val(e.toEvidenceId)+'</td><td>'+val(e.relationType)+'</td><td class="mono">'+val(e.transferId)+'</td><td class="mono">'+val(g.correlationPolicyVersion)+'</td><td>'+val(e.verifiedAt)+'</td></tr>').join('')+
      '</tbody></table></div>'
    : '')+
  '<p class="note">Evidência pendente há mais de 365 dias deixa de ser correlacionável. Não é '+
  'reprovação do material: é encerramento por prazo. Grupo, transferências e arestas permanecem '+
  'no Supabase/TEE e não concedem acesso nem são publicados on-chain. O contrato recebe um '+
  'evidenceId por relatório de correlação, evitando revelar um conjunto no mesmo calldata.</p>';
};

T.documento=()=>{
  if(!DOCUMENTO) return '<h1>Documento e verificação</h1>'+
    '<p class="sub">O documento original ao lado do que o sistema extraiu dele e das regras aplicadas.</p>'+
    vazio("Nenhum documento selecionado",
      "Abra uma evidência na lista para ver o arquivo original, os campos extraídos e o resultado das regras.");
  const d=DOCUMENTO;
  const campos=d.campos||[];
  const extraido=d.extraido||[];
  const regras=d.regras||[];
  return '<div class="crumb">Evidência <span class="mono">'+val(d.evidenceId)+'</span> · '+val(d.emissor)+'</div>'+
  '<div class="headrow"><div class="grow"><h1>Documento e verificação</h1>'+
  '<p class="sub">O documento original ao lado do que o sistema extraiu dele e das regras aplicadas.</p></div>'+
  '<div class="actions"><button class="btn ghost dl">Baixar original</button></div></div>'+
  '<div class="split32"><div class="docview"><div class="sheet">'+
  '<h4>'+val(d.emissor)+'</h4><h5>'+val(d.titulo)+'</h5><dl>'+
  campos.map(c=>'<dt>'+val(c[0])+'</dt><dd>'+val(c[1])+'</dd>').join("")+'</dl>'+
  (d.rodape?'<div class="ft">'+d.rodape+'</div>':'')+'</div></div><div class="stack">'+

function evidenciaClienteAtual(){

  const company=String(LOTE?.sharingCompany||LOTE?.supplierName||LOTE?.actorName||"").trim().toLowerCase();

function normalizarStatusCliente(value){
  const s=String(value||"").trim().toUpperCase().replace(/\s+/g,"_");
  if(["VERIFIED","VERIFICADO","AUDITED","AUDIT_VERIFIED"].includes(s)) return "VERIFIED";
  if(["DIVERGENT","DIVERGENTE","REJECTED","REPROVADO","AUDIT_DIVERGENT"].includes(s)) return "DIVERGENT";
  if(["MATCHED","CONFORME"].includes(s)) return s;
  return s||"PENDING";
}
function auditoriaClienteAtual(){
  const ev=evidenciaClienteAtual();
  const raw=LOTE?.clientAuditStatus||LOTE?.auditStatus||LOTE?.auditorStatus||LOTE?.latestAuditStatus||LOTE?.audit?.status||ev?.auditStatus||ev?.state;
  const status=normalizarStatusCliente(raw);
  const explicit=!!(LOTE?.clientAuditStatus||LOTE?.auditStatus||LOTE?.auditorStatus||LOTE?.latestAuditStatus||LOTE?.audit?.status);
  const audited=status==="VERIFIED"||status==="DIVERGENT";
  return {
    status:audited?status:"PENDING",
    explicit,
    txHash:LOTE?.clientAuditTxHash||LOTE?.auditTxHash||LOTE?.auditorTransactionHash||LOTE?.audit?.txHash||"",
    resultId:LOTE?.clientAuditResultId||LOTE?.auditResultId||LOTE?.audit?.resultId||"",
    auditedAt:LOTE?.clientAuditedAt||LOTE?.auditedAt||LOTE?.audit?.auditedAt||""
  };
}
function matchClienteAtual(){

function clientBalanceDateFromUnix(value){
  const n=Number(value||0);

function clientBalanceKgFromMg(value){
  if(value===null||value===undefined) return "Not attested";
  const n=Number(value)/1e6;
  return Number.isFinite(n)
    ? n.toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:6})+" kg"
    : String(value)+" mg";
}

async function clientBalanceEnsureSession(){
  if(CLIENT_BALANCE_SESSION_PROMISE) return CLIENT_BALANCE_SESSION_PROMISE;
  CLIENT_BALANCE_SESSION_PROMISE=(async()=>{
    const current=await supabaseClient.auth.getSession();
    let user=current?.data?.session?.user;
    if(!user){
      const signed=await supabaseClient.auth.signInAnonymously();
      if(signed.error) throw signed.error;
      user=signed.data?.user;
    }
    if(!user) throw new Error("Supabase did not return an authenticated session.");
    const claim=await supabaseClient.rpc("explorerchem_demo_claim_actors");
    if(claim.error){
      throw new Error("Could not prepare authorized storage access: "+claim.error.message);
    }
    return true;
  })().catch(error=>{
    CLIENT_BALANCE_SESSION_PROMISE=null;
    throw error;
  });
  return CLIENT_BALANCE_SESSION_PROMISE;
}
async function clientBalanceSignedJson(path){
  await clientBalanceEnsureSession();
  const signed=await supabaseClient.storage.from(EVIDENCE_BUCKET).createSignedUrl(path,900);
  if(signed.error){
    throw new Error("Private mass result is not accessible: "+signed.error.message);
  }
  const response=await fetch(signed.data.signedUrl,{cache:"no-store"});
  if(!response.ok){
    throw new Error("Private mass result download failed with HTTP "+response.status+".");
  }
  return response.json();
}
function clientBalanceRecompute(manifest){
  if(manifest.schema==="ExploreChem/PrivatePairwiseMass/v1"){
    const result={
      schema:"ExploreChem/PairwiseMassResult/v1",
      calculationVersion:manifest.calculationVersion,
      focusActorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      lotReference:manifest.lotReference,
      evidenceIds:manifest.evidenceIds,
      correlationEdges:manifest.correlationEdges,
      massPairs:manifest.massPairs,
      status:manifest.status
    };
    const aggregateInputHash=clientBalanceHashStable({
      domain:"ExploreChem/PairwiseMassInput/v1",
      calculationVersion:manifest.calculationVersion,
      actorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      evidenceIds:manifest.evidenceIds,
      correlationEdges:manifest.correlationEdges
    });
    const resultHash=clientBalanceHashStable({
      domain:"ExploreChem/PairwiseMass/v1",
      calculationVersion:manifest.calculationVersion,
      actorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      result
    });
    const resultId=clientBalanceHashStable({
      domain:"ExploreChem/PairwiseMassResultId/v1",
      calculationVersion:manifest.calculationVersion,
      actorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      resultHash
    });
    return {aggregateInputHash,resultHash,resultId};
  }

  if(manifest.schema==="ExploreChem/PrivateLotCorrelatedPairwiseMass/v4"){
    const result={
      schema:"ExploreChem/LotCorrelatedPairwiseMassResult/v4",
      focusEvidenceId:manifest.sourceEvidenceId,
      lotReference:manifest.lotReference,
      evidenceIds:manifest.evidenceIds,
      correlationEdges:manifest.correlationEdges,
      massPairs:manifest.massPairs,
      status:manifest.status
    };
    const relationFingerprint=clientBalanceHashStable({
      domain:"ExploreChem/LotRelationFingerprint/v4",
      lotReference:result.lotReference,
      evidenceIds:result.evidenceIds,
      correlationEdges:result.correlationEdges,
      massPairs:result.massPairs
    });
    const aggregateInputHash=clientBalanceHashStable({
      domain:"ExploreChem/LotComponentInput/v4",
      salt:manifest.salt,
      focusEvidenceId:manifest.sourceEvidenceId,
      lotReference:result.lotReference,
      evidenceIds:result.evidenceIds,
      correlationEdges:result.correlationEdges
    });
    const resultHash=clientBalanceHashStable({
      domain:"ExploreChem/LotComponentResult/v4",
      salt:manifest.salt,
      relationFingerprint,
      result
    });
    const resultId=clientBalanceHashText(
      "ExploreChem/LotComponentResultId/v4|"+
      manifest.sourceActorId+"|"+
      manifest.sourceEvidenceId+"|"+
      relationFingerprint+"|"+
      resultHash
    );
    return {aggregateInputHash,resultHash,resultId};
  }

  throw new Error("Unsupported mass-result schema: "+String(manifest.schema||"missing"));
}
function clientBalanceIsStructuralDivergence(manifest,auditState){
  return Array.isArray(manifest?.massPairs)&&
    manifest.massPairs.length===0&&
    manifest.status==="DIVERGENTE"&&
    auditState==="DIVERGENT";
}
function clientBalanceValidatePairs(manifest,auditState){
  if(!Array.isArray(manifest.massPairs)){
    throw new Error("Mass-pair collection is missing or invalid.");
  }

  /*
   * A structural divergence is intentionally produced without a mass pair.
   * It is accepted only when the private manifest declares DIVERGENTE and the
   * evidence itself is already DIVERGENT on-chain. Result commitments and the
   * blockchain result status are still independently checked immediately after.
   */
  if(clientBalanceIsStructuralDivergence(manifest,auditState)) return;

  const statuses=[];
  for(const pair of manifest.massPairs){
    const attested=
      pair.leftMassMg!==null&&pair.leftMassMg!==undefined&&
      pair.rightMassMg!==null&&pair.rightMassMg!==undefined;
    const expected=attested
      ? (BigInt(pair.leftMassMg)===BigInt(pair.rightMassMg)?"CONFORME":"DIVERGENTE")
      : "NAO_ATESTADO";
    const delta=attested
      ? (BigInt(pair.leftMassMg)-BigInt(pair.rightMassMg)).toString()
      : null;
    if(pair.status!==expected||((pair.deltaMg??null)!==delta)){
      throw new Error("Pairwise mass values are not reproducible.");
    }
    statuses.push(expected);
  }
  const overall=statuses.includes("DIVERGENTE")
    ? "DIVERGENTE"
    : (statuses.length&&statuses.every(x=>x==="CONFORME")?"CONFORME":"NAO_ATESTADO");
  if(manifest.status!==overall){
    throw new Error("Overall mass verdict is not reproducible.");
  }
}
async function clientBalanceProvider(){

        SEPOLIA_PUBLIC_RPC,
        SEPOLIA_CHAIN_ID_DECIMAL,
        {staticNetwork:true}

      }

    }

    throw error;
  });
  return CLIENT_BALANCE_PROVIDER_PROMISE;
}
