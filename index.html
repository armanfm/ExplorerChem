const STOCK_MUF_CACHE=new WeakMap();
function loadStockMuf(c,row,blockTag){
 let cache=STOCK_MUF_CACHE.get(c);if(!cache){cache=new Map();STOCK_MUF_CACHE.set(c,cache);}
 const key=blockTag+':'+row.lot.evidenceId+':'+row.lot.mufProofId;
 if(!cache.has(key))cache.set(key,fetchStockMuf(c,row,blockTag));
 return cache.get(key);
}
async function fetchStockMuf(c,row,blockTag){
 if(!row.lot.mufProofId||igualHex(row.lot.mufProofId,ethers.ZeroHash))throw Error('No MUF proof has been registered for this evidence.');
 const proof=await c.registry.getProof(row.lot.mufProofId,{blockTag});
 if(!igualHex(proof.proofId,row.lot.mufProofId)||!igualHex(proof.evidenceId,row.lot.evidenceId)||Number(proof.proofType)!==1)throw Error('The MUF proof does not belong to this evidence.');
 const path='muf-results/'+row.lot.evidenceId.slice(2).toLowerCase()+'/'+row.lot.mufProofId.slice(2).toLowerCase()+'.json';
 const signed=await supabaseClient.storage.from(EVIDENCE_BUCKET).createSignedUrl(path,900);if(signed.error)throw signed.error;
 const response=await fetch(signed.data.signedUrl,{cache:'no-store'});if(!response.ok)throw Error('The private MUF document is unavailable.');
 const bytes=new Uint8Array(await response.arrayBuffer());
 if(!igualHex(ethers.keccak256(bytes),proof.committedHash))throw Error('The MUF document hash differs from its on-chain commitment.');
 const doc=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)),r=doc.result;
 if(!['ExploreChem/PrivateMUFResult/v1','ExploreChem/PrivateMUFResult/v2'].includes(doc.schema)||doc.calculationVersion!==1||r?.schema!=='ExploreChem/MUFResult/v1'||r.calculationVersion!==1)throw Error('Unsupported MUF document format.');
 if(!igualHex(r.evidenceId,row.lot.evidenceId)||!igualHex(r.expectedEvidenceHash,proof.evidenceHash))throw Error('The MUF result does not match the source evidence.');
 if(row.evidenceActorId&&!igualHex(r.actorId,row.evidenceActorId))throw Error('The MUF result belongs to a different company.');
 if(Number(r.statusCode)!==Number(proof.status)||r.status!==clientProofStatus(proof.status))throw Error('The MUF result status differs from the on-chain proof.');
 if(!igualHex(clientBalanceHashStable(doc.methodology),proof.methodologyHash))throw Error('The MUF methodology commitment does not match.');
 const inputHash=clientBalanceHashStable({...(doc.schema==='ExploreChem/PrivateMUFResult/v2'?{committedHash:proof.committedHash}:{}),domain:'ExploreChem/MUFInputCommitment/v1',evidenceId:r.evidenceId,expectedEvidenceHash:r.expectedEvidenceHash,indexedEvidenceHash:r.indexedEvidenceHash,downloadedDocumentHash:r.downloadedDocumentHash,calculationInputs:r.calculation});
 if(!igualHex(inputHash,proof.inputCommitmentHash))throw Error('The MUF input commitment does not match.');
 return {proof,result:r,bytes};
}

async function stockHistoryReadRange(provider,address,iface,fromBlock,toBlock){
 // Alguns RPCs omitem eventos quando recebem topics. Ler por endereço e
 // decodificar localmente preserva também os consumos e emissões intermediários.
 const raw=await provider.send('eth_getLogs',[{address,fromBlock:ethers.toQuantity(fromBlock),toBlock:ethers.toQuantity(toBlock)}]);
 if(!Array.isArray(raw))throw Error("Invalid response when querying contract events.");
 const events=[];
 for(const log of raw){
  if(log.removed||!igualHex(log.address,address))continue;
  let parsed;try{parsed=iface.parseLog(log);}catch(_){continue;}
  if(!['ActorBalanceChanged','ProcessingDifference'].includes(parsed?.name))continue;
  const blockNumber=Number(log.blockNumber),index=Number(log.logIndex);
  if(!Number.isSafeInteger(blockNumber)||blockNumber<fromBlock||blockNumber>toBlock||log.logIndex==null||!Number.isSafeInteger(index)||!log.transactionHash)throw Error("Returned event has no valid identifier.");
  events.push({...log,blockNumber,index,eventName:parsed.name,args:parsed.args,raw:log});
 }
 return events;
}
async function stockHistoryStart(c,blockTag,active){
 // A primeira emissão só pode ocorrer após o registro de sua evidência.
 // Cabeçalhos antigos não exigem acesso ao estado histórico (archive).
 const count=BigInt(await c.lots.lotCount({blockTag}));
 if(count===0n)return blockTag;
 const first=await c.lots.getLot(1n,{blockTag});
 const evidence=await c.registry.getEvidence(first.evidenceId,{blockTag});
 const timestamp=Number(evidence.createdAt);
 if(!Number.isSafeInteger(timestamp)||timestamp<=0)throw Error("First evidence date unavailable.");
 let low=0,high=blockTag;
 while(low<high){
  if(!active())throw Error("Query replaced by another company selection.");
  const mid=Math.floor((low+high)/2),block=await c.provider.getBlock(mid);
  if(!block)throw Error("Block header unavailable: "+mid);
  if(Number(block.timestamp)<timestamp)low=mid+1;else high=mid;
 }
 return Math.max(0,low-1);
}
function stockHistoryDifferences(groups,expected){
 const balances=new Map();
 for(const group of groups)for(const item of group.items)balances.set(item.id,(balances.get(item.id)||0n)+item.inc-item.out);
 return [...expected].filter(([id,value])=>(balances.get(id)||0n)!==value).map(([id,value])=>'Lote '+id+": history "+actorKg(balances.get(id)||0n)+', contrato '+actorKg(value));
}
function historyGroups(logs,actorId){
 const groups=new Map(),seen=new Set();
 for(const log of [...logs].sort((a,b)=>a.blockNumber-b.blockNumber||Number(a.index??a.logIndex)-Number(b.index??b.logIndex))){
  const index=log.index??log.logIndex;if(index==null)throw Error("Event missing log index; query incomplete.");
  const key=log.transactionHash+':'+index;if(seen.has(key))continue;seen.add(key);
  const a=log.args,inc=igualHex(a.to,actorId)?BigInt(a.value):0n,out=igualHex(a.from,actorId)?BigInt(a.value):0n;
  if(!inc&&!out)continue;
  let g=groups.get(log.transactionHash);if(!g){g={tx:log.transactionHash,block:log.blockNumber,incoming:0n,outgoing:0n,items:[]};groups.set(g.tx,g);}
  g.incoming+=inc;g.outgoing+=out;g.items.push({id:String(a.id),inc,out});
 }
 let balance=0n;return [...groups.values()].map(g=>{balance+=g.incoming-g.outgoing;return {...g,balance};});
}

  finally{running=false;if(active())button.disabled=false;}

// E1 private proofs: bytes are checked before any calculation is displayed.
async function e1LoadElemental(c,ref,blockTag){
 const evidence=await c.registry.getEvidence(ref.evidenceId,{blockTag});
 const id=ref.elementalProofId&&!igualHex(ref.elementalProofId,ethers.ZeroHash)?ref.elementalProofId:String(await c.registry.latestProofId(ref.evidenceId,3,{blockTag}));
 if(igualHex(id,ethers.ZeroHash))throw Error("No ELEMENTAL proof exists for this evidence yet.");
 const proof=await c.registry.getProof(id,{blockTag});
 if(!igualHex(proof.proofId,id)||!igualHex(proof.evidenceId,ref.evidenceId)||!igualHex(proof.evidenceHash,evidence.evidenceHash)||Number(proof.proofType)!==3)throw Error("ELEMENTAL proof incompatible with evidence.");
 const path='elemental-results/'+ref.evidenceId.slice(2).toLowerCase()+'/'+id.slice(2).toLowerCase()+'.json';
 const signed=await supabaseClient.storage.from(EVIDENCE_BUCKET).createSignedUrl(path,300);if(signed.error)throw signed.error;
 const response=await fetch(signed.data.signedUrl,{cache:'no-store'});if(!response.ok)throw Error('JSON ELEMENTAL: HTTP '+response.status);
 const bytes=new Uint8Array(await response.arrayBuffer());
 if(!igualHex(ethers.keccak256(bytes),proof.committedHash))throw Error("ELEMENTAL JSON hash differs from the on-chain proof.");
 const doc=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
 if(!['ExploreChem/PrivateElementalResult/v1','ExploreChem/PrivateElementalResult/v2'].includes(doc.schema))throw Error("Unsupported ELEMENTAL document format.");
 const result=doc.schema.endsWith('/v1')?doc.result:doc;
 if(!result||!igualHex(result.evidenceId,ref.evidenceId))throw Error("Document ELEMENTAL pertence a outra evidence.");
 for(const value of [doc.actorId,doc.result?.actorId])if(value&&!igualHex(value,evidence.actorId))throw Error("ELEMENTAL result actor mismatch.");
 for(const value of [doc.expectedEvidenceHash,doc.result?.expectedEvidenceHash])if(value&&!igualHex(value,evidence.evidenceHash))throw Error("ELEMENTAL result source hash mismatch.");
 // The MUF dependency belongs to the verified result, not to the E1 Lot tuple.
 const mufProofId=doc.mufProofId||doc.result?.mufProofId;
 if(mufProofId){
  const muf=await c.registry.getProof(mufProofId,{blockTag});
  if(!igualHex(muf.proofId,mufProofId)||!igualHex(muf.evidenceId,ref.evidenceId)||Number(muf.proofType)!==1)throw Error("Incompatible MUF dependency.");
  const expected=doc.expectedMufHash||doc.result?.expectedMufHash;
  if(expected&&!igualHex(expected,muf.committedHash))throw Error("MUF dependency hash mismatch.");
 }
 return {proof,doc,bytes,path,mufProofId};
}
function e1ElementalCalculations(doc){
 const found=[];
 const visit=(value,path,element)=>{
  if(!value||typeof value!=='object')return;
  element=typeof value.element==='string'?value.element:element;
  if(!Array.isArray(value)&&('availableElementMassMg' in value||'accountedElementMassMg' in value)){
   found.push({calculation:value,element:element||null,path});return;
  }
  for(const [key,child]of Object.entries(value))if(child&&typeof child==='object')visit(child,path?path+'.'+key:key,element);
 };
 visit(doc,'',null);
 // The legacy single calculation aliases the first item in elements[].
 // Prefer the explicit collection, keeping every distinct element.
 const listed=found.filter(x=>/(^|\.)(elements|calculations)\.\d+(\.|$)/.test(x.path));
 const normalize=e=>typeof e==='string'?e.trim().toUpperCase():null;
 const primary=listed.length?listed.concat(found.filter(x=>!listed.includes(x)&&!listed.some(y=>normalize(y.element)&&normalize(y.element)===normalize(x.element)))):found;
 const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;
 const seen=new Set();return primary.filter(x=>{const key=JSON.stringify([normalize(x.element),canonical(x.calculation)]);if(seen.has(key))return false;seen.add(key);return true;});
}
function e1LotComposition(row,doc){
 const output=row.document.e1.outputs.find(x=>igualHex(x.opening.lotId,row.id));
 if(!output)throw Error("Lot source flow not found.");
 const groups=new Map();
 for(const {calculation,element}of e1ElementalCalculations(doc)){
  const matches=(calculation.streams||[]).filter(x=>x.streamId===output.streamId);
  if(matches.length!==1)throw Error("Lot flow absent or ambiguous in elemental result.");
  const stream=matches[0],name=element||stream.element;
  if(!name||!/^\d+$/.test(String(stream.containedElementMassMg)))throw Error("Incomplete elemental composition.");
  if(String(stream.dryMassMg)!==String(row.opening.materialMassMg))throw Error("Flow mass differs from lot opening.");
  if(groups.has(name))throw Error("Duplicate element in lot composition.");
  groups.set(name,BigInt(stream.containedElementMassMg));
 }
 if(!groups.size)throw Error("The result does not contain this flow's composition.");
 const total=BigInt(row.opening.materialMassMg),tracked=[...groups.values()].reduce((a,b)=>a+b,0n);
 if(tracked>total)throw Error("Composition exceeds lot mass.");
 // Quantities must agree with the already verified E1 opening, including zeros omitted by E1.
 const expected=row.opening.elements.map(x=>x.basisHash.toLowerCase()+':'+BigInt(x.massMg)).sort();
 const actual=[...groups].filter(([,mass])=>mass>0n).map(([element,mass])=>ethers.id('ExploreChem/Element/'+element+'/dry/mg/v1').toLowerCase()+':'+mass).sort();
 if(JSON.stringify(expected)!==JSON.stringify(actual))throw Error("Elemental quantities differ from the private lot opening.");
 return {total,tracked,groups:[...groups].map(([element,mass])=>({element,mass})),remainder:total-tracked};
}

function e1MufNumbers(result){
 const c=result.calculation;
 if(!c)throw Error('This proof contains no calculated mass balance.');
 const read=key=>{if(!/^-?\d+$/.test(String(c[key])))throw Error('Missing or invalid MUF field: '+key);return BigInt(c[key]);};
 const input=read('referenceInputMassMg'),output=read('accountedOutputMassMg'),difference=read('signedMufMg'),absolute=read('absoluteMufMg');
 if(input<0n||output<0n||absolute<0n||input-output!==difference||(difference<0n?-difference:difference)!==absolute)throw Error('The MUF balance is internally inconsistent.');
 return {input,output,difference,absolute,calculation:c};
}

function e1PartitionCompanyLots(data,actorId,orders=[]){

let rwaConnectionInstance=null,rwaRpcQueue=Promise.resolve(),rwaRpcNextAt=0,rwaRpcCooldownUntil=0,rwaRefreshInFlight=null;
function rwaConnection(){
  if(!rwaConnectionInstance)rwaConnectionInstance=new solanaWeb3.Connection(RWA_SOLANA_RPC,{
    commitment:'confirmed',disableRetryOnRateLimit:true,fetch:rwaScheduledFetch
  });
  return rwaConnectionInstance;

async function rwaScheduledFetch(url,options){
  const run=async()=>{
    if(Date.now()<rwaRpcCooldownUntil)throw Error('RPC Devnet limitou as consultas. Aguarde '+Math.ceil((rwaRpcCooldownUntil-Date.now())/1000)+" seconds before retrying.");
    const delay=Math.max(0,rwaRpcNextAt-Date.now());
    if(delay)await new Promise(resolve=>setTimeout(resolve,delay));
    rwaRpcNextAt=Date.now()+350;
    const response=await fetch(url,options);
    if(response.status===429){
      const retry=Number(response.headers?.get?.('Retry-After'));
      rwaRpcCooldownUntil=Date.now()+Math.max(30000,Math.min(60000,(Number.isFinite(retry)?retry:30)*1000));
      throw Error("The public Solana Devnet RPC reached its limit. Queries are paused for "+Math.ceil((rwaRpcCooldownUntil-Date.now())/1000)+" seconds; this call did not send any new transaction.");
    }
    return response;
  };
  const result=rwaRpcQueue.then(run,run);
  rwaRpcQueue=result.catch(()=>{});
  return result;
}
async function rwaRpc(method,params=[]){
  const response=await rwaScheduledFetch(RWA_SOLANA_RPC,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:Date.now(),method,params})});
  if(!response.ok)throw new Error("RPC Solana Devnet: HTTP "+response.status);
  const json=await response.json();if(json.error)throw new Error(json.error.message||"Solana Devnet RPC failed.");return json.result;
}

function rwaBytes(...parts){

  const total=arrays.reduce((n,a)=>n+a.length,0),out=new Uint8Array(total);let offset=0;
  for(const a of arrays){out.set(a,offset);offset+=a.length;}return out;
}

async function rwaSimulateBeforeSigning(tx,label){
  const bytes=tx.serialize({requireAllSignatures:false,verifySignatures:false});
  let binary="";for(const byte of bytes)binary+=String.fromCharCode(byte);
  const result=await rwaRpc("simulateTransaction",[btoa(binary),{
    encoding:"base64",commitment:"confirmed",sigVerify:false
  }]);
  if(!result||!result.value)throw new Error(label+": RPC did not return a simulation. No signature was requested.");
  rwaShowSimulation(label,result.value);
  if(result.value.err){
    const logs=result.value.logs||[];
    const reason=logs.filter(line=>/Error|failed|insufficient/i.test(line)).slice(-4).join(" | ");
    throw new Error(label+" — Devnet simulation failed: "+JSON.stringify(result.value.err)+(reason?". "+reason:"")+". Nenhuma assinatura foi solicitada.");
  }

}
function rwaWalletChangeDescription(original,returned){
  const budget=solanaWeb3.ComputeBudgetProgram.programId;
  if(!returned?.instructions)return "incompatible transaction format";
  if(!returned.feePayer?.equals(original.feePayer))return "fee payer wallet";
  if(returned.recentBlockhash!==original.recentBlockhash)return 'blockhash';
  const business=tx=>tx.instructions.filter(ix=>!ix.programId.equals(budget));
  const a=business(original),b=business(returned);
  if(a.length!==b.length)return "instruction count: "+a.length+' → '+b.length;
  for(let i=0;i<a.length;i++){
    if(!a[i].programId.equals(b[i].programId))return "instruction program "+i;
    if(rwaHex(a[i].data)!==rwaHex(b[i].data))return "instruction data "+i;
    if(a[i].keys.length!==b[i].keys.length)return "instruction account count "+i;
    for(let j=0;j<a[i].keys.length;j++){
      const x=a[i].keys[j],y=b[i].keys[j];
      if(!x.pubkey.equals(y.pubkey)||x.isSigner!==y.isSigner||x.isWritable!==y.isWritable)return "account/permissions "+j+" of instruction "+i;
    }
  }
  return "fee/compute instructions or signatures";
}
function rwaWalletFeeAdjustmentAllowed(original, returned){
  if(!returned || !Array.isArray(returned.instructions) ||
     !returned.feePayer?.equals(original.feePayer) ||
     returned.recentBlockhash!==original.recentBlockhash ||
     returned.compileMessage().header.numRequiredSignatures!==1)return false;
  const budget=solanaWeb3.ComputeBudgetProgram.programId;
  const business=tx=>tx.instructions.filter(ix=>!ix.programId.equals(budget));
  const a=business(original),b=business(returned);
  if(a.length!==b.length)return false;
  for(let i=0;i<a.length;i++){
    if(!a[i].programId.equals(b[i].programId)||rwaHex(a[i].data)!==rwaHex(b[i].data)||a[i].keys.length!==b[i].keys.length)return false;
    for(let k=0;k<a[i].keys.length;k++){
      const x=a[i].keys[k],y=b[i].keys[k];
      if(!x.pubkey.equals(y.pubkey)||x.isSigner!==y.isSigner||x.isWritable!==y.isWritable)return false;
    }
  }
  // Only recognized fee/compute instructions without accounts are allowed.
  const fee=returned.instructions.filter(ix=>ix.programId.equals(budget));
  const seen=new Set();
  for(const ix of fee){
    const d=ix.data,kind=d[0];
    if(ix.keys.length||seen.has(kind))return false;
    seen.add(kind);
    if(kind===2){if(d.length!==5)return false;const units=new DataView(d.buffer,d.byteOffset,d.byteLength).getUint32(1,true);if(!units||units>1400000)return false;}
    else if(kind===3){if(d.length!==9)return false;}
    else return false;
  }
  const unitsIx=fee.find(ix=>ix.data[0]===2);
  const priceIx=fee.find(ix=>ix.data[0]===3);
  if(priceIx){
    const price=new DataView(priceIx.data.buffer,priceIx.data.byteOffset,9).getBigUint64(1,true);
    const units=unitsIx?BigInt(new DataView(unitsIx.data.buffer,unitsIx.data.byteOffset,5).getUint32(1,true)):1400000n;
    if((price*units+999999n)/1000000n>10000000n)return false;
  }
  return true;
}

function rwaComputeLimit(consumed){
  if(!Number.isFinite(consumed)||consumed<=0)throw Error("Invalid compute consumption.");
  return Math.min(1400000,Math.max(25000,Math.ceil(consumed*1.2)+10000));
}
async function rwaSendIx(ixs,label){
  const provider=rwaSolanaProvider();
  if(!provider||!rwaSolanaWalletAddress)throw Error("Connect the Solana wallet.");
  if(typeof provider.signTransaction!=="function")throw Error("This wallet must support signTransaction for submission through the Devnet RPC.");
  const connection=rwaConnection();
  const payer=rwaPk(rwaSolanaWalletAddress);
  if(!provider.publicKey||!provider.publicKey.equals(payer))throw Error("Wallet changed. Reconnect before continuing.");
  const latest=await connection.getLatestBlockhash("confirmed");
  let tx=new solanaWeb3.Transaction();tx.feePayer=payer;tx.recentBlockhash=latest.blockhash;tx.add(...ixs);
  const budgetProgram=solanaWeb3.ComputeBudgetProgram.programId;
  const businessInstructions=tx.instructions.filter(ix=>!ix.programId.equals(budgetProgram));
  const priceInstructions=tx.instructions.filter(ix=>ix.programId.equals(budgetProgram)&&ix.data[0]===3);
  tx.instructions=[solanaWeb3.ComputeBudgetProgram.setComputeUnitLimit({units:1400000}),...priceInstructions,...businessInstructions];
  const simulation=await rwaSimulateBeforeSigning(tx,label+" · compute estimate");
  if(Number.isFinite(simulation?.unitsConsumed)&&simulation.unitsConsumed>0){
    const units=rwaComputeLimit(simulation.unitsConsumed);
    tx.instructions=[solanaWeb3.ComputeBudgetProgram.setComputeUnitLimit({units}),...priceInstructions,...businessInstructions];
    await rwaSimulateBeforeSigning(tx,label+' · limite ajustado: '+units+' unidades');
  }
  let message=tx.serializeMessage();const required=tx.compileMessage().accountKeys.slice(0,tx.compileMessage().header.numRequiredSignatures);
  for(const key of required){
    if(!provider.publicKey?.equals(key)){
      if(!confirm("A signature is required from wallet "+key.toBase58()+'. Selecione essa conta na carteira e clique OK para conectá-la.'))throw Error("Signature collection cancelled; nothing was sent.");
      if(typeof provider.disconnect==='function')await provider.disconnect();
      await provider.connect();
      if(!provider.publicKey?.equals(key))throw Error("Selected wallet differs from the required signer. Nothing was sent.");
    }
    if(await connection.getBlockHeight('confirmed')>=latest.lastValidBlockHeight)throw Error("Transaction expired while collecting signatures. Nothing was sent.");
    const originalTx=solanaWeb3.Transaction.from(tx.serialize({requireAllSignatures:false,verifySignatures:false}));
    const part=await provider.signTransaction(tx);
    if(rwaHex(part.serializeMessage())!==rwaHex(message)){
      if(required.length!==1||!rwaWalletFeeAdjustmentAllowed(originalTx,part))throw Error("The wallet changed operation data or a fee beyond the allowed limit. Nothing was sent. Difference: "+rwaWalletChangeDescription(originalTx,part));
      await rwaSimulateBeforeSigning(part,label+" · fee adjusted by wallet");
      tx=part;message=tx.serializeMessage();
    }
    const signature=part.signatures.find(x=>x.publicKey.equals(key))?.signature;
    if(!signature)throw Error("The wallet did not provide the required signature.");tx.addSignature(key,signature);
  }
  const signed=tx;
  rwaSolanaWalletAddress=provider.publicKey.toBase58();
  if(await connection.getBlockHeight("confirmed")>=latest.lastValidBlockHeight)throw Error("Transaction expired. Operation stopped without submission or an automatic new signature. Click again to resume.");
  const signature=await connection.sendRawTransaction(signed.serialize(),{skipPreflight:false,preflightCommitment:"confirmed",maxRetries:5});
  try{
    const result=await connection.confirmTransaction({signature,blockhash:latest.blockhash,lastValidBlockHeight:latest.lastValidBlockHeight},"confirmed");
    if(result.value.err)throw Error("Falha on-chain: "+JSON.stringify(result.value.err));
  }catch(error){
    const status=await rwaSignatureStatus(connection,signature);
    if(status?.err)throw Error(label+": falha on-chain "+JSON.stringify(status.err)+". Assinatura: "+signature);
    if(!status||!['confirmed','finalized'].includes(status.confirmationStatus))throw Error(label+": confirmation not obtained. Check signature "+signature+" on Devnet before retrying. "+(error.message||error));
  }
  renderWallet();
  return signature;
}
function rwaBatchInstructions(ixs){
  return [solanaWeb3.ComputeBudgetProgram.setComputeUnitLimit({units:1400000}),...ixs];
}
function rwaLineageBatchFits(ixs,payer){
  if(ixs.length>6)return false;
  try{const tx=new solanaWeb3.Transaction();tx.feePayer=payer;tx.recentBlockhash=solanaWeb3.SystemProgram.programId.toBase58();tx.add(...rwaBatchInstructions(ixs));return tx.serialize({requireAllSignatures:false,verifySignatures:false}).length<=1232;}catch(_){return false;}
}
async function rwaQueueIx(ctx,ixs,label){
  if(ctx.plan){ctx.plan.push({ixs,label});return;}
  return rwaSendIx(ixs,label);
}
function rwaBuildBatches(plan,payer){
  const batches=[];let batch={ixs:[],labels:[]};
  for(const step of plan){
    if(!rwaLineageBatchFits(step.ixs,payer))throw Error(step.label+": transaction exceeds the size limit. No signature was requested.");
    if(!rwaLineageBatchFits([...batch.ixs,...step.ixs],payer)){
      if(batch.ixs.length)batches.push(batch);batch={ixs:[],labels:[]};
    }
    batch.ixs.push(...step.ixs);batch.labels.push(step.label);
  }
  if(batch.ixs.length)batches.push(batch);
  return batches;
}
async function rwaExecutePlan(ctx,status){
  const plan=ctx.plan.slice(),start=ctx.coreStart;
  if(Number.isInteger(start)){
    const core=plan.slice(start),ixs=core.flatMap(s=>s.ixs);
    if(ixs.length&&rwaLineageBatchFits(ixs,ctx.payer))plan.splice(start,core.length,{ixs,label:core.map(s=>s.label).join(' + ')});
  }
  const batches=rwaBuildBatches(plan,ctx.payer);
  status("Preparation complete: "+batches.length+" signature(s) to finish.");
  ctx.receipts=[];
  for(let i=0;i<batches.length;i++){
    if(rwaSolanaWalletAddress!==ctx.payer.toBase58()){const provider=rwaSolanaProvider();if(!confirm("Select the company wallet again "+ctx.payer.toBase58()+" for the next transaction."))throw Error("Operations interrompida.");await provider.disconnect();await provider.connect();if(!provider.publicKey?.equals(ctx.payer))throw Error("Company wallet differs from the expected wallet.");rwaSolanaWalletAddress=provider.publicKey.toBase58();}
    const batch=batches[i],label='Assinatura '+(i+1)+' de '+batches.length+' — '+batch.labels.join(' + ');
    status(label);
    const signature=await rwaSendIx(rwaBatchInstructions(batch.ixs),label);
    ctx.receipts.push({signature,steps:batch.labels});
    status('Confirmada '+(i+1)+' de '+batches.length+'. '+signature);
  }
  return batches.length;
}

 const [s,m,a]=await Promise.all([rwaDecode(series,'Series',183),rwaDecode(record,'RwaMintRecord',113),rwaDecode(authority,'RedemptionAuthority',73)]);
 if(rwaHex(s.slice(8,40))!==sid||rwaHex(m.slice(8,40))!==sid||rwaHex(a.slice(8,40))!==sid||rwaHex(s.slice(40,72))!==rwaHex(actorId)||rwaHex(s.slice(72,104))!==rwaHex(origin)||!rwaPk(m.slice(40,72)).equals(c.mint))throw Error('A emissão anterior não corresponde à origem deste lote.');
 if(s[180]!==3||s[181]!==0)throw Error('Reemissão exige cancelamento confirmado de um RWA não vendido.');
 if(!mint||!mint.owner.equals(c.token)||mint.data.length<82||mint.data[44]!==0||rwaReadU64(mint.data,36)!==0n||new DataView(mint.data.buffer,mint.data.byteOffset,4).getUint32(0,true)!==0)throw Error('A queima anterior ainda não está finalizada ou o mint permite nova emissão.');

async function rwaNextIssuanceIdentity(actorId,initialCreditId,origin){

async function rwaUpdateSourceConfig(button){

  try{

    const config=rwaPda([rwaText('config')]);

    const data=await rwaDecode(await connection.getAccountInfo(config,'confirmed'),'Config',102);
    const admin=new solanaWeb3.PublicKey(data.slice(8,40));
    if(!admin.equals(rwaPk(rwaSolanaWalletAddress)))throw Error("Connect the administrator wallet: "+admin.toBase58());

    const ix=await rwaMarketIx('update_source_config',[

      {pubkey:config,isSigner:false,isWritable:true}
    ],rwaBytes(rwaU64(chain),contract));
    status("Review and sign the update in Phantom…");
    const signature=await rwaSendIx([ix],"E1 origin update");
    const updated=await rwaDecode(await connection.getAccountInfo(config,'confirmed'),'Config',102);
    if(rwaReadU64(updated,72)!==chain||rwaHex(updated.slice(80,100)).toLowerCase()!==rwaHex(contract).toLowerCase())throw Error("Update submitted, but not confirmed by the latest read. Transaction: "+signature);

}

async function rwaCompleteAutomaticLock(record,c,say){

}

async function rwaUnsoldHistory(r){

   const page=await conn.getSignaturesForAddress(address,{limit:1000,...(before?{before}:{})},'finalized');

   if(page.length<1000)break;

   if(balance.mint===r.mint&&(!balance.owner||!allowedOwners.has(balance.owner)))throw Error('Este RWA já passou por outra carteira. Cancelamento bloqueado.');
  }

   if(ix.programId.toBase58()!==c.token.toBase58())continue;

 const count=BigInt(await c.lots.lotCount({blockTag:block.number}));
 if(lotId>count)return {exists:false,balance:0n,count};
 const values=await c.lots.balanceOfBatch([actorId],[lotId],{blockTag:block.number});
 if(!values||values.length!==1)throw Error("Balance query returned invalid data. Issuance stopped.");

}
async function rwaLineageSnapshot(ctx){
 const c=await newLotsContext(false),address=await c.lots.getAddress();
 if(address.toLowerCase()!==rwaHex(ctx.sourceContract).toLowerCase())throw Error("Ethereum contract differs from the requested origin.");
 const raw=await Promise.all(['finalized','latest'].map(tag=>c.provider.send('eth_getBlockByNumber',[tag,false])));
 if(raw.some(b=>!b?.number||!b?.hash))throw Error("Ethereum blocks unavailable.");
 const [block,latest]=raw.map(b=>({number:Number(BigInt(b.number)),hash:b.hash}));
 for(const b of [block,latest]){
  const lot=await c.lots.getLot(ctx.lotId,{blockTag:b.number});
  if(!igualHex(lot.holder,rwaHex(ctx.actorId))||Number(lot.state)!==1)throw Error("A emissão para financiamento exige um lote ACTIVE da empresa, sem pedido de transferência ou gravame.");
 }
 const nodes=[],seen=new Set(),visiting=new Set();
 async function visit(id){id=id.toLowerCase();if(seen.has(id))return;if(visiting.has(id))throw Error("Cycle in E1 lineage.");visiting.add(id);
  const parents=Array.from(await c.lots.getLotParents(id,{blockTag:block.number}),x=>x.toLowerCase());
  if(parents.length>32||new Set(parents).size!==parents.length)throw Error("Invalid E1 parents.");
  for(const parent of parents)await visit(parent);if(nodes.length>=64)throw Error("Lineage limit of 64 lots reached.");
  visiting.delete(id);seen.add(id);nodes.push({id,parents});
 }
 await visit(ctx.lotId);
 for(const b of [block,latest]){const after=await c.provider.send('eth_getBlockByNumber',['0x'+b.number.toString(16),false]);if(after?.hash!==b.hash)throw Error("Ethereum block changed during the query.");}
 return {nodes,blockHash:block.hash};
}
async function rwaLineageSeries(ctx,snapshot){
 const conn=rwaConnection(),rows=await conn.getProgramAccounts(ctx.program,{commitment:'confirmed',filters:[{dataSize:183}]}),out=[];
 for(const r of rows){
  const d=await rwaDecode(r.account,'Series',183),sid=d.slice(8,40);if(!r.pubkey.equals(rwaPda([rwaText('series'),sid])))throw Error("Invalid series PDA.");
  if(![1,2,3].includes(d[180]))throw Error("Unknown economic state.");if(d[180]!==1)continue;
  if(rwaReadU64(d,136)!==ctx.sourceChainId||rwaHex(d.slice(144,164))!==rwaHex(ctx.sourceContract))throw Error("Active series with a different origin: manual migration required.");
  let match=null;
  for(const n of snapshot.nodes){const origin=await rwaSha(rwaBytes(rwaText('ExploreChem/RWAOrigin/v1'),rwaU64(ctx.sourceChainId),ctx.sourceContract,d.slice(40,72),rwaU64(n.id)));if(rwaHex(origin)===rwaHex(d.slice(72,104))){if(match)throw Error("Ambiguous origin.");match=n;}}
  if(!match)throw Error("Could not map active series "+rwaHex(sid)+" to a lot. New issuances blocked.");
  out.push({id:match.id,mask:match.mask,sid:rwaHex(sid),pubkey:r.pubkey,issuer:rwaHex(d.slice(40,72))});
 }
 for(let i=0;i<out.length;i++)for(let j=0;j<i;j++)if(out[i].issuer===out[j].issuer&&((out[i].mask&(1n<<(BigInt(out[j].id)-1n)))||(out[j].mask&(1n<<(BigInt(out[i].id)-1n)))))throw Error("Same-issuer conflict: active RWAs on lots "+out[j].id+' e '+out[i].id+'. Migração interrompida; nenhum token foi cancelado.');
 return out;
}
async function rwaPrepareLineage(ctx,status){
 let registry=await rwaLineageRead();const snapshot=await rwaLineageSnapshot(ctx),m=rwaMeta;
 const manage=[m(ctx.config),m(ctx.attestor,false,true),m(rwaLineagePda(),true)];
 if(!registry||!registry.ready){
  const conn=rwaConnection(),series=await conn.getProgramAccounts(ctx.program,{commitment:'confirmed',filters:[{dataSize:183}]});
  for(const a of series){const d=await rwaDecode(a.account,'Series',183);if(d[180]===1)throw Error("Lineage not enabled while legacy series are active. Authenticated migration required.");}
 }
 if(!registry){await rwaQueueIx(ctx,[await rwaMarketIx('initialize_lineage',[m(ctx.payer,true,true),m(ctx.config),m(ctx.attestor,false,true),m(rwaLineagePda(),true),m(solanaWeb3.SystemProgram.programId)])],"Initialize lineage");registry={ready:false,nodes:[],reservations:[]};}
 for(const n of snapshot.nodes){
  let mask=1n<<BigInt(registry.nodes.findIndex(x=>x.id===n.id)>=0?registry.nodes.findIndex(x=>x.id===n.id):registry.nodes.length);
  for(const p of n.parents){const parent=registry.nodes.find(x=>x.id===p);if(!parent)throw Error("Ancestor missing from registry.");mask|=parent.mask;}
  const old=registry.nodes.find(x=>x.id===n.id);if(old){if(old.mask!==mask)throw Error("Solana lineage differs from Ethereum.");continue;}
  if(registry.nodes.length>=64)throw Error("Solana registry reached the limit of 64 lots.");
  await rwaQueueIx(ctx,[await rwaMarketIx('register_lineage_lot',manage,rwaBytes(rwaHexBytes(n.id,32),rwaU32(n.parents.length),...n.parents.map(x=>rwaHexBytes(x,32))))],"Register E1 lineage");
  registry.nodes.push({id:n.id,mask});
 }
 if(!registry.ready){await rwaQueueIx(ctx,[await rwaMarketIx('enable_lineage',manage,rwaU32(0))],"Activer linhagem");registry.ready=true;}
 const index=registry.nodes.findIndex(n=>n.id===ctx.lotId);if(index<0)throw Error("Lot not registered.");
 for(const r of registry.reservations){if(r.issuer!==rwaHex(ctx.actorId)||r.series===rwaHex(ctx.seriesId))continue;const j=r.node;if((registry.nodes[index].mask&(1n<<BigInt(j)))||(registry.nodes[j].mask&(1n<<BigInt(index))))throw Error("This issuer already has an active RWA in this lineage.");}
}
async function rwaCreateSeriesIfNeeded(ctx,status){

}

 catch(err){f.querySelector('[role=status]').textContent=err.message;}finally{b.disabled=false;}};d.showModal();

function e1OpeningHash(o,address){
 const mass=v=>{if(typeof v!=='string'||!/^\d+$/.test(v)||BigInt(v)<=0n||BigInt(v)>=(1n<<96n))throw Error("Invalid private quantity.");return BigInt(v);};
 checkedHash(o.lotId);checkedHash(o.salt);if(!Array.isArray(o.elements)||o.elements.length>17)throw Error("Invalid private composition.");
 const elements=o.elements.map(x=>({basisHash:checkedHash(x.basisHash).toLowerCase(),massMg:mass(x.massMg)}));
 for(let i=1;i<elements.length;i++)if(elements[i-1].basisHash>=elements[i].basisHash)throw Error("Duplicate or unordered components.");
 const total=mass(o.materialMassMg);if(elements.reduce((a,x)=>a+x.massMg,0n)>total)throw Error("Components exceed lot mass.");
 return ethers.keccak256(ethers.AbiCoder.defaultAbiCoder().encode(['bytes32','uint256','address','tuple(bytes32 lotId,uint96 materialMassMg,tuple(bytes32 basisHash,uint96 massMg)[] elements,bytes32 salt)'],[ethers.id('ExploreChem/LotCommitment/v1'),11155111n,address,{lotId:o.lotId,materialMassMg:total,elements,salt:o.salt}]));
}
async function e1PrivateJson(bucket,path,hash,algorithm='KECCAK-256'){
 const {data,error}=await supabaseClient.storage.from(bucket).createSignedUrl(path,300);if(error)throw error;
 const response=await fetch(data.signedUrl,{cache:'no-store'});if(!response.ok)throw Error("Private document unavailable.");
 const bytes=new Uint8Array(await response.arrayBuffer());
 const actual=algorithm==='SHA-256'?ethers.hexlify(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))):ethers.keccak256(bytes);
 if(!igualHex(actual,hash))throw Error("Document integrity mismatch.");
 return JSON.parse(new TextDecoder().decode(bytes));
}
async function e1ReadLots(c){
 await clientBalanceEnsureSession();const blockTag=await c.provider.getBlockNumber(),address=await c.lots.getAddress();
 const metadata=[];for(let offset=0;;offset+=100){const r=await supabaseClient.from('explorerchem_evidences').select('evidence_id,evidence_hash,hash_algorithm,storage_bucket,storage_path').order('id').range(offset,offset+99);if(r.error)throw r.error;metadata.push(...r.data);if(r.data.length<100)break;}
 const rows=new Map(),warnings=[],registrations=[],mufIds=new Map();
 for(const e of metadata){
  let evidence;try{evidence=await c.registry.getEvidence(e.evidence_id,{blockTag});}catch(err){if(err.code==='CALL_EXCEPTION')continue;throw err;}
  try{
   if(!igualHex(e.evidence_hash,evidence.evidenceHash))throw Error("Indexed hash differs from Registry.");
   const doc=await e1PrivateJson(e.storage_bucket,e.storage_path,evidence.evidenceHash,e.hash_algorithm);
   if(!doc.e1)continue;registrations.push({evidenceId:e.evidence_id,actorId:evidence.actorId,reference:doc.lotReference||doc.lotId||e.evidence_id,createdAt:String(evidence.createdAt),document:doc,outputs:(doc.e1.outputs||[]).map(x=>x.opening.lotId)});
   for(const item of doc.e1.outputs||[]){const opening=item.opening,id=checkedHash(opening.lotId).toLowerCase();
    let lot;try{lot=await c.lots.getLot(id,{blockTag});}catch(err){if(err.code==='CALL_EXCEPTION')continue;throw err;}
    if(!igualHex(e1OpeningHash(opening,address),lot.commitment))throw Error("Private opening does not match the lot commitment.");
    const evidenceId=await c.lots.lotEvidence(id,{blockTag});if(!igualHex(evidenceId,e.evidence_id))throw Error("Lot origin mismatch.");
    const usable=await c.lots.requireUsable.staticCall(id,{blockTag}).then(()=>true,()=>false);
    if(!mufIds.has(evidenceId))mufIds.set(evidenceId,String(await c.registry.latestProofId(evidenceId,1,{blockTag})));
    rows.set(id,{id,lot:{...lot.toObject(),evidenceId,mufProofId:mufIds.get(evidenceId),elementalProofId:lot.proofId},opening,usable,document:doc});
   }
  }catch(err){warnings.push(e.evidence_id+': '+(err.shortMessage||err.message));}
 }
 return {rows:[...rows.values()],warnings,registrations,blockTag};
}

 document.getElementById('clientWorkflowStates')?.closest('details')?.setAttribute('hidden','');
 document.getElementById('clientLiveResultSelect')?.closest('.field')?.setAttribute('hidden','');

 for(const id of ['productLots','productTransfers','productAnalysis','productHistory'])if(!document.getElementById(id)){const n=document.createElement('section');n.id=id;overview.before(n);}
 const lots=document.getElementById('productLots'),history=document.getElementById('productHistory'),transfers=document.getElementById('productTransfers'),analysis=document.getElementById('productAnalysis');
 let transfer=document.getElementById('productTokenization');if(!transfer){transfer=document.createElement('section');transfer.id='productTokenization';}transfers.append(transfer);transfer.hidden=false;
 let stock=document.getElementById('e1RegisteredLots');if(!stock){stock=document.createElement('div');stock.id='e1RegisteredLots';}lots.prepend(stock);
 history.innerHTML='<div id="e1HistoricalLots"></div><div id="e1TransferTimeline"></div><div id="e1RegistrationHistory"></div>';
 const orders=document.createElement('div');orders.id='e1OrdersPanel';transfers.append(orders);
 const element=document.getElementById('productElement');analysis.append(element);element.hidden=false;
 const timeline=document.createElement('div');timeline.id='e1OperationTimeline';analysis.append(timeline);
 const panels={overview:'productOverview',lots:'productLots',transfers:'productTransfers',analysis:'productAnalysis',history:'productHistory',proof:'productProof'},labels={overview:'Overview',lots:'Inventory',transfers:'Transfers',analysis:'Analysis',history:'History',proof:'Proofs'};
 nav.replaceChildren();function activate(key){if(!panels[key])return;for(const [k,id] of Object.entries(panels)){const n=document.getElementById(id);if(n){n.hidden=k!==key;n.classList.remove('client-live-hidden');n.setAttribute('role','tabpanel');n.setAttribute('aria-labelledby','tab-'+k);}}root.dataset.activeTab=key;for(const b of nav.children){b.setAttribute('aria-selected',String(b.dataset.productTab===key));b.tabIndex=b.dataset.productTab===key?0:-1;}}
 for(const key of Object.keys(panels)){const b=document.createElement('button');b.type='button';b.dataset.productTab=key;b.id='tab-'+key;b.setAttribute('role','tab');b.setAttribute('aria-controls',panels[key]);b.textContent=labels[key];b.onclick=()=>activate(key);nav.append(b);}
 nav.onkeydown=e=>{const buttons=[...nav.children],index=buttons.indexOf(document.activeElement);if(index<0||!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();const i=e.key==='Home'?0:e.key==='End'?buttons.length-1:(index+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[i].click();buttons[i].focus();};
 overview.onclick=e=>{const button=e.target.closest('[data-industrial-open]');if(button){activate(button.dataset.industrialOpen);document.getElementById('tab-'+button.dataset.industrialOpen)?.focus();}};activate('overview');
 const actor=document.getElementById('clientLiveActorSelect');actor.onchange=()=>{productTokenizationRender();actorStockRefresh();};document.getElementById('clientLiveRefresh').onclick=()=>{productTokenizationRender();actorStockRefresh();};productTokenizationRender();
}
