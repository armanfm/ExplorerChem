async function clientBalanceLoadActorsAndEvidence(){
  clientBalancePrefillActorsFromMainApp();

  await clientBalanceEnsureSession();

  const cachedActors=clientBalanceActorsFromMainApp();
  let actorData=cachedActors;

  const evidencePromise=supabaseClient.from("explorerchem_evidences")
    .select("id,evidence_id,actor_db_id,state,created_at")
    .order("created_at",{ascending:false})
    .limit(250);

  if(!actorData.length){
    const [actorResponse,evidenceResponse]=await Promise.all([
      supabaseClient.from("explorerchem_actors")
        .select("id,actor_id,display_name,actor_type,country_code")
        .eq("active",true)
        .order("display_name"),
      evidencePromise
    ]);
    if(actorResponse.error) throw actorResponse.error;
    if(evidenceResponse.error) throw evidenceResponse.error;
    actorData=(actorResponse.data||[]).filter(actor=>actor.actor_type!=="LABORATORY");
    CLIENT_BALANCE_EVIDENCE_ROWS=evidenceResponse.data||[];
  }else{
    const evidenceResponse=await evidencePromise;
    if(evidenceResponse.error) throw evidenceResponse.error;
    CLIENT_BALANCE_EVIDENCE_ROWS=evidenceResponse.data||[];
  }

  CLIENT_BALANCE_ACTORS=actorData;
  clientBalanceApplyActorOptions(CLIENT_BALANCE_ACTORS);

  if(!CLIENT_BALANCE_ACTORS.length){
    throw new Error("No active actor is available for the client balance view.");
  }
}
async function clientBalanceLoadSelectedActor(){
  const currentRequest=++CLIENT_BALANCE_REQUEST;
  const actorId=$("#clientLiveActorSelect")?.value;
  const actor=CLIENT_BALANCE_ACTORS.find(item=>item.actor_id===actorId);
  if(!actor) return;

  try{localStorage.setItem("explorechem_client_live_actor",actorId);}catch(_){}

  const refresh=$("#clientLiveRefresh");
  if(refresh) refresh.disabled=true;
  $("#clientLiveDashboard")?.classList.add("client-live-hidden");
  clientBalanceShowMessage(
    "Reading real mass results",
    "Checking MATCHED, VERIFIED and DIVERGENT evidence for "+actor.display_name+"."
  );
  CLIENT_BALANCE_WARNINGS=[];

  const p=await clientBalanceProvider();
  const contract=new ethers.Contract(CLIENT_BALANCE_CONTRACT_ADDRESS,CLIENT_BALANCE_ABI,p);
  const rows=CLIENT_BALANCE_EVIDENCE_ROWS.filter(
    row=>String(row.actor_db_id)===String(actor.id)
  );
  const found=[];
  const seen=new Set();

  for(const row of rows){
    try{
      const evidenceId=String(row.evidence_id||"");
      if(!/^0x[0-9a-f]{64}$/i.test(evidenceId)){
        throw new Error("Invalid evidenceId.");
      }

      const evidence=await contract.getEvidence(evidenceId);
      if(!clientBalanceSameHex(evidence.actorId,actorId)){
        throw new Error("Actor mismatch between Supabase and blockchain.");
      }

      const auditState=clientBalanceEvidenceState(evidence.status);
      if(!["MATCHED","VERIFIED","DIVERGENT"].includes(auditState)) continue;

      let resultId=String(await contract.latestResultIdByEvidence(evidenceId));
      let depth=0;

      while(!CLIENT_BALANCE_ZERO.test(resultId)&&depth<20){
        const key=resultId.toLowerCase();
        if(seen.has(key)) break;
        seen.add(key);

        const chainResult=await contract.getResult(resultId);
        const previousResultId=String(chainResult.previousResultId);

        try{
          if(!clientBalanceSameHex(chainResult.actorId,actorId)||
             !clientBalanceSameHex(chainResult.evidenceId,evidenceId)){
            throw new Error("Result ownership mismatch.");
          }

          const path=
            "mass-results/"+
            evidenceId.slice(2)+"/"+
            resultId.slice(2)+
            ".json";

          const manifest=await clientBalanceSignedJson(path);

          if(!clientBalanceSameHex(manifest.sourceActorId,actorId)||
             !clientBalanceSameHex(manifest.sourceEvidenceId,evidenceId)){
            throw new Error("Private result ownership mismatch.");
          }

          clientBalanceValidatePairs(manifest,auditState);
          const commitments=clientBalanceRecompute(manifest);

          if(!clientBalanceSameHex(commitments.resultId,resultId)||
             !clientBalanceSameHex(commitments.resultHash,chainResult.resultHash)||
             !clientBalanceSameHex(commitments.aggregateInputHash,chainResult.aggregateInputHash)){
            throw new Error("Private commitments do not match the blockchain.");
          }

          if(clientBalanceResultState(chainResult.status)!==
             clientBalanceMassState(manifest.status)){
            throw new Error("Mass verdict does not match the blockchain.");
          }

          if(manifest.schema==="ExploreChem/PrivatePairwiseMass/v1"&&
             Number(manifest.calculationVersion)!==Number(chainResult.calculationVersion)){
            throw new Error("Calculation version does not match the blockchain.");
          }

          if(!await contract.verifyResultHash(resultId,commitments.resultHash)){
            throw new Error("The contract rejected the recomputed hash.");
          }

          found.push({
            actor,
            evidenceId,
            auditState,
            auditedAt:Number(evidence.auditedAt||0),
            resultId,
            resultHash:String(chainResult.resultHash),
            aggregateInputHash:String(chainResult.aggregateInputHash),
            previousResultId,
            calculationVersion:Number(chainResult.calculationVersion),
            createdAt:Number(chainResult.createdAt),
            manifest
          });
        }catch(error){
          CLIENT_BALANCE_WARNINGS.push(
            clientBalanceShort(resultId)+": "+(error?.message||error)
          );
        }

        resultId=previousResultId;
        depth++;
      }
    }catch(error){
      CLIENT_BALANCE_WARNINGS.push(
        clientBalanceShort(row.evidence_id)+": "+(error?.message||error)
      );
    }
  }

  if(currentRequest!==CLIENT_BALANCE_REQUEST) return;

  CLIENT_BALANCE_RESULTS=found.sort((a,b)=>b.createdAt-a.createdAt);
  if(refresh) refresh.disabled=false;

  if(!CLIENT_BALANCE_RESULTS.length){
    const detail=CLIENT_BALANCE_WARNINGS[0]||
      "This actor has no blockchain-selected mass result yet.";
    clientBalanceShowMessage("No real mass balance found",detail,true);
    return;
  }

  clientBalanceHideMessage();
  clientBalancePopulateResultSelector(actorId);
  clientBalanceRenderDashboard();
}

function clientBalanceAllUniquePairs(){
  const map=new Map();
  for(const result of CLIENT_BALANCE_RESULTS){
    for(const pair of result.manifest.massPairs||[]){
      const key=String(
        pair.pairId||pair.fromEvidenceId+":"+pair.toEvidenceId
      ).toLowerCase();
      if(!map.has(key)) map.set(key,{...pair,result});
    }
  }
  return [...map.values()];
}
function clientBalanceSelectedPairs(){

  return (result?.manifest?.massPairs||[]).map(pair=>({...pair,result}));
}
function clientBalanceRoute(pair,actorId){
  if(clientBalanceSameHex(pair.fromActorId,actorId)){
    return "Selected actor → counterparty";
  }
  if(clientBalanceSameHex(pair.toActorId,actorId)){
    return "Counterparty → selected actor";
  }
  return "Correlated handoff";
}

function clientBalanceOpenProof(){
  const selected=clientBalanceSelectedResult();
  if(!selected) return;

  const pairs=clientBalanceSelectedPairs();
  const structuralDivergence=clientBalanceIsStructuralDivergence(
    selected.manifest,
    selected.auditState
  );
  const rows=pairs.map(pair=>
    "<tr><td>"+escaparHtml(pair.lotReference||"—")+"</td>"+
    "<td>"+escaparHtml(clientBalanceKgFromMg(pair.leftMassMg))+"</td>"+
    "<td>"+escaparHtml(clientBalanceKgFromMg(pair.rightMassMg))+"</td>"+
    "<td>"+escaparHtml(clientBalanceKgFromMg(pair.deltaMg))+"</td>"+
    "<td>"+escaparHtml(clientBalanceMassState(pair.status))+"</td></tr>"
  ).join("");
  const emptyPairMessage=structuralDivergence
    ? "Structural divergence recorded on-chain. No pairwise mass comparison applies."
    : "No attested mass pair.";

  const win=window.open("","_blank");
  if(!win) return;

  win.document.write(`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ExploreChem — Mass Balance Proof</title><style>@page{size:A4;margin:15mm}body{font-family:Arial;color:#14252d}button{padding:9px 12px;margin-right:8px}h1{margin-bottom:4px}.sub{color:#52666e}.box{border-left:4px solid #0ea7a0;background:#eef9f6;padding:12px;margin:18px 0}dl{display:grid;grid-template-columns:150px 1fr;border:1px solid #dbe8e7}dt,dd{padding:7px;margin:0;border-bottom:1px solid #dbe8e7;word-break:break-all}dt{font-weight:bold;background:#f3f7f7}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #dbe8e7;padding:7px;text-align:left}.note{font-size:11px;margin-top:18px}@media print{.controls{display:none}}</style></head><body><div class="controls"><button onclick="print()">Print / Save PDF</button><button onclick="close()">Close</button></div><h1>ExploreChem — Verified Mass Balance</h1><p class="sub">Client proof for one selected actor and one blockchain-selected result.</p><div class="box"><b>${escaparHtml(selected.actor.display_name)}</b><br>${escaparHtml(selected.actor.actor_type)} · ${escaparHtml(selected.auditState)}</div><dl><dt>Lot</dt><dd>${escaparHtml(selected.manifest.lotReference||"—")}</dd><dt>Mass verdict</dt><dd>${escaparHtml(clientBalanceMassState(selected.manifest.status))}</dd><dt>Created</dt><dd>${escaparHtml(clientBalanceDateFromUnix(selected.createdAt))}</dd><dt>evidenceId</dt><dd>${escaparHtml(selected.evidenceId)}</dd><dt>resultId</dt><dd>${escaparHtml(selected.resultId)}</dd><dt>resultHash</dt><dd>${escaparHtml(selected.resultHash)}</dd><dt>aggregateInputHash</dt><dd>${escaparHtml(selected.aggregateInputHash)}</dd><dt>Integrity</dt><dd>RECOMPUTED AND VERIFIED</dd></dl><h2>Pairwise mass checks</h2><table><thead><tr><th>Lot</th><th>Origin</th><th>Destination</th><th>Difference</th><th>Verdict</th></tr></thead><tbody>${rows||'<tr><td colspan="5">'+escaparHtml(emptyPairMessage)+'</td></tr>'}</tbody></table><p class="note"><b>Privacy boundary.</b> This proof contains the selected actor's balance and public commitments. Original evidence files and counterparty documents are not exposed.</p></body></html>`);
  win.document.close();

async function clientBalanceRefreshAll(){
  if(CLIENT_BALANCE_INITIALIZING) return;
  CLIENT_BALANCE_INITIALIZING=true;
  try{
    if(!window.supabase||!window.ethers){
      throw new Error("Required Web3 libraries did not load.");
    }
    clientBalanceShowMessage(
      "Loading balance data",
      "Reading authorized actors, evidence records and Ethereum Sepolia results."
    );
    await clientBalanceLoadActorsAndEvidence();
    await clientBalanceLoadSelectedActor();
  }catch(error){
    console.error(error);
    const refresh=$("#clientLiveRefresh");
    if(refresh) refresh.disabled=false;
    clientBalanceShowMessage(
      "Could not load the real balance",
      error?.message||String(error),
      true
    );
  }finally{
    CLIENT_BALANCE_INITIALIZING=false;
  }
}
function clientBalanceBindUi(){
  clientBalancePrefillActorsFromMainApp();
  const actor=$("#clientLiveActorSelect");
  if(actor&&!actor.dataset.bound){
    actor.dataset.bound="1";
    actor.addEventListener("change",()=>{
      CLIENT_BALANCE_RESULTS=[];
      const resultSelect=$("#clientLiveResultSelect");
      if(resultSelect){
        resultSelect.innerHTML='<option>Loading results…</option>';
        resultSelect.disabled=true;
      }
      clientBalanceLoadSelectedActor().catch(error=>
        clientBalanceShowMessage(
          "Could not load this actor",
          error?.message||String(error),
          true
        )
      );
    });
  }

  const result=$("#clientLiveResultSelect");
  if(result&&!result.dataset.bound){
    result.dataset.bound="1";
    result.addEventListener("change",()=>{
      const actorId=$("#clientLiveActorSelect")?.value||"";
      try{
        localStorage.setItem(
          "explorechem_client_live_result_"+actorId.toLowerCase(),
          result.value
        );
      }catch(_){}
      clientBalanceRenderDashboard();
    });
  }

  const refresh=$("#clientLiveRefresh");
  if(refresh&&!refresh.dataset.bound){
    refresh.dataset.bound="1";
    refresh.addEventListener("click",()=>clientBalanceRefreshAll());
  }

  const proof=$("#clientProofButton");
  if(proof&&!proof.dataset.bound){
    proof.dataset.bound="1";
    proof.addEventListener("click",clientBalanceOpenProof);
  }
}

function translateUiText(value){
  let s=String(value??"");
  for(const [from,to] of UI_EN_PHRASES){
    if(!from) continue;
    // Short tokens such as "De" are translated only as standalone text to avoid corrupting words.
    if(from.length<=4 && !from.includes(" ")){
      if(s.trim()===from){
        const lead=s.match(/^\s*/)?.[0]||"", tail=s.match(/\s*$/)?.[0]||"";
        s=lead+to+tail;
      }
    } else {
      s=s.split(from).join(to);
    }
  }
  for(const [from,to] of Object.entries(UI_EN_WORDS)){
    const esc=from.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    s=s.replace(new RegExp("\\b"+esc+"\\b","g"),to);
  }
  s=s.replace(/(\d+)\s+de\s+(\d+)/g,"$1 of $2");
  s=s.replace(/%\s+da\s+entrada/g,"% of input");
  return s;
}
function shouldKeepUiNode(node){
  const p=node.parentElement;
  if(!p) return true;
  if(["SCRIPT","STYLE","CODE","PRE"].includes(p.tagName)) return true;
  if(p.closest(".mono,.hash,code,pre")) return true;
  const raw=String(node.nodeValue||"").trim();
  if(!raw) return true;
  if(/0x[0-9a-f]{8,}/i.test(raw)) return true;
  if(/\.(json|pdf|csv|xlsx|docx|png|jpg|jpeg|webp)$/i.test(raw)) return true;
  if(/\b(Ltda\.|S\.A\.)\b/.test(raw)) return true;
  return false;
}
function translateUiTree(root){
  const doc=root?.nodeType===9?root:(root?.ownerDocument||document);
  const scope=root?.nodeType===9?root.documentElement:root;
  if(!scope) return;
  // Preserve functional values of options that originally used their visible text as value.
  scope.querySelectorAll?.("option").forEach(o=>{
    if(!o.hasAttribute("value")) o.setAttribute("value",o.textContent.trim());
  });
  scope.querySelectorAll?.("#papeis .chip").forEach(c=>{
    if(!c.dataset.i18nValue) c.dataset.i18nValue=c.textContent.trim();
  });
  const NF=doc.defaultView?.NodeFilter||NodeFilter;
  const walker=doc.createTreeWalker(scope,NF.SHOW_TEXT);
  const nodes=[]; let n;
  while((n=walker.nextNode())) nodes.push(n);
  nodes.forEach(node=>{if(!shouldKeepUiNode(node)) node.nodeValue=translateUiText(node.nodeValue);});
  scope.querySelectorAll?.("[placeholder],[title],[aria-label],[alt]").forEach(el=>{
    for(const attr of ["placeholder","title","aria-label","alt"]){
      if(el.hasAttribute(attr)) el.setAttribute(attr,translateUiText(el.getAttribute(attr)));
    }
  });
}

function render(){

  $("#session").innerHTML='<span class="session-avatar">'+sessao.iniciais+'</span>'+
    '<span class="session-copy"><b>'+sessao.nome+'</b><span>'+sessao.acesso+'</span></span>';
  renderWallet();
  const roleSelector=$("#roleSelector");

    roleSelector.value=role;

      const next=this.value;
      try{sessionStorage.setItem("explorechem_force_top","1");}catch(_){}
      window.scrollTo(0,0);
      window.location.href=window.location.pathname+(next==="op"?"":"?role="+encodeURIComponent(next));
    };
  }

  requestAnimationFrame(()=>window.scrollTo(0,0));
  renderCharts();

  const ps=$("#papeis");
  if(ps) ps.querySelectorAll(".chip").forEach(c=>
    c.onclick=function(){ps.querySelectorAll(".chip").forEach(x=>
      x.setAttribute("aria-pressed",String(x===c)));});

  /* Aplica bloqueio */
  aplicarSomenteLeitura();
  translateUiTree(document);

  if(role==="cli"&&page==="dashboard"){
    clientBalanceBindUi();
    queueMicrotask(()=>clientBalanceRefreshAll());
  }

  const bind=function(sel,msg){const el=$(sel);if(el)el.onclick=function(e){e.preventDefault();toast(msg);};};
  const bindOnchain=function(sel){const el=$(sel);if(el)el.onclick=function(e){
    e.preventDefault(); enviarEvidenciaReal(el);
  };};

  const salvarAtor=$("#salvarAtor");
  if(salvarAtor) salvarAtor.onclick=async function(e){
    e.preventDefault();
    if(escopoAtor().somenteLeitura){toast("Perfil somente leitura nesta visão.");return;}
    if(!walletAddress){toast("Conecte uma carteira autorizada antes de continuar.");return;}
    const chainAtual=await refreshWalletChain();
    if(chainAtual!=="0xaa36a7"){toast("Troque a carteira para a rede Sepolia antes de assinar.");return;}
    const nome=$("#rs")?.value.trim(), papelEl=$("#papeis .chip[aria-pressed=\"true\"]"), papel=papelEl?(papelEl.dataset.i18nValue||papelEl.textContent.trim()):undefined;
    if(!nome||!papel){toast("Informe a razão social e selecione um papel.");return;}
    const novo={id:$("#actorId")?.value||novoActorId(),nome,papel,praca:$("#pr")?.value||"—",carteiras:1,evid:0,desde:new Date().toLocaleDateString("en-US")};
    if(ATORES.some(a=>a.id===novo.id)){toast("Identificador já usado. Gere outro antes de cadastrar.");return;}
    salvarAtor.disabled=true; salvarAtor.textContent="Signing…";
    const actorType={"Minerador":"MINER","Transportadora":"CARRIER","Laboratório":"LABORATORY","Purificador":"REFINER","Reciclador":"RECYCLER","Fabricante":"MANUFACTURER"}[papel]||"OTHER";
    try{
      if(!window.ethers) throw new Error("Biblioteca Web3 não carregou");
      const provider=new ethers.BrowserProvider(getWalletProvider());
      const signer=await provider.getSigner();
      const abi=["function registerActor(bytes32 actorId, address controller) external"];
      const contract=new ethers.Contract(EXPLORERCHEM_CONTRACT_ADDRESS,abi,signer);
      const tx=await contract.registerActor(novo.id,walletAddress);
      const receipt=await tx.wait();
      const {data:row,error}=await supabaseClient.from("explorerchem_actors").insert({
        actor_id:novo.id, display_name:nome, actor_type:actorType, country_code:($("#pa")?.value||"BR").slice(0,2).toUpperCase(),
        active:true, onchain_registered_at:new Date().toISOString(), onchain_registration_tx:receipt.hash
      }).select("id,actor_id,display_name,actor_type").single();
      if(error) throw new Error("Blockchain confirmada, mas o Supabase recusou o cadastro: "+error.message);
      novo.dbId=row.id;
      ATOR_ATIVO=null;
      persistirAtorAtivo();
      await carregarAtores();
      toast("Ator cadastrado. Selecione-o em “Navegar como ator” para testar seu perfil.");
    }catch(error){
      console.error(error); toast(error.message||"Não foi possível concluir o cadastro.");

  const bindFile=function(inputSel,infoSel){const input=$(inputSel),info=$(infoSel);if(input&&info)input.onchange=async function(){
    const file=input.files&&input.files[0];
    if(!file){info.innerHTML="";return;}

      if(input.files&&input.files[0]===file) { info.innerHTML='<div class="filerow"><b>'+escaparHtml(file.name)+'</b><span>'+Math.ceil(file.size/1024)+' KB · SHA-256 <span class="mono">'+hash.slice(0,18)+'…</span></span></div>'; translateUiTree(info); }
    }catch(error){info.innerHTML='<div class="filerow"><b>'+escaparHtml(file.name)+'</b><span>Hash will be calculated on submission</span></div>';translateUiTree(info);}
  };};
  bindFile("#arquivo","#arquivoInfo");
  bindFile("#arquivoTransporte","#arquivoTransporteInfo");
  bindFile("#arquivoLaudo","#arquivoLaudoInfo");

  const updateDifference=()=>{if(!collected||!delivered||!difference)return;const a=parseMass(collected.value),b=parseMass(delivered.value);difference.innerHTML=Number.isFinite(a)&&Number.isFinite(b)?'<b>Custody difference</b><span>'+Math.max(0,a-b).toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:3})+' kg</span>':'<b>Custody difference</b><span>Enter both masses</span>';translateUiTree(difference);};

    toast("Exibindo laudos pendentes (simulação).");
  };

  document.querySelectorAll("[data-print-cre-proof]").forEach(b=>b.onclick=function(e){
    e.preventDefault();
    abrirComprovanteCreTee();
  });

  document.querySelectorAll("[data-download-evidence]").forEach(b=>b.onclick=async function(e){
    e.preventDefault();
    const id=this.dataset.downloadEvidence;
    const item=EVIDENCIAS_REMOTAS.find(x=>x.evidenceId===id||x.id===id);
    if(!item){toast("Documento não encontrado nesta sessão.");return;}
    await abrirDocumento(item);
  });
  document.querySelectorAll("[data-download-report]").forEach(b=>b.onclick=async function(e){
    e.preventDefault();
    const report=relatorioClienteAtual();
    if(!report){toast("O relatório oficial ainda não foi disponibilizado pelo CRE/TEE.");return;}
    await abrirDocumento({storageBucket:report.storageBucket||report.storage_bucket||REPORT_BUCKET,storagePath:report.storagePath||report.storage_path});
  });
  document.querySelectorAll("[data-download-snapshot]").forEach(b=>b.onclick=function(e){
    e.preventDefault(); baixarSnapshotBalanco();
  });
  document.querySelectorAll(".dl").forEach(b=>{
    if(b.dataset.downloadEvidence||b.dataset.downloadReport||b.dataset.downloadSnapshot)return;
    b.onclick=function(){toast("Arquivo gerado. Recalcule o hash e compare com a transação.");};
  });
}

$("#home").onclick=function(){page=NAVS[role][0][0];window.scrollTo(0,0);render();};

carregarAtorAtivo();
render();
restoreWallet();
try{
  if(sessionStorage.getItem("explorechem_force_top")==="1"){
    sessionStorage.removeItem("explorechem_force_top");
    window.scrollTo(0,0);
    setTimeout(()=>window.scrollTo(0,0),0);
    setTimeout(()=>window.scrollTo(0,0),120);
  }
}catch(_){}

carregarAtores().then(()=>carregarDocumentosRemotos());

const walletProvider=getWalletProvider();
if(walletProvider&&typeof walletProvider.on==="function"){
  walletProvider.on("accountsChanged",contas=>{walletAddress=contas[0]||"";if(!walletAddress)walletChainId="";renderWallet();});
  walletProvider.on("chainChanged",chainId=>{walletChainId=chainId;renderWallet();});
}
</script>
