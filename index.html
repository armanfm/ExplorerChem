        "<div class=\"client-balance-metric\"><span>Balance verdict</span><b>"+demo.status+"</b><small>Verified physical handoff</small></div>"+
      '</div>'
    : "<div class=\"panel pad\" style=\"margin:14px 0\"><h3>This balance does not have loaded values yet</h3><p class=\"sub\" style=\"margin:0\">The result was selected from history, but its mass values must come from the specific result produced by CRE/TEE. The system does not reuse values from another balance.</p></div>";

  const balanceBlock=demo

      '<div class="balance-line" style="grid-template-columns:1fr auto 1fr auto 1fr">'+

        '<div class="balance-item"><span>'+escaparHtml(demo.destinoLabel)+'</span><b>'+numero(demo.confirmada)+' kg</b></div><div class="balance-op">=</div>'+
        "<div class=\"balance-item balance-result\" style=\"color:var(--ok);background:linear-gradient(135deg,var(--ok-soft),var(--panel));border-color:color-mix(in srgb,var(--ok) 22%,var(--rule))\"><span>Difference</span><b>"+numero(demo.diferenca)+' kg</b></div>'+
      '</div></section>'
    : '';

  return "<div class=\"crumb\">Client · my balance</div>"+
    "<div class=\"headrow\"><div class=\"grow\"><h1>My balance</h1><p class=\"sub\">Choose the actor first, then choose one of that actor’s balances. The most recent result is selected automatically.</p></div></div>"+
    filtrosClienteHtml(ator,ev)+
    '<div class="client-result-hero">'+
      "<section class=\"panel client-order\"><div class=\"client-kicker\">SELECTED BALANCE · "+escaparHtml(String(pedido))+'</div><h1>'+escaparHtml(ator.nome)+'</h1>'+
      "<p class=\"sub\">You are viewing only this authorized result. Changing the second selector switches the balance without mixing requests.</p><div class=\"client-order-grid\">"+
        '<div><span>Ator</span><b>'+escaparHtml(ator.nome)+'</b></div>'+
        "<div><span>Role</span><b>"+escaparHtml(ator.papel||"Ator")+'</b></div>'+
        "<div><span>Lot</span><b class=\"mono\">"+escaparHtml(demo?.lotId||"—")+'</b></div>'+
        "<div><span>Result date</span><b>"+escaparHtml(dataCurtaCliente(ev?.submittedAt))+'</b></div>'+
      '</div></section>'+
      "<aside class=\"panel client-final\"><div><span class=\"eyebrow\">CURRENT STATE</span><div class=\"final-status\">"+escaparHtml(estadoFinal)+'</div><div class="final-copy">'+(demo?"The selected balance is available for review. The audit will add a second verification layer when it is completed.":"This record can already be selected from history, but its specific mass result still needs to be loaded.")+'</div></div>'+
      '<div class="final-foot"><span>Blockchain · '+match+'</span><span>Auditoria · '+audit+'</span></div></aside>'+
    '</div>'+cards+balanceBlock+
    '<div class="client-assurance">'+
      '<div class="client-assurance-card '+(demo?'ok':'pending')+'"><span class="step">1 · CRE/TEE</span><b>'+(demo?demo.status:'PENDING')+'</b><p>'+(demo?"Bilateral mass comparison completed for this balance.":"Waiting for the specific mass result for this balance.")+'</p></div>'+
      '<div class="client-assurance-card '+(match==='MATCHED'?'ok':'pending')+'"><span class="step">2 · Blockchain</span><b>'+match+'</b><p>'+(match==='MATCHED'?"The selected evidence is MATCHED.":"The evidence is still PENDING in this read.")+'</p></div>'+
      '<div class="client-assurance-card '+(audit==='VERIFIED'?'ok':(audit==='DIVERGENT'?'bad':'pending'))+'"><span class="step">3 · Auditoria</span><b>'+audit+'</b><p>'+(audit==='VERIFIED'?"The auditor confirmed this balance.":(audit==='DIVERGENT'?"The auditor found a divergence and the result requires review.":"When the auditor workflow completes, only this selected balance changes to VERIFIED or DIVERGENT."))+'</p></div>'+
    '</div>'+
    "<details class=\"panel client-proof\"><summary><span>Technical proof <span class=\"sm\">identifiers and hashes for the selected balance</span></span></summary><div class=\"client-proof-body\"><dl class=\"kv\">"+
      '<dt>actorId</dt><dd class="mono">'+val(ator.id)+'</dd>'+
      '<dt>evidenceId</dt><dd class="mono">'+val(ev?.evidenceId)+'</dd>'+
      '<dt>evidenceHash</dt><dd class="hash">'+val(ev?.evidenceHash)+'</dd>'+
      "<dt>Evidence state</dt><dd>"+vtag(ev?.state||"PENDING")+'</dd>'+
      "<dt>MATCH transaction</dt><dd class=\"hash\">"+val(ev?.matchTxHash)+'</dd>'+

    "</dl><div class=\"actions\" style=\"margin-top:16px\"><button class=\"btn ghost\" data-print-cre-proof>CRE/TEE proof</button></div></div></details>";
}

function clientBalanceStableValue(value){
  if(Array.isArray(value)) return value.map(clientBalanceStableValue);
  if(value!==null&&typeof value==="object"){
    return Object.fromEntries(
      Object.keys(value).sort().map(key=>[key,clientBalanceStableValue(value[key])])
    );
  }
  return value;
}
function clientBalanceStableJson(value){

function clientBalanceHashStable(value){

function clientBalanceShort(value){

function clientBalanceKgFromMg(value){
  if(value===null||value===undefined) return "Not attested";

    ? n.toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:6})+" kg"
    : String(value)+" mg";

function clientBalanceRecompute(manifest){
  const massResultSchema=String(manifest?.schema||"").trim();
  if(massResultSchema==="ExploreChem/PrivateDocumentMass/v2"||
     massResultSchema.endsWith("/PrivateDocumentMass/v2")){
    const result={
      schema:"ExploreChem/DocumentMassResult/v2",
      calculationVersion:manifest.calculationVersion,
      focusActorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      lotReference:manifest.lotReference,
      evidenceIds:manifest.evidenceIds,
      correlationEdges:manifest.correlationEdges,
      massPairs:manifest.massPairs,
      elementalCalculations:manifest.elementalCalculations,
      status:manifest.status
    };
    const aggregateInputHash=clientBalanceHashStable({
      domain:"ExploreChem/DocumentMassInput/v2",
      sourceEvidenceHash:manifest.sourceEvidenceHash,
      calculationVersion:manifest.calculationVersion,
      actorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      evidenceIds:manifest.evidenceIds,
      correlationEdges:manifest.correlationEdges
    });
    const resultHash=clientBalanceHashStable({
      domain:"ExploreChem/PairwiseMass/v1",
      calculationVersion:manifest.calculationVersion,
      actorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      result
    });
    const resultId=clientBalanceHashStable({
      domain:"ExploreChem/PairwiseMassResultId/v1",
      calculationVersion:manifest.calculationVersion,
      actorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      resultHash
    });
    return {aggregateInputHash,resultHash,resultId};
  }

  if(massResultSchema==="ExploreChem/PrivatePairwiseMass/v1"){
    const result={
      schema:"ExploreChem/PairwiseMassResult/v1",
      calculationVersion:manifest.calculationVersion,
      focusActorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      lotReference:manifest.lotReference,
      evidenceIds:manifest.evidenceIds,
      correlationEdges:manifest.correlationEdges,
      massPairs:manifest.massPairs,
      ...(manifest.elementalCalculations===undefined?{}:{elementalCalculations:manifest.elementalCalculations}),
      status:manifest.status
    };
    const aggregateInputHash=clientBalanceHashStable({
      domain:"ExploreChem/PairwiseMassInput/v1",
      calculationVersion:manifest.calculationVersion,
      actorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      evidenceIds:manifest.evidenceIds,
      correlationEdges:manifest.correlationEdges
    });
    const resultHash=clientBalanceHashStable({
      domain:"ExploreChem/PairwiseMass/v1",
      calculationVersion:manifest.calculationVersion,
      actorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      result
    });
    const resultId=clientBalanceHashStable({
      domain:"ExploreChem/PairwiseMassResultId/v1",
      calculationVersion:manifest.calculationVersion,
      actorId:manifest.sourceActorId,
      focusEvidenceId:manifest.sourceEvidenceId,
      resultHash
    });
    return {aggregateInputHash,resultHash,resultId};
  }

  if(massResultSchema==="ExploreChem/PrivateLotCorrelatedPairwiseMass/v4"){
    const result={
      schema:"ExploreChem/LotCorrelatedPairwiseMassResult/v4",
      focusEvidenceId:manifest.sourceEvidenceId,
      lotReference:manifest.lotReference,
      evidenceIds:manifest.evidenceIds,
      correlationEdges:manifest.correlationEdges,
      massPairs:manifest.massPairs,
      status:manifest.status
    };
    const relationFingerprint=clientBalanceHashStable({
      domain:"ExploreChem/LotRelationFingerprint/v4",
      lotReference:result.lotReference,
      evidenceIds:result.evidenceIds,
      correlationEdges:result.correlationEdges,
      massPairs:result.massPairs
    });
    const aggregateInputHash=clientBalanceHashStable({
      domain:"ExploreChem/LotComponentInput/v4",
      salt:manifest.salt,
      focusEvidenceId:manifest.sourceEvidenceId,
      lotReference:result.lotReference,
      evidenceIds:result.evidenceIds,
      correlationEdges:result.correlationEdges
    });
    const resultHash=clientBalanceHashStable({
      domain:"ExploreChem/LotComponentResult/v4",
      salt:manifest.salt,
      relationFingerprint,
      result
    });
    const resultId=clientBalanceHashText(
      "ExploreChem/LotComponentResultId/v4|"+
      manifest.sourceActorId+"|"+
      manifest.sourceEvidenceId+"|"+
      relationFingerprint+"|"+
      resultHash
    );
    return {aggregateInputHash,resultHash,resultId};
  }

  throw new Error("Unsupported mass-result schema: "+(massResultSchema||"missing"));
}
function clientBalanceIsStructuralDivergence(manifest,auditState){
  return Array.isArray(manifest?.massPairs)&&
    manifest.massPairs.length===0&&
    manifest.status==="DIVERGENTE"&&
    auditState==="DIVERGENT";
}
function clientBalanceValidatePairs(manifest,auditState){
  if(!Array.isArray(manifest.massPairs)){
    throw new Error("Mass-pair collection is missing or invalid.");
  }

  const documentMass=
    String(manifest?.schema||"").trim().endsWith("/PrivateDocumentMass/v2");

  /*
   * A structural divergence is intentionally produced without a mass pair.
   * It is accepted only when the private manifest declares DIVERGENTE and the
   * evidence itself is already DIVERGENT on-chain. Result commitments and the
   * blockchain result status are still independently checked immediately after.
   */
  if(clientBalanceIsStructuralDivergence(manifest,auditState)) return;

  const statuses=[];
  for(const pair of manifest.massPairs){
    const attested=
      pair.leftMassMg!==null&&pair.leftMassMg!==undefined&&
      pair.rightMassMg!==null&&pair.rightMassMg!==undefined;
    const expected=
      documentMass&&pair.relationType==="DOCUMENT_MASS_BALANCE"
        ? "NAO_ATESTADO"
        : attested
          ? (BigInt(pair.leftMassMg)===BigInt(pair.rightMassMg)?"CONFORME":"DIVERGENTE")
          : "NAO_ATESTADO";
    const delta=attested
      ? (BigInt(pair.leftMassMg)-BigInt(pair.rightMassMg)).toString()
      : null;
    if(pair.status!==expected||((pair.deltaMg??null)!==delta)){
      throw new Error("Pairwise mass values are not reproducible.");
    }
    statuses.push(expected);
  }
  const overall=documentMass
    ? "NAO_ATESTADO"
    : statuses.includes("DIVERGENTE")
      ? "DIVERGENTE"
      : (statuses.length&&statuses.every(x=>x==="CONFORME")?"CONFORME":"NAO_ATESTADO");
  if(manifest.status!==overall){
    throw new Error("Overall mass verdict is not reproducible.");
  }
}

async function clientBalanceReadMuf(path,proof,evidence,evidenceActorId){
  await clientBalanceEnsureSession();
  const signed=await supabaseClient.storage.from(EVIDENCE_BUCKET).createSignedUrl(path,900);
  if(signed.error) throw signed.error;
  const response=await fetch(signed.data.signedUrl,{cache:'no-store'});
  if(!response.ok) throw new Error('MUF JSON: HTTP '+response.status);
  const bytes=new Uint8Array(await response.arrayBuffer());
  if(!clientBalanceSameHex(ethers.keccak256(bytes),proof.committedHash)) throw new Error('MUF JSON hash differs from the on-chain commitment.');
  const doc=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
  const r=doc.result;
  if(!['ExploreChem/PrivateMUFResult/v1','ExploreChem/PrivateMUFResult/v2'].includes(doc.schema)||!r||r.schema!=='ExploreChem/MUFResult/v1'||doc.calculationVersion!==1||r.calculationVersion!==1) throw new Error('Unsupported MUF result schema.');
  if(!clientBalanceSameHex(r.actorId,evidenceActorId)||!clientBalanceSameHex(r.evidenceId,evidence.evidenceId)||!clientBalanceSameHex(r.expectedEvidenceHash,evidence.evidenceHash)) throw new Error('MUF result ownership/commitment mismatch.');
  if(r.status!==clientProofStatus(proof.status)||Number(r.statusCode)!==Number(proof.status)) throw new Error('MUF verdict differs from the on-chain proof.');
  if(!clientBalanceSameHex(clientBalanceHashStable(doc.methodology),proof.methodologyHash)) throw new Error('MUF methodology hash mismatch.');
  const inputHash=clientBalanceHashStable({...(doc.schema==='ExploreChem/PrivateMUFResult/v2'?{committedHash:proof.committedHash}:{}),domain:'ExploreChem/MUFInputCommitment/v1',evidenceId:evidence.evidenceId,expectedEvidenceHash:evidence.evidenceHash,indexedEvidenceHash:r.indexedEvidenceHash,downloadedDocumentHash:r.downloadedDocumentHash,calculationInputs:r.calculation});
  if(!clientBalanceSameHex(inputHash,proof.inputCommitmentHash)) throw new Error('MUF input commitment mismatch.');
  const c=r.calculation;
  if(c&&c.signedMufMg!=null){
    const input=BigInt(c.referenceInputMassMg),output=BigInt(c.accountedOutputMassMg),delta=input-output,absolute=delta<0n?-delta:delta;
    if(delta!==BigInt(c.signedMufMg)||absolute!==BigInt(c.absoluteMufMg)) throw new Error('MUF arithmetic mismatch.');
    if(input>0n&&BigInt(c.absoluteMufPercentScaled6)!==(absolute*100000000n+input/2n)/input) throw new Error('MUF percentage mismatch.');
  }
  return doc;
}

function clientConsolidationCalculate(rows){
  const groups=new Map(),elements=new Map();
  let massCount=0,elementCount=0,yieldCount=0;
  for(const row of rows){
    const c=row.jsonVerified?row.muf?.calculation:null;
    const e=row.elementalVerified?row.elementalResult?.calculation:null;
    const valid=v=>typeof v==='string'&&/^\d+$/.test(v);
    if(c&&valid(c.referenceInputMassMg)&&valid(c.accountedOutputMassMg)){
      massCount++;
      const type=c.actorType||'UNKNOWN';
      const g=groups.get(type)||{type,input:0n,output:0n,count:0};
      g.input+=BigInt(c.referenceInputMassMg);g.output+=BigInt(c.accountedOutputMassMg);g.count++;
      groups.set(type,g);
    }
    if(e&&valid(e.availableElementMassMg)&&valid(e.accountedElementMassMg)){
      elementCount++;
      // Never combine different elements or stages into one apparent stock balance.
      const key=(c?.actorType||'UNKNOWN')+' / '+e.element;
      const g=elements.get(key)||{key,input:0n,output:0n,count:0,process:0n,product:0n,elementProcess:0n,elementProduct:0n,yieldCount:0};
      g.input+=BigInt(e.availableElementMassMg);g.output+=BigInt(e.accountedElementMassMg);g.count++;
      const streams=e.streams||[];
      if(c&&c.actorType!=='CARRIER'&&clientBalanceSameHex(row.resultId,row.elementalResult.mufProofId)&&streams.length&&streams.every(x=>valid(x.dryMassMg)&&valid(x.containedElementMassMg))){
        const available=streams.filter(x=>x.side==='AVAILABLE');
        const accounted=streams.filter(x=>x.side==='ACCOUNTED');
        const products=accounted.filter(x=>x.streamType==='PRODUCT');
        const closing=accounted.filter(x=>x.streamType==='CLOSING_INVENTORY');
        const sum=(a,k)=>a.reduce((n,x)=>n+BigInt(x[k]),0n);
        const dryIn=sum(available,'dryMassMg'),dryOut=sum(accounted,'dryMassMg');
        const process=dryIn-sum(closing,'dryMassMg');
        const elementProcess=BigInt(e.availableElementMassMg)-sum(closing,'containedElementMassMg');
        if(products.length&&available.length&&available.every(x=>['INPUT','OPENING_INVENTORY'].includes(x.streamType))&&valid(c.referenceInputMassMg)&&valid(c.accountedOutputMassMg)&&dryIn===BigInt(c.referenceInputMassMg)&&dryOut===BigInt(c.accountedOutputMassMg)&&process>0n&&elementProcess>0n){
          g.process+=process;g.product+=sum(products,'dryMassMg');g.elementProcess+=elementProcess;g.elementProduct+=sum(products,'containedElementMassMg');g.yieldCount++;yieldCount++;
        }
      }
      elements.set(key,g);
    }
  }
  return {count:rows.length,massCount,elementCount,yieldCount,groups:[...groups.values()],elements:[...elements.values()]};
}

  const ratio=(n,d)=>d>0n?((n*100000000n+d/2n)/d).toString():null;
  const calculate=items=>{
    const a=clientConsolidationCalculate(items);
    return {...a,groups:a.groups.map(g=>({...g,signedDifferenceMg:g.input-g.output,outputInputPercentScaled6:ratio(g.output,g.input)})),elements:a.elements.map(g=>({...g,signedDifferenceMg:g.input-g.output,recoveryPercentScaled6:ratio(g.output,g.input),yieldPercentScaled6:g.yieldCount?ratio(g.product,g.process):null,productRecoveryPercentScaled6:g.yieldCount?ratio(g.elementProduct,g.elementProcess):null}))};
  };
  const data={schema:'ExploreChem/ConsolidationExport/v1',exportedAt:new Date().toISOString(),execution:'LOCAL_OFFCHAIN',...context,
    methodology:{version:1,massUnit:'mg',percentScale:6,integerEncoding:'decimal strings',rounding:'HALF_UP_INTEGER',formulas:{multiStream:'sum inputs and accounted outputs separately by actorType and element',difference:'input - output',outputInputPercent:'100 * sum(output) / sum(input)',yieldPercent:'100 * sum(PRODUCT dry mass) / sum(available dry mass - closing inventory dry mass)',productRecoveryPercent:'100 * sum(PRODUCT element mass) / sum(available element mass - closing inventory element mass)'},rules:['Only verified JSONs supply calculation values','COMPLIANT subset requires MUF status 2 and ELEMENTAL status 2','Missing calculations remain in coverage, never become zero','YIELD requires a non-carrier process, PRODUCT streams, matching MUF dependency and matching mass totals','Totals are sums of selected operations, not inventory; physical duplicate exclusion is manual'],calculatorSource:clientConsolidationCalculate.toString()},
    selection:rows.map(r=>({evidenceId:r.evidenceId,checked:!!r.checked,included:included.has(r.evidenceId.toLowerCase()),exclusionReason:included.has(r.evidenceId.toLowerCase())?null:!r.checked?'UNCHECKED':'OUTSIDE_DATE_FILTER'})),
    operations:selected.map(r=>{const st=r.workflowState||r.state;return {evidenceId:r.evidenceId,evidenceHash:r.evidenceHash,actorId:r.evidenceActor?.actor_id||null,lotReference:r.manifest?.lotReference||null,createdAt:r.createdAt,
      muf:{proofId:r.resultId,committedHash:r.resultHash,inputCommitmentHash:r.aggregateInputHash,methodologyHash:r.methodologyHash,previousProofId:r.previousResultId,revision:r.calculationVersion,status:Number(st.mufStatus),jsonVerified:!!r.jsonVerified,privateDocument:r.jsonVerified?r.privateDocument:null,result:r.jsonVerified?r.muf:null},
      elemental:{proofId:r.elementalProofId||null,committedHash:r.elementalHash||String(st.elementalHash||''),proof:r.elementalProofMetadata||null,status:Number(st.elementalStatus),jsonVerified:!!r.elementalVerified,error:r.elementalError||null,privateJsonText:r.elementalVerified?r.elementalJsonText:null,result:r.elementalVerified?r.elementalResult:null}};}),
    results:{total:calculate(selected),compliant:calculate(compliant)},
    verification:'Check proof references on Sepolia and file hashes before trusting the embedded inputs. Verification flags record this browser session. This export is not signed or anchored on-chain.'};
  return JSON.parse(JSON.stringify(data,(_,v)=>typeof v==='bigint'?v.toString():v));
}

function clientConsolidationTimeline(rows,key,metric,cumulative){
  const elementMetric=['elementInput','elementOutput','elementDifference','recovery','yield','productRecovery'].includes(metric);
  const ordered=rows.map(row=>{
    const c=row.jsonVerified?row.muf?.calculation:null;
    const e=row.elementalVerified?row.elementalResult?.calculation:null;
    const group=elementMetric?(c?.actorType||'UNKNOWN')+' / '+(e?.element||'UNKNOWN'):c?.actorType||'UNKNOWN';
    return {row,group,unknownElement:elementMetric&&!e&&key.startsWith((c?.actorType||'UNKNOWN')+' / '),time:elementMetric?row.elementalCreatedAt||row.createdAt||row.evidenceCreatedAt:row.createdAt||row.evidenceCreatedAt};
  }).filter(x=>(x.group===key||x.unknownElement)&&Number.isFinite(Number(x.time))&&Number(x.time)>0).sort((a,b)=>Number(a.time)-Number(b.time)||a.row.evidenceId.localeCompare(b.row.evidenceId));
  const total=[],compliant=[];let all=[],approved=[];
  const value=items=>{
    const a=clientConsolidationCalculate(items),g=elementMetric?a.elements.find(x=>x.key===key):a.groups.find(x=>x.type===key);
    if(!g)return null;
    if(['yield','productRecovery'].includes(metric)&&!g.yieldCount)return null;
    if(metric==='yield')return Number(g.product*100000000n/g.process)/1e6;
    if(metric==='productRecovery')return Number(g.elementProduct*100000000n/g.elementProcess)/1e6;
    if(metric==='recovery'||metric==='ratio')return g.input>0n?Number(g.output*100000000n/g.input)/1e6:null;
    if(metric==='input'||metric==='elementInput')return Number(g.input)/1e6;
    if(metric==='output'||metric==='elementOutput')return Number(g.output)/1e6;
    return Number(g.input-g.output)/1e6;
  };
  for(const x of ordered){
    const row=x.row,st=row.workflowState||row.state;
    const ok=Number(st?.mufStatus)===2&&Number(st?.elementalStatus)===2;
    all.push(row);if(ok)approved.push(row);
    const own=value([row]);
    const point=(v,items)=>({time:Number(x.time),value:v,id:row.evidenceId,lot:row.manifest?.lotReference||'Sem lote',count:items.length,status:clientProofStatus(st?.mufStatus)+' / '+clientProofStatus(st?.elementalStatus)});
    total.push(point(own===null?null:value(cumulative?all:[row]),cumulative?all:[row]));
    compliant.push(point(ok&&own!==null?value(cumulative?approved:[row]):null,cumulative?approved:ok?[row]:[]));
  }
  return {total,compliant,missing:rows.length-ordered.filter(x=>value([x.row])!==null).length};
}

async function productChainReadDocument(row){
  try{
    const meta=row.evidenceStorage;
    if(!meta?.storage_bucket||!meta.storage_path)throw new Error("Source document path unavailable");
    const signed=await supabaseClient.storage.from(meta.storage_bucket).createSignedUrl(meta.storage_path,900);
    if(signed.error)throw signed.error;
    const response=await fetch(signed.data.signedUrl,{cache:'no-store'});
    if(!response.ok)throw new Error("Source document unavailable in this session");
    const bytes=new Uint8Array(await response.arrayBuffer());
    const algorithm=String(meta.hash_algorithm||'').toUpperCase().replace(/-/g,'');
    let hash;
    if(algorithm==='SHA256')hash='0x'+Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
    else if(algorithm==='KECCAK256')hash=ethers.keccak256(bytes);
    else throw new Error("Unrecognized document algorithm");
    if(!clientBalanceSameHex(hash,row.evidenceHash))throw new Error("Source document hash mismatch");
    row.chainDocument=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));
  }catch(e){row.chainError=e.message||String(e);}
}
function productChainModel(rows,address){

  const byId=new Map(nodes.map(n=>[n.id,n]));

    const ref=n.row.chainDocument?.sourceEvidence;if(!ref)continue;
    try{
      const p=byId.get(String(ref.evidenceId).toLowerCase());

      if(p===n)throw new Error("Reference circular");
      if(Number(ref.chainId)!==11155111||!clientBalanceSameHex(ref.contractAddress,address))throw new Error("Source in a different contract or network");
      if(!p.row.jsonVerified||!n.row.jsonVerified)throw new Error("MUF calculation unavailable");
      if(!clientBalanceSameHex(ref.mufProofId,p.row.resultId)||!clientBalanceSameHex(ref.mufHash,p.row.resultHash))throw new Error("Reference points to a different MUF revision");
      if(ref.elementalProofId&&(!p.row.elementalVerified||!clientBalanceSameHex(ref.elementalProofId,p.row.elementalProofId)||!clientBalanceSameHex(ref.elementalHash,p.row.elementalHash)))throw new Error("ELEMENTAL reference not verified");
      const stream=p.row.elementalVerified?p.row.elementalResult?.calculation?.streams?.find(s=>s.streamId===ref.sourceStreamId&&s.side==='ACCOUNTED'):null;
      if(!stream)throw new Error("Source flow missing verified values");
      const allocation=mg(ref.allocatedDryMassKg);
      if(allocation<=0n||allocation>BigInt(stream.dryMassMg))throw new Error("Allocation exceeds the source flow");
      if(allocation!==BigInt(n.row.muf.calculation?.inputMassMg))throw new Error("Allocation does not match process input");

    }catch(e){n.issue=e.message;}

  const allocations=new Map();for(const n of nodes){if(n.parent){const key=n.parent.id+'|'+n.sourceStream;const group=allocations.get(key)||[];group.push(n);allocations.set(key,group);}}
  for(const group of allocations.values()){const first=group[0],s=first.parent.row.elementalResult.calculation.streams.find(s=>s.streamId===first.sourceStream&&s.side==='ACCOUNTED');if(group.reduce((sum,n)=>sum+n.allocation,0n)>BigInt(s.dryMassMg))for(const n of group)invalid.set(n,"Multiple operations allocate the same mass beyond its availability");}
  for(const [n,reason] of invalid){n.parent=null;n.issue=reason;}
  for(const n of nodes)if(n.parent)n.parent.children.push(n);
  return {nodes,roots:nodes.filter(n=>!n.parent),links:nodes.filter(n=>n.parent).length};
}

function clientBalanceRenderHistoryChart(){
  let panel=document.getElementById("clientMassHistoryChart");
  if(!panel){
    const history=document.getElementById("clientHistoryRows");
    if(!history) return;
    panel=document.createElement("section");
    panel.id="clientMassHistoryChart";
    panel.style.cssText="margin:24px 0;padding:20px;border:1px solid #24534f;border-radius:16px;overflow:auto";
    history.closest("table").parentElement.before(panel);
  }
  const points=[];
  const seen=new Set();
  for(const result of [...CLIENT_BALANCE_RESULTS].sort((a,b)=>a.createdAt-b.createdAt)){
    for(const pair of result.manifest.massPairs||[]){
      if(pair.leftMassMg==null||pair.rightMassMg==null) continue;
      const left=Number(pair.leftMassMg),right=Number(pair.rightMassMg);
      if(!Number.isFinite(left)||!Number.isFinite(right)||left<=0) continue;
      const key=result.resultId;
      if(seen.has(key)) continue;
      seen.add(key);
      points.push({result,pair,value:100*(left-right)/left});
    }
  }
  panel.innerHTML='<h3>Mass difference history</h3><p>One point per MUF revision, ordered by proof date. Tolerance is evaluated by its own workflow; this chart shows the measured difference only. Hover for details; click a point to open its result.</p>';
  if(!points.length){panel.insertAdjacentHTML("beforeend","<p>No comparable mass pairs with a positive outgoing mass.</p>");return;}
  const width=900,height=280,pad=50;
  const extent=Math.max(3,...points.map(p=>Math.abs(p.value)*1.15));
  const x=i=>pad+(width-2*pad)*(points.length===1?.5:i/(points.length-1));
  const y=v=>height/2-v*(height/2-pad)/extent;
  let svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-label="Historical MUF percentage differences" style="width:100%;min-width:560px">';

  for(const v of [-extent,0,extent]) svg+='<line x1="50" x2="850" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#63938a" stroke-dasharray="4 4"/><text x="2" y="'+(y(v)+4)+'" fill="#bbd9d3" font-size="12">'+v.toFixed(1)+'%</text>';
  points.forEach((p,i)=>{
    const title=clientBalanceDateFromUnix(p.result.createdAt)+' | '+p.result.manifest.lotReference+' | '+p.value.toFixed(4)+'% | '+clientBalanceKgFromMg(p.pair.leftMassMg)+' → '+clientBalanceKgFromMg(p.pair.rightMassMg)+' | Audit: '+p.result.auditState;
    svg+='<circle data-history-point="'+i+'" tabindex="0" role="button" aria-label="'+escaparHtml(title)+'" cx="'+x(i)+'" cy="'+y(p.value)+'" r="6" fill="'+(p.pair.status==='CONFORME'?'#37d8be':'#ff907b')+'" style="cursor:pointer"><title>'+escaparHtml(title)+'</title></circle>';
  });
  svg+='<text x="50" y="275" fill="#bbd9d3" font-size="12">'+escaparHtml(clientBalanceDateFromUnix(points[0].result.createdAt))+'</text><text x="850" y="275" text-anchor="end" fill="#bbd9d3" font-size="12">'+escaparHtml(clientBalanceDateFromUnix(points[points.length-1].result.createdAt))+'</text></svg>';
  panel.insertAdjacentHTML("beforeend",svg);
  panel.querySelectorAll("[data-history-point]").forEach(node=>{
    const open=()=>{document.getElementById("clientLiveResultSelect").value=points[Number(node.dataset.historyPoint)].result.resultId;clientBalanceRenderDashboard();};
    node.onclick=open;
    node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
  });
}

const PRODUCT_EXPLORER='https://sepolia.etherscan.io';
const PRODUCT_PROOF_EVENTS=[
 'event EvidenceSubmitted(bytes32 indexed evidenceId,bytes32 indexed actorId,address indexed submittedBy,bytes32 evidenceHash,uint64 createdAt)',
 'event ProofAnchored(bytes32 indexed proofId,bytes32 indexed evidenceId,uint8 indexed proofType,bytes32 committedHash,uint8 status,uint32 revision,bytes32 previousProofId,bytes32 inputCommitmentHash,bytes32 methodologyHash,bytes32 workflowId,uint64 createdAt)'

const PRODUCT_TX_CACHE=new Map();

async function productFindProofTransaction(provider,address,kind,record,active){
 const id=String(kind==='EvidenceSubmitted'?record.evidenceId:record.proofId);
 const key=address.toLowerCase()+':'+kind+':'+id.toLowerCase();if(PRODUCT_TX_CACHE.has(key))return PRODUCT_TX_CACHE.get(key);
 const iface=new ethers.Interface(PRODUCT_PROOF_EVENTS),stamp=Number(record.createdAt);
 if(!Number.isSafeInteger(stamp)||stamp<=0)throw Error("Registration date unavailable.");
 const head=await provider.getBlockNumber();let low=0,high=head;
 // Localiza o bloco pelo timestamp on-chain, sem varrer intervalos extensos.
 while(low<high){if(!active())throw Error("Selection changed.");const mid=Math.floor((low+high)/2);const block=await provider.getBlock(mid);if(!block)throw Error("Block unavailable through RPC.");if(Number(block.timestamp)<stamp)low=mid+1;else high=mid;}
 if(!active())throw Error("Selection changed.");
 const logs=await provider.getLogs({address,topics:[iface.getEvent(kind).topicHash,id],fromBlock:Math.max(0,low-1),toBlock:Math.min(head,low+1)});
 for(const log of logs){if(log.removed)continue;const parsed=iface.parseLog(log),a=parsed?.args;if(!a||!clientBalanceSameHex(a.evidenceId,record.evidenceId))continue;
 const hash=kind==='EvidenceSubmitted'?a.evidenceHash:a.committedHash;
 const expected=kind==='EvidenceSubmitted'?record.evidenceHash:record.committedHash;
 if(!clientBalanceSameHex(hash,expected)||Number(a.createdAt)!==stamp)continue;
 if(kind==='ProofAnchored'&&(!clientBalanceSameHex(a.proofId,record.proofId)||Number(a.proofType)!==Number(record.proofType)))continue;
 if(!/^0x[0-9a-f]{64}$/i.test(log.transactionHash))continue;
 PRODUCT_TX_CACHE.set(key,log.transactionHash);return log.transactionHash;}
 throw Error("Registration transaction not found.");
}
async function clientCurrentProofState(contract,evidenceId){
 const runner=contract.runner,provider=runner.provider||runner;
 const raw=await provider.call({to:await contract.getAddress(),data:contract.interface.encodeFunctionData('getCurrentProofState',[evidenceId])});
 const fields={128:'bytes32 mufHash,bytes32 elementalHash,uint8 mufStatus,uint8 elementalStatus',192:'bytes32 mufHash,bytes32 elementalHash,bytes32 auditHash,uint8 mufStatus,uint8 elementalStatus,uint8 auditStatus',384:'bytes32 mufHash,bytes32 toleranceHash,bytes32 elementalHash,bytes32 yieldHash,bytes32 multiStreamHash,bytes32 auditHash,uint8 mufStatus,uint8 toleranceStatus,uint8 elementalStatus,uint8 yieldStatus,uint8 multiStreamStatus,uint8 auditStatus'}[(raw.length-2)/2];
 if(!fields)throw Error("Unrecognized proof state format.");
 return ethers.AbiCoder.defaultAbiCoder().decode(['tuple('+fields+')'],raw)[0];

function checkedAddress(v){if(!ethers.isAddress(v)||v===ethers.ZeroAddress)throw Error("Enter a valid Ethereum address.");return ethers.getAddress(v);}
function checkedHash(v){if(!/^0x[0-9a-fA-F]{64}$/.test(v)||/^0x0{64}$/i.test(v))throw Error("Enter a nonzero 32-byte hash.");return v;}
function documentCommit(v){if(!v.trim())throw Error("Enter the document reference.");return ethers.keccak256(ethers.toUtf8Bytes(v.trim()));}
async function newLotsContext(write=false,address){
 const provider=write?new ethers.BrowserProvider(getWalletProvider()):await clientBalanceProvider();
 if(write)await provider.send('eth_requestAccounts',[]);
 if(Number((await provider.getNetwork()).chainId)!==11155111)throw Error("Switch to Sepolia.");
 const registry=new ethers.Contract(EXPLORERCHEM_CONTRACT_ADDRESS,EXPLORERCHEM_AUDIT_ABI,write?await provider.getSigner():provider);

 const linked=await registry.lotsContract();
 const target=checkedAddress(address|| (linked!==ethers.ZeroAddress?linked:localStorage.getItem(EXPLORECHEM_LOTS_KEY)||''));
 if(await provider.getCode(target)==='0x')throw Error("Lots contract not found.");
 const lots=new ethers.Contract(target,EXPLORECHEM_LOTS_ABI,write?await provider.getSigner():provider);
 if(!igualHex(await lots.registry(),EXPLORERCHEM_CONTRACT_ADDRESS))throw Error("This Lots contract belongs to another Registry.");
 if(linked!==ethers.ZeroAddress&&!igualHex(linked,target))throw Error("The Registry is linked to another Lots contract.");
 return {provider,registry,lots,linked,account:write?await (await provider.getSigner()).getAddress():null};
}
async function validateContractSet(provider,proofAddress,actorAddress,lotsAddress){
 if(Number((await provider.getNetwork()).chainId)!==11155111)throw Error("Select the Sepolia network.");
 const addresses=[proofAddress,actorAddress,lotsAddress].map(v=>checkedAddress(String(v).trim()));
 const codes=await Promise.all(addresses.map(a=>provider.getCode(a)));
 if(codes.some(c=>c==='0x'))throw Error("One of the addresses has no contract on Sepolia.");
 const registry=new ethers.Contract(addresses[0],['function actorRegistry() view returns(address)','function lotsContract() view returns(address)'],provider);
 const lots=new ethers.Contract(addresses[2],['function registry() view returns(address)'],provider);
 const [linkedActor,linkedLots,linkedRegistry]=await Promise.all([registry.actorRegistry(),registry.lotsContract(),lots.registry()]);
 if(!igualHex(linkedActor,addresses[1]))throw Error("The provided ActorRegistry does not match the ProofRegistry link.");
 if(!igualHex(linkedRegistry,addresses[0]))throw Error("The provided Lots contract belongs to another ProofRegistry.");
 if(linkedLots!==ethers.ZeroAddress&&!igualHex(linkedLots,addresses[2]))throw Error("ProofRegistry is already linked to another Lots contract.");
 return {addresses,linked:linkedLots!==ethers.ZeroAddress};
}

 button.disabled=true;status.textContent="Checking contracts on Sepolia…";
 try{

  const result=await validateContractSet(provider,document.getElementById('proofRegistryAddress').value,document.getElementById('actorRegistryConfig').value,document.getElementById('newLotsAddress').value);
  salvarEnderecoContrato(result.addresses[0]);
  localStorage.setItem('explorechem_actor_registry_address',result.addresses[1]);
  localStorage.setItem(EXPLORECHEM_LOTS_KEY,result.addresses[2]);
  const other=document.getElementById('contractAddressConfig');if(other)other.value=result.addresses[0];
  ADMIN_CONTEXT={checked:false,isAdmin:false,isOwner:false,owner:''};
  ATOR_ATIVO=null;persistirAtorAtivo();
  status.textContent=result.linked?"Addresses saved and on-chain links confirmed.":"Addresses saved. Click Link to Registry to complete the Lots link.";
 }catch(e){status.textContent=e.shortMessage||e.message||String(e);}finally{button.disabled=false;}
}

 const contractLine=document.createElement('p');contractLine.append("Contract · ",productExplorerAnchor(address,null,address));host.append(contractLine);
 const boxes={};
 for(const [key,title,selector] of [['evidence',"Evidence original",null],['muf',"MUF proof",'#clientLatestHash'],['elemental',"ELEMENTAL proof",'#clientElementalPanel']]){

  const status=document.createElement('p');status.className='product-proof-status';status.textContent="Finding registration transaction…";box.append(status);host.append(box);boxes[key]={box,dl,status};
 }
 const downloads=document.createElement('div');downloads.className='client-live-proof-actions';
 for(const [id,label] of [['clientProofButton','Abrir / salvar PDF'],['clientJsonButton','Baixar JSON MUF'],['clientElementalDownload','Baixar JSON ELEMENTAL']]){const source=document.getElementById(id);if(!source||source.disabled)continue;const button=document.createElement('button');button.className='btn ghost';button.textContent=label;button.onclick=()=>{if(active())document.getElementById(id)?.click();};downloads.append(button);}host.append(downloads);
 function linkBox(key,record,tx){const {box,dl,status}=boxes[key];if(dl)for(const dt of dl.querySelectorAll('dt')){const dd=dt.nextElementSibling;if(!dd)continue;const label=dt.textContent.trim();const value=dd.textContent.trim();if(key!=='evidence'&&label==='evidenceHash')continue;if(key!=='evidence'&&label==='evidenceId')continue;if(/^(mufHash|elementalHash|proofId|ELEMENTAL proofId|inputCommitmentHash|methodologyHash|evidenceHash|evidenceId)$/.test(label)&&/^0x[0-9a-f]{64}$/i.test(value))dd.replaceChildren(productExplorerAnchor(value,tx));if(label==='Contract')dd.replaceChildren(productExplorerAnchor(value,null,address));}
 status.replaceChildren("Transaction · ",productExplorerAnchor(tx,tx));}
 try{const provider=await clientBalanceProvider();const contract=new ethers.Contract(address,CLIENT_BALANCE_ABI,provider);
  const tasks=[['evidence',async()=>contract.getEvidence(selected.evidenceId),'EvidenceSubmitted'],['muf',async()=>contract.getProof(selected.resultId),'ProofAnchored'],['elemental',async()=>{const id=String(await contract.latestProofId(selected.evidenceId,3));if(CLIENT_BALANCE_ZERO.test(id))throw Error("No ELEMENTAL proof registered yet.");return contract.getProof(id);},'ProofAnchored']];
  // Sequencial para não disparar várias buscas de blocos simultaneamente.

   if(key==='evidence')for(const other of ['muf','elemental'])for(const dt of boxes[other].dl?.querySelectorAll('dt')||[]){if(['evidenceHash','evidenceId'].includes(dt.textContent.trim())){const dd=dt.nextElementSibling;dd.replaceChildren(productExplorerAnchor(dd.textContent,tx));}}

 activate(root.classList.contains('client-tokens-page')?'tokenization':'overview');
}

      <thead><tr><th>Report ID</th><th>Client</th><th>Sample</th><th>Status</th><th>Date</th><th class="num">Details</th></tr></thead>
      <tbody>
        ${laudosRecentes.length ? laudosRecentes.map(l => `
          <tr>
            <td class="mono" style="font-size:12px">${l.id}</td>
            <td>${l.cliente}</td>
            <td>${l.amostra}</td>
            <td>${vtag(l.status === 'aprovado' ? 'CONFORME' : (l.status === 'reprovado' ? 'DIVERGENTE' : 'PENDING'))}</td>
            <td>${l.data}</td>
            <td class="num"><button class="btn ghost sm dl">Abrir</button></td>
          </tr>
        `).join('') : "<tr><td colspan=\"6\" style=\"text-align:center;padding:28px\">No report registered.</td></tr>"}
      </tbody>
    </table>
  </div>

  <div class="quiet-warning" style="margin-top:18px">
    <span aria-hidden="true">📋</span>
    <div><b>Integrated quality control</b>
    <p>Reports are generated from evidence submitted by suppliers. The result is anchored and made available to authorized parties. All sensitive data remains in the private environment.</p></div>
  </div>

  <div class="actions" style="margin-top:16px">
    <button class="btn" id="novoLaudo">New report</button>
    <button class="btn ghost" id="verPendentes">View pending (${pendentes})</button>
  </div>
  `;
};

const UI_EN_PHRASES = [["Toda vez que este comprovante é aberto, o frontend atualiza a lista de evidências do Supabase e faz uma nova leitura da Sepolia. Uma nova evidência passa a aparecer automaticamente no próximo carregamento; se ainda estiver PENDING, ela será mostrada como PENDING até existir o evento on-chain de MATCH.","Every time this proof is opened, the frontend refreshes the Supabase evidence list and performs a new Sepolia read. New evidence appears automatically on the next load; if it is still PENDING, it remains PENDING until an on-chain MATCH event exists."],[" comprar ou revender o RWA não transfere a mercadoria. O titular solicita um valor de resgate à emissora; qualquer carteira pagadora pode quitar o valor solicitado, queimando o token na mesma transação. O preço do mercado secundário não determina o valor de resgate."," buying or reselling the RWA does not transfer the goods. The holder requests a redemption amount from the issuer; any payer wallet can settle the requested amount, burning the token in the same transaction. The secondary market price does not determine the redemption amount."],["Este resumo soma análises vinculadas aos lotes consultados; não representa estoque físico atual. Evidências de períodos ou etapas diferentes podem analisar o mesmo material. Os saldos elementais já estão contidos no material e não são adicionados à massa MUF.","This summary adds analyses linked to queried lots; it does not represent current physical stock. Different periods or stages may analyze the same material. Elemental balances are already contained in the material and are not added to MUF mass."],["Cada linha acompanha somente vínculos explícitos entre evidências. Operações sem vínculo ficam separadas. As massas das etapas não são somadas como estoque. Destinos declarados não comprovam recebimento. Dados visíveis respeitam o acesso desta sessão.","Each line follows explicit evidence relationships only. Unlinked operations remain separate. Stage masses are not added as stock. Declared destinations do not prove receipt. Visible data respects access for this session."],["Resultados por data de publicação das provas; sem prova ELEMENTAL, a lacuna usa a data MUF disponível. Os filtros usam os status atuais e a última revisão; este gráfico não reconstrói mudanças passadas de status nem representa estoque.","Results by proof publication date; without an ELEMENTAL proof, the gap uses the available MUF date. Filters use current status and latest revision; this chart does not reconstruct previous status changes or represent stock."],[" operações. Percentuais pela razão das somas. Base: entradas menos estoque final; produto: fluxos PRODUCT. Recuperação global inclui todas as saídas contabilizadas. Totais representam operações selecionadas, não saldo de estoque."," operations. Percentages use ratios of sums. Basis: inputs minus closing stock; product: PRODUCT flows. Overall recovery includes all accounted outputs. Totals represent selected operations, not current stock."],["A configuração Solana ainda aponta para o contrato Lots anterior. O upgrade do programa preservou essa configuração. Use Atualizar origem E1 pela Phantom com a carteira administradora antes de emitir; nenhuma emissão foi enviada.","Solana configuration still points to the previous Lots contract. The program upgrade preserved that configuration. Use Update E1 origin with Phantom with the administrator wallet before issuing; no issuance was sent."],["Os termos informados são vinculados ao commitment da emissão. A venda do lote físico não encerra o direito econômico. Para emitir e anunciar, use a carteira da empresa como titular inicial. Rede de testes Devnet.","The supplied terms are bound to the issuance commitment. Selling the physical lot does not close the economic right. Use the company wallet as initial holder to issue and list. Devnet test network."],["Na visão Total, valores existentes em resultados DIVERGENT ou NOT_ATTESTED não se tornam atestados. JSON sem integridade verificada não fornece valores. Registros sem cálculo permanecem na cobertura.","In Total view, values from DIVERGENT or NOT_ATTESTED results do not become attested. JSON without verified integrity supplies no values. Records without calculations remain in coverage."],["Os laudos são gerados a partir de evidências enviadas pelos fornecedores. O resultado é ancorado e disponível para as partes autorizadas. Todos os dados sensíveis permanecem no ambiente privado.","Reports are generated from evidence submitted by suppliers. The result is anchored and made available to authorized parties. All sensitive data remains in the private environment."],["Esta simulação utiliza k = 3 e σ definido por elemento. Como o veredito depende desses valores, ele herda a marca arbitrada até que a política de tolerância seja aprovada, medida e versionada.","This simulation uses k = 3 and σ defined per element. Because the verdict depends on these values, it remains marked as an assumption until the tolerance policy is approved, measured, and versioned."],["Troque o endereço aqui quando fizer um novo deploy. O valor fica salvo somente neste navegador e passa a ser usado pelo cadastro de atores, envio de evidências e consultas on-chain.","Change the address here after a new deployment. The value is stored only in this browser and will be used for actor registration, evidence submission, and on-chain queries."],["O resultado foi selecionado no histórico, mas os valores de massa precisam vir do resultado específico produzido pelo CRE/TEE. O sistema não reutiliza os números de outro balanço.","The result was selected from history, but its mass values must come from the specific result produced by CRE/TEE. The system does not reuse values from another balance."],["Estas são somas de operações selecionadas, não saldo de estoque. Desmarque reenvios ou etapas que representam o mesmo material. Não somamos etapas diferentes em um único estoque.","These are sums of selected operations, not stock balances. Deselect resubmissions or stages that represent the same material. Different stages are not combined into a single stock balance."],["Saldo nas carteiras emissoras dos lotes selecionados. Transferências para outras carteiras não estão incluídas; esta versão não separa empresas que compartilham a mesma carteira.","Balance in issuer wallets of selected lots. Transfers to other wallets are excluded; this version does not distinguish companies sharing the same wallet."],["Reservas e liberações alteram o saldo disponível. Saída ou consumo não significa necessariamente venda. Os elementos estão contidos na massa material e não são somados novamente.","Reservations and releases change available balance. Outflow or consumption does not necessarily mean a sale. Elements are contained in material mass and are not added again."],["Massas, composição e laudos permanecem privados. O RWA representa um direito econômico, sem transferir a mercadoria. Carteiras, ofertas e pagamentos SOL são públicos na Solana.","Masses, composition and reports remain private. The RWA represents an economic right without transferring the goods. Wallets, offers and SOL/USDT payments are public on Solana."],["A carteira conectada da empresa será o titular inicial. Qualquer outra carteira pode pagar o resgate solicitado com seus próprios SOL. O attestor participa somente da emissão.","The company's connected wallet will be the initial holder. Any other wallet can pay the requested redemption with SOL or the configured USDT. The attestor participates only in issuance."],["Você visualiza somente a coleta, a entrega e as ocorrências sob sua responsabilidade. O grafo completo e o identificador do grupo privado não são enviados para esta tela.","You only see the collection, delivery, and incidents under your responsibility. The complete graph and private-group identifier are not sent to this screen."],["são conferidos diretamente na Ethereum Sepolia. O arquivo original é baixado por URL assinada e seu hash é recalculado localmente para comparação com a âncora on-chain.","are checked directly on Ethereum Sepolia. The original file is downloaded through a signed URL and its hash is recomputed locally for comparison with the on-chain anchor."],["A tela do cliente mostra o resultado autorizado e suas provas. Os documentos originais continuam disponíveis na área própria de evidências, sem duplicação nesta visão.","The client screen shows the authorized result and its proofs. Original documents remain available in the dedicated evidence area, without duplication in this view."],["Esta visão é somente leitura e representa o seu recorte autorizado. Ela não expõe o grafo privado completo, relações comerciais de terceiros nem arquivos originais.","This view is read-only and represents your authorized scope. It does not expose the complete private graph, third-party commercial relationships, or original files."],["? Você paga com seus próprios SOL e não recebe o token. Pagamento e queima acontecem juntos. A carteira também paga taxas. Sem saldo, o pedido continua pendente.","? You pay with your own SOL and do not receive the token. Payment and burn happen together. Your wallet also pays fees. Without sufficient funds, the request remains pending."],["Este hash é só seu. Ele deriva do resultado do período somado ao seu recorte de dados, então difere do que os demais participantes receberam pelo mesmo período.","This hash is yours only. It is derived from the period result plus your authorized data scope, so it differs from what other participants received for the same period."],["A titularidade econômica acompanha a unidade Token-2022 atualmente possuída. A identidade empresarial continua vinculada ao actorId fora da cadeia pública.","Economic ownership follows the Token-2022 unit currently held. Company identity remains linked to actorId outside the public chain."],["O cliente continua somente leitura: pode conferir o balanço, o resultHash e os documentos disponibilizados, mas não altera evidências nem envia arquivos.","The client remains read-only: they can review the balance, resultHash, and available documents, but cannot modify evidence or upload files."],["Só a sua corrente aparece detalhada. As outras entradas, o produto, o rejeito e o efluente entram no cálculo sem que os valores cheguem até você.","Only your flow is shown in detail. Other inputs, product, reject, and effluent are included in the calculation without exposing their values to you."],["A conexão Solana não foi disponibilizada nesta página. Confira se a Phantom está habilitada para este site, desbloqueie a carteira e recarregue.","Solana connection unavailable on this page. Check that Phantom is enabled for this site, unlock your wallet and reload."],["Consolidação local baseada nos resultados privados e provas consultadas. Não publica nem altera os status YIELD / MULTI_STREAM na blockchain.","Local consolidation based on queried private results and proofs. Does not publish or change YIELD / MULTI_STREAM statuses on-chain."],["Você vê diretamente o balanço associado ao seu pedido e ao fornecedor selecionado, sem acessar a cadeia completa ou documentos de terceiros.","You directly see the balance associated with your request and the selected supplier, without access to the full chain or third-party documents."],["As fatias representam a massa deste lote. Os elementos já estão incluídos na massa total. A massa restante não tem composição especificada.","Slices represent this lot's mass. Elements are already included in total mass. The remaining mass has unspecified composition."],[" registro(s) selecionado(s) fora desta série ou sem valor. Acumulados representam apenas valores conhecidos; lacunas não equivalem a zero."," selected record(s) outside this series or without a value. Cumulative totals include only known values; gaps are not zero."],["O arquivo original permite recalcular o evidenceHash. O relatório do balanço é um artefato separado dos documentos de cada participante.","The original file can be used to recompute the evidenceHash. The balance report is a separate artifact from each participant’s documents."],["Comprovante consultável que cruza o arquivo privado e a identidade legível do ExploreChem com o estado público e os eventos do contrato.","Reviewable proof that cross-checks the private file and ExploreChem’s readable identity layer against public state and contract events."],["Este é o resultado do ator selecionado para o pedido. O cliente recebe o balanço pronto, não os documentos brutos usados pelo workflow.","This is the selected actor’s result for the request. The client receives the completed balance, not the raw documents used by the workflow."],["Dados privados deste lote não estão acessíveis. A origem precisa disponibilizar o documento e a prova para esta conta antes do aceite.","Private data for this lot is inaccessible. The source must make the document and proof available to this account before receipt acceptance."],["Publicar envia o token ao escrow; comprar transfere SOL e token na mesma transação. A simulação interrompe instruções não disponíveis.","Listing sends the token to escrow; buying transfers the offer currency (SOL or USDT) and the token in the same transaction. Simulation stops unsupported instructions."],["Tudo em miligramas de elemento, base seca a 105 °C. Óxido é apresentação: nenhuma massa de óxido entra na identidade de conservação.","All values are in milligrams of element, on a dry basis at 105 °C. Oxide is only the presentation form: no oxide mass enters the conservation identity."],[" transação(ões) anteriores confirmadas. Ao tentar novamente, as etapas existentes serão consultadas e reaproveitadas. Assinaturas: "," previous transaction(s) confirmed. A retry will query and reuse completed steps. Signatures: "],[" opaco. Este artefato não afirma que o nome está on-chain; ele prova que o registro off-chain do participante aponta para o mesmo "," opaque identifier. This artifact does not claim that the name is on-chain; it proves that the participant’s off-chain record points to the same "],["A blockchain não contém nomes empresariais, lotId, massa, teor, documentos ou relações privadas. O vínculo legível é feito pelo ","The blockchain does not contain company names, lotId, mass, grade, documents, or private relationships. The readable link is made through the "],["Resultado da evidência selecionada, não saldo atual de tokens. Estoque inicial e final não são somados como materiais distintos.","Selected evidence result, not current token balance. Opening and closing stock are not added as separate materials."],["mudar este campo não migra dados do contrato anterior. Ele apenas define qual contrato o frontend usará nas próximas operações.","changing this field does not migrate data from the previous contract. It only defines which contract the frontend will use for future operations."],["Envie o laudo analítico da amostra. O documento recebe um hash no momento do envio e fica disponível para a correlação do lote.","Submit the analytical report for the sample. The document is hashed at submission and becomes available for lot correlation."],["O contrato configurado ainda usa o fluxo antigo. Para enviar sem prazo e receber por aceite, configure o novo Lots de custódia.","The configured contract still uses the previous flow. To transfer without a deadline and receive by acceptance, configure the new custody Lots contract."],["O balanço selecionado está disponível para consulta. A auditoria adicionará uma segunda camada de verificação quando concluir.","The selected balance is available for review. The audit will add a second verification layer when it is completed."],["Cada RWA permanece ligado ao actorId, ao identificador do lote de origem e ao Mint. Supply e posse são consultados na Devnet.","Each RWA remains linked to actorId, its source lot identifier and Mint. Supply and ownership are queried on Devnet."],["As massas da transportadora corroboram a corrente do remetente e do destinatário. Elas não são somadas novamente no balanço.","Carrier masses corroborate the sender and recipient flows. They are not added to the balance a second time."],["Um cadastro por papel. A mesma empresa pode ser laboratório numa operação e fornecedora noutra, e são identidades separadas.","One registration per role. The same company may be a laboratory in one operation and a supplier in another; these are separate identities."],["Cada prova é contada uma vez, mesmo quando gera vários tokens elementais. Diferenças absolutas não se anulam entre balanços.","Each proof is counted once, even when it creates multiple elemental tokens. Absolute differences do not cancel across balances."],["O banco exige uma sessão autenticada do Supabase para registrar a evidência. A carteira sozinha não substitui esse usuário.","The database requires an authenticated Supabase session to register evidence. A wallet alone does not replace that user session."],["ocorrências sob sua responsabilidade. O grafo completo e o identificador do grupo privado não são enviados para esta tela.","incidents under your responsibility. The full graph and private group identifier are not sent to this screen."],["Confira a massa e os elementos de cada lote antes de aceitar. Envios pendentes ficam fora da lista de lotes disponíveis.","Check each lot's mass and elements before accepting. Pending transfers are excluded from available lots."],[" SOL à emissora? O token ficará em escrow, sem venda, até o pagamento integral solicitado. Solicitar não queima o token."," SOL from the issuer? The token remains in escrow, unavailable for sale, until full payment of the requested amount. Requesting redemption does not burn the token."],["Preço da oferta, sem fixar o valor de resgate. Para mudar o preço após anunciar, cancele a oferta e anuncie novamente.","Offer price, without fixing the redemption amount. To change the price after listing, cancel the offer and list again."],["Este registro já pode ser selecionado no histórico, mas o resultado de massa específico ainda precisa ser carregado.","This record can already be selected from history, but its specific mass result still needs to be loaded."],["Visão geral dos laudos emitidos e amostras em processo. Resultados são ancorados na blockchain para rastreabilidade.","Overview of issued reports and samples in process. Results are anchored on-chain for traceability."],["Selecione o lote e a empresa destinatária. O lote entra no estoque da destinatária quando ela aceitar o recebimento.","Select the lot and recipient company. The lot enters the recipient's stock when they accept receipt."],["Transação expirada. Operação interrompida sem envio e sem nova assinatura automática. Clique novamente para retomar.","Transaction expired. Operation stopped without submission or an automatic new signature. Click again to resume."],["Escolha primeiro o ator e depois o balanço daquele ator. O resultado mais recente fica selecionado automaticamente.","Choose the actor first, then choose one of that actor’s balances. The most recent result is selected automatically."],["Quando o CRE/TEE concluir um período de reconciliação, o balanço, as correntes e a prova ancorada aparecerão aqui.","When CRE/TEE completes a reconciliation period, the balance, flows, and anchored proof will appear here."],["os campos auxiliares organizam o envio; os valores oficiais são extraídos e validados a partir do laudo ancorado.","helper fields organize submission; official values are extracted and validated from the anchored report."],["Saldo disponível por empresa, consultado na blockchain. Quantidades bloqueadas em pedidos não entram neste saldo.","Available balance per company, queried on-chain. Quantities locked in orders are excluded."],["Você está vendo somente este resultado autorizado. Trocar o segundo seletor muda o balanço sem misturar pedidos.","You are viewing only this authorized result. Changing the second selector switches the balance without mixing requests."],["RWA criado, sem oferta publicada nesta leitura da Solana. Para anunciar, use Vender / revender na tabela abaixo.","RWA created, without a published offer in this Solana read. Use Sell / resell in the table below to list it."],["Emissão automática pelo relatório ELEMENTAL autorizado, com MUF CALCULATED. Não há fila administrativa de mint.","Automatic issuance through the authorized ELEMENTAL report with MUF CALCULATED. No administrator mint queue."],["A Series e o Mint Token-2022 serão criados automaticamente na Solana Devnet. O Mint não é digitado manualmente.","The Series and Token-2022 Mint are created automatically on Solana Devnet. The Mint is not entered manually."],["O balanço CRE/TEE está disponível. A auditoria independente ainda não concluiu a verificação deste resultado.","The CRE/TEE balance is available. The independent audit has not yet completed verification of this result."],["O produto purificado enviado pela Neodym coincide com a massa de Nd2O3 declarada como entrada pela Magnetra.","The purified product sent by Neodym matches the Nd2O3 mass declared as input by Magnetra."],["Emissão e oferta ativa não são rendimento de produção. Documentos, provas e transações estão na Comprovação.","Issuance and an active offer are not production yield. Documents, proofs and transactions are in Proof."],["O cálculo original permanece preservado, mas a auditoria encontrou divergência e o resultado exige revisão.","The original calculation remains preserved, but the audit found a divergence and the result requires review."],["Use “Enviar evidência” para registrar o primeiro documento. Ele aparece aqui logo após a ancoragem do hash.","Use “Submit evidence” to register the first document. It appears here immediately after the hash is anchored."],["O cadastro deve manter os lotes na empresa responsável. Envie para outra empresa pela aba Lotes do cliente.","Registration must keep lots with the responsible company. Use the client Lots tab to send them to another company."],["Referência = entradas + estoque inicial. Contabilizado = produtos + sucata + outras saídas + estoque final.","Reference = inputs + opening stock. Accounted = products + scrap + other outputs + closing stock."],["Em produção, API e RLS entregam somente o recorte autorizado. Documentos e relações não vão para a cadeia.","In production, the API and RLS expose only the authorized scope. Documents and relationships are not written to the blockchain."],["Use “Registrar transporte” para enviar o documento de custódia. Ele aparece aqui após a ancoragem do hash.","Use “Register transport” to submit the custody document. It appears here after the hash is anchored."],["Esta carteira receberá os tokens destinados à empresa. Ela poderá ser alterada depois em uma tela própria.","This wallet will receive tokens for the company. It can be changed later in the dedicated screen."],["O registro local ainda não foi localizado na leitura da Solana. Atualize antes de realizar outra operação.","The local record was not found in the Solana read yet. Refresh before another operation."],["Quando o workflow auditor publicar VERIFIED ou DIVERGENT, esta mesma tela muda automaticamente de estado.","When the auditor workflow publishes VERIFIED or DIVERGENT, this same screen updates automatically."],["O Operator cadastra atores e acompanha o processamento, mas não edita campos nem envia arquivos na visão ","The Operator registers actors and monitors processing, but cannot edit fields or upload files in the "],["Quando um participante enviar um documento, ele aparece aqui como pendente até a correlação ser validada.","When a participant submits a document, it appears here as pending until correlation is validated."],["O Operador cadastra atores e acompanha o processamento, mas não edita campos nem envia arquivos na visão ","The Operator registers actors and monitors processing, but cannot edit fields or upload files in the "],[" do mint Token-2022 é a titular atual do direito econômico. Holder anterior não mantém direito residual."," of the Token-2022 mint is the current owner of the economic right. Previous holders retain no residual right."],["distintas, saídas e inventários foram normalizados e recalculados a partir das evidências verificadas.","different origins, outputs, and inventories were normalized and recalculated from verified evidence."],["Assim que sua evidência for correlacionada com a contraparte, os participantes visíveis aparecem aqui.","Once your evidence is correlated with the counterparty, visible participants will appear here."],["Abra uma evidência na lista para ver o arquivo original, os campos extraídos e o resultado das regras.","Open evidence from the list to view the original file, extracted fields, and rule results."],["Saldo disponível após cada transação. A perda já está refletida no saldo e não é descontada novamente.","Available balance after each transaction. Loss is already reflected in the balance and is not deducted again."],["Lista das evidências autorizadas indexadas no Supabase; não é uma varredura de todos os lotes da rede.","Authorized evidence indexed in Supabase; this is not a scan of all lots on the network."],["Quando o workflow auditor concluir, somente este balanço selecionado muda para VERIFIED ou DIVERGENT.","When the auditor workflow completes, only this selected balance changes to VERIFIED or DIVERGENT."],["confirma o hash, extrai novamente os dados do documento e valida as relações antes de marcar MATCHED.","confirms the hash, extracts the document data again, and validates relationships before marking MATCHED."],["O balanço foi calculado pelo CRE/TEE, ancorado e posteriormente confirmado pela camada de auditoria.","The balance was calculated by CRE/TEE, anchored, and later confirmed by the audit layer."],["A transação anterior reverteu. O cadastro ficou como ANCHOR_FAILED. Você pode iniciar um novo envio.","The previous transactio async function actorRegistryAddress(provider){
  const registry=new ethers.Contract(EXPLORERCHEM_CONTRACT_ADDRESS,["function actorRegistry() view returns (address)"],provider);
  return await registry.actorRegistry();

async function adminContractContext(requireAdmin=true){
  if(!walletAddress) throw new Error("Connect the administrator wallet.");
  const chainAtual=await refreshWalletChain();
  if(chainAtual!=="0xaa36a7") throw new Error("Switch the wallet network to Sepolia.");
  if(!window.ethers) throw new Error("Web3 library did not load.");
  const provider=new ethers.BrowserProvider(getWalletProvider());
  const signer=await provider.getSigner();
  const contract=new ethers.Contract(await actorRegistryAddress(provider),ADMIN_ABI,signer);
  const [ownerAddress,allowed]=await Promise.all([contract.owner(),contract.isAdmin(walletAddress)]);
  ADMIN_CONTEXT={checked:true,isAdmin:!!allowed,isOwner:String(ownerAddress).toLowerCase()===walletAddress.toLowerCase(),owner:String(ownerAddress)};
  if(requireAdmin&&!allowed) throw new Error("The connected wallet is not an administrator for this contract.");
  return {provider,signer,contract};
}

async function adminLoadPending(){
  ADMIN_SCAN_MESSAGE="Querying requests on-chain…";
  if(role==="op"&&page==="admin") render();
  try{
    const {provider,contract}=await adminContractContext(true);
    const actorAddress=await contract.getAddress();
    const latest=await provider.getBlockNumber();
    const from=Math.max(0,latest-600000);
    const iface=new ethers.Interface(ADMIN_ABI);
    const topic=iface.getEvent("ActorRegistrationRequested").topicHash;
    const logs=[];
    const chunk=50000;
    for(let start=from;start<=latest;start+=chunk){
      const end=Math.min(latest,start+chunk-1);
      try{logs.push(...await provider.getLogs({address:actorAddress,topics:[topic],fromBlock:start,toBlock:end}));}
      catch(error){
        for(let small=start;small<=end;small+=10000){
          logs.push(...await provider.getLogs({address:actorAddress,topics:[topic],fromBlock:small,toBlock:Math.min(end,small+9999)}));
        }
      }
    }
    const byActor=new Map();
    logs.forEach(log=>{try{const p=iface.parseLog(log);byActor.set(String(p.args.actorId).toLowerCase(),{actorId:String(p.args.actorId),controller:String(p.args.controller),registrationHash:String(p.args.registrationHash),requestedAt:new Date(Number(p.args.requestedAt)*1000).toLocaleString("en-US"),blockNumber:log.blockNumber});}catch(_){}});
    let dbRows=[];
    try{
      const response=await supabaseClient.from("explorerchem_actors").select("id,actor_id,display_name,country_code,active,created_at");
      if(!response.error&&Array.isArray(response.data))dbRows=response.data;
    }catch(_){ }
    const dbMap=new Map(dbRows.map(a=>[String(a.actor_id).toLowerCase(),a]));
    const requests=[];
    for(const item of byActor.values()){
      try{
        const actor=await contract.getActor(item.actorId);
        const status=Number(actor.status);
        if(status!==1)continue;
        const db=dbMap.get(item.actorId.toLowerCase());
        requests.push({...item,status,companyName:db?.display_name||"",country:db?.country_code||"",dbId:db?.id||null});
      }catch(_){ }
    }
    ADMIN_REQUESTS=requests.sort((a,b)=>b.blockNumber-a.blockNumber);
    ADMIN_SCAN_MESSAGE=ADMIN_REQUESTS.length?"":"No PENDING requests found in the contract.";
  }catch(error){
    ADMIN_REQUESTS=[];
    ADMIN_SCAN_MESSAGE=error.message||"Could not query requests.";
    toast(ADMIN_SCAN_MESSAGE);
  }
  if(role==="op"&&page==="admin")render();
}

async function adminDecideActor(actorId,approve,button){
  const original=button.textContent;
  button.disabled=true;button.textContent=approve?"Aprovando…":"Rejeitando…";
  try{
    const {contract}=await adminContractContext(true);
    const decisionHash=ethers.keccak256(ethers.toUtf8Bytes(JSON.stringify({schemaVersion:"explorechem.actor.decision.v1",action:approve?"APPROVE":"REJECT",actorId,decidedBy:walletAddress,timestamp:new Date().toISOString()})));
    const tx=approve?await contract.approveActorRegistration(actorId,decisionHash):await contract.rejectActorRegistration(actorId,decisionHash);
    await tx.wait();
    const request=ADMIN_REQUESTS.find(r=>r.actorId.toLowerCase()===actorId.toLowerCase());
    if(request?.dbId){
      const update={active:!!approve};
      if(approve)update.onchain_registered_at=new Date().toISOString();
      const result=await supabaseClient.from("explorerchem_actors").update(update).eq("id",request.dbId);
      if(result.error)console.warn("On-chain decision confirmed; database not updated:",result.error.message);
    }
    toast(approve?"Company approved on-chain.":"Request rejected on-chain.");
    await carregarAtores();
    await adminLoadPending();
  }catch(error){console.error(error);toast(error.message||"Could not complete the decision.");}
  finally{button.disabled=false;button.textContent=original;}
}

async function adminSetWalletPermission(authorized,button){
  const target=$("#adminWalletInput")?.value.trim();
  if(!target||!window.ethers?.isAddress(target)){toast("Enter a valid Ethereum wallet.");return;}
  const original=button.textContent;button.disabled=true;button.textContent="Confirmando…";
  try{
    const {contract}=await adminContractContext(true);
    if(!ADMIN_CONTEXT.isOwner)throw new Error("Only the owner wallet can change administrators.");
    const tx=await contract.setAdmin(target,authorized);await tx.wait();
    toast(authorized?"Administrator autorizado.":"Administrator permission revoked.");
  }catch(error){console.error(error);toast(error.message||"Could not change administrator.");}
  finally{button.disabled=false;button.textContent=original;}
}

function actorStockAggregate(rows){
 const groups=new Map();let total=0n,materialTotal=0n,unidentified=0;
 for(const row of rows){
  if(!row.identity){unidentified++;continue;}
  if(row.identity.material)materialTotal+=BigInt(row.balance);
  const components=row.identity.material?row.currentComponents:[{element:row.identity.element,basisHash:row.lot.basisHash,quantity:row.balance}];
  if(!components){unidentified++;continue;}
  for(const component of components){const q=BigInt(component.quantity);if(!q)continue;const key=component.basisHash.toLowerCase();const g=groups.get(key)||{element:component.element,quantity:0n,lots:0};g.quantity+=q;g.lots++;groups.set(key,g);total+=q;}
 }
 return {groups:[...groups.values()],total,materialTotal,unidentified};
}
async function actorReadComposition(c,row,actorId,blockTag){

 const seen=new Set();let total=0n;
 row.currentComponents=cs.map(x=>{const key=x.basisHash.toLowerCase(),quantity=BigInt(x.quantity);if(seen.has(key)||!names.has(key)||quantity<0n)throw Error("Current composition incompatible with the proof");seen.add(key);total+=quantity;return {basisHash:x.basisHash,element:names.get(key),quantity};});
 if(total>BigInt(row.balance))throw Error("Current composition exceeds material balance");
}

async function actorLotIdentity(c,lot,blockTag){
 const p=await c.registry.getProof(lot.elementalProofId,{blockTag});
 if(!igualHex(p.proofId,lot.elementalProofId)||!igualHex(p.evidenceId,lot.evidenceId)||Number(p.proofType)!==3||Number(p.status)!==2)throw Error("ELEMENTAL proof incompatible with lot");
 const path='elemental-results/'+lot.evidenceId.slice(2).toLowerCase()+'/'+lot.elementalProofId.slice(2).toLowerCase()+'.json';
 const signed=await supabaseClient.storage.from(EVIDENCE_BUCKET).createSignedUrl(path,900);if(signed.error)throw signed.error;
 const response=await fetch(signed.data.signedUrl,{cache:'no-store'});if(!response.ok)throw Error("Private result unavailable");
 const bytes=new Uint8Array(await response.arrayBuffer());if(!igualHex(ethers.keccak256(bytes),p.committedHash))throw Error("Private hash mismatch");
 const doc=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes)),r=doc.result;
 const calculations=Array.isArray(r?.elements)?r.elements.filter(e=>e.status==='COMPLIANT'&&e.calculation).map(e=>e.calculation):[r?.calculation].filter(Boolean);
 const materialBasis=ethers.keccak256(ethers.toUtf8Bytes('ExploreChem/MaterialMass/dry/mg/v1'));
 if(igualHex(lot.basisHash,materialBasis)){
  if(doc.schema!=='ExploreChem/PrivateElementalResult/v1'||r?.status!=='COMPLIANT'||!igualHex(r.evidenceId,lot.evidenceId)||!igualHex(r.expectedEvidenceHash,p.evidenceHash)||!igualHex(r.mufProofId,lot.mufProofId))throw Error("Incompatible material identity");
  const matches=(doc.action?.outputs||[]).filter(o=>igualHex(o.streamId,lot.streamId)&&igualHex(o.metadataHash,lot.metadataHash)&&igualHex(o.basisHash,lot.basisHash));
  if(matches.length!==1||BigInt(matches[0].quantity)!==BigInt(lot.issued)||!igualHex(doc.action.operationId,lot.operationId))throw Error("Material issuance does not match the proof");
  const output=matches[0],hash=clientBalanceHashStable;
  const stream=calculations[0]?.streams?.find(x=>igualHex(hash({domain:'ExploreChem/MaterialStream/v1',evidenceId:r.evidenceId,streamId:x.streamId}),lot.streamId));
  if(!stream)throw Error("Material flow missing");
  const assays=calculations.map(calc=>{const found=calc.streams.filter(x=>x.streamId===stream.streamId);if(found.length!==1||BigInt(found[0].dryMassMg)!==BigInt(output.quantity))throw Error("Incompatible flow mass");return {element:calc.element,stream:found[0]};});
  if(!igualHex(hash({domain:'ExploreChem/MaterialMetadata/v1',evidenceId:r.evidenceId,evidenceHash:r.expectedEvidenceHash,unit:'mg',massBasis:'DRY',streamId:stream.streamId,assays}),lot.metadataHash))throw Error('Metadados materiais divergentes');
  const components=assays.filter(a=>BigInt(a.stream.containedElementMassMg)>0n).map(a=>({element:a.element,basisHash:hash({domain:'ExploreChem/ElementMassBasis/v1',element:a.element,unit:'mg'}),quantity:BigInt(a.stream.containedElementMassMg)}));
  if(components.length!==output.components?.length||components.some((x,i)=>!igualHex(x.basisHash,output.components[i].basisHash)||x.quantity!==BigInt(output.components[i].quantity)))throw Error("Issued composition mismatch");
  return {material:true,element:'Material · '+components.map(x=>x.element).join(' / '),components,unit:'mg',stream:stream.streamId,proof:p,path,bytes,result:r};
 }
 const matching=calculations.filter(calc=>igualHex(clientBalanceHashStable({domain:'ExploreChem/ElementMassBasis/v1',element:calc.element,unit:'mg'}),lot.basisHash));
 const calc=matching.length===1?matching[0]:null;
 if(doc.schema!=='ExploreChem/PrivateElementalResult/v1'||!calc||!igualHex(r.evidenceId,lot.evidenceId)||!igualHex(r.expectedEvidenceHash,p.evidenceHash)||!igualHex(r.mufProofId,lot.mufProofId))throw Error("Incompatible private identity");
 const element=calc.element;if(typeof element!=='string'||!element.length)throw Error("Element ausente");
 const hash=clientBalanceHashStable;
 if(!igualHex(hash({domain:'ExploreChem/ElementMassBasis/v1',element,unit:'mg'}),lot.basisHash))throw Error("Incompatible unit basis");
 const stream=calc.streams?.find(stream=>igualHex(hash({domain:'ExploreChem/TokenStream/v1',evidenceId:r.evidenceId,streamId:stream.streamId,element}),lot.streamId)&&igualHex(hash({domain:'ExploreChem/TokenMetadata/v1',evidenceId:r.evidenceId,evidenceHash:r.expectedEvidenceHash,element,unit:'mg',stream}),lot.metadataHash));
 if(!stream)throw Error("Flow and metadata do not match the lot");
 return {element,unit:'mg',stream:stream.streamId,proof:p,path,bytes,result:r};
}
